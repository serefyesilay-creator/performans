          <div class="cl-ad-t"><b>${esc(a.name)}</b><select class="cl-sel" onchange="clAdSet('${id}','${a.id}','state',this.value)">${Object.entries(CL_STATE).map(([k, v]) => `<option value="${k}" ${a.state === k ? 'selected' : ''}>${k === 'durdu' ? 'Durdur ve arşivle…' : v}</option>`).join('')}</select></div>
          <div class="cl-hint">Başlangıç ${clFmt(a.startedAt)} · ${adSpan(a) || 0}. gün</div>
          <div class="cl-ad-stats"><div><span>Harcama</span><b>${adMoney(t.spend)}</b></div><div><span>${esc(a.unit)}</span><b>${nf(t.res, 0)}</b></div><div><span>Sonuç başı</span><b>${adMoney(t.cpr)}</b></div></div>
          <div class="cl-kv"><span>Neden kurduk</span>${esc(a.why) || '—'}</div>
          <div class="cl-kv"><span>Beklenti</span>${esc(a.expectation) || '—'}</div>
          <div class="cl-kv"><span>Sonuç notu</span></div>
          <textarea class="cl-ta" placeholder="Ne oldu? Maliyet, mesaj sayısı, karar…" onchange="clAdSet('${id}','${a.id}','result',this.value.trim())">${esc(a.result)}</textarea>
          <span class="cl-ad-open">📊 Tabloyu ve zaman çizelgesini aç →</span>
        </div>`; }).join('') : '<div class="cl-hint">Aktif reklam yok. "Reklam ekle" ile neden kurduğunu ve ne beklediğini yaz; sonra karta tıklayıp günlük rakamları tabloya girersin.</div>'}</div>
    </div>

    ${arc.length ? `<div class="cl-sec"><div class="cl-sec-h"><h3>Kapanan reklamlar · arşiv</h3><button class="cl-btn sm" onclick="adArchiveOpen('${id}')">Tablo olarak aç</button></div>
      <div class="cl-arc">${arc.map(a => { const t = adTotals(adNorm(a)); return `<div class="cl-arc-row" onclick="adOpen('${id}','${a.id}')"><b>${esc(a.name)}</b>
        <span class="m">${clFmt(a.startedAt)} → ${clFmt(a.endedAt)} · ${adMoney(t.cpr)}</span><span class="n">${esc(a.closeNote) || '—'}</span></div>`; }).join('')}</div></div>` : ''}

    <div class="cl-sec">
      <div class="cl-sec-h"><h3>Kayıt geçmişi</h3>
        <div class="cl-seg">${Object.entries(CL_KIND).map(([k, v]) => `<button class="${clKindSel === k ? 'on' : ''}" onclick="clKind('${k}')">${v}</button>`).join('')}</div></div>
      <div class="cl-form" id="cl-note-form">
        ${clKindSel !== 'not' ? `<label>Kanal<select class="cl-sel" id="cl-note-chan">${CL_CHANNELS.map(ch => `<option>${ch}</option>`).join('')}</select></label>` : ''}
        <label>Tarih<input class="cl-in" type="date" id="cl-note-date" value="${clToday()}"></label>
        <label class="full">Açıklama<textarea class="cl-ta" id="cl-note-text" placeholder="Ne konuşuldu, ne gönderildi, ne karar verildi?"></textarea></label>
        <div class="full" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="cl-hint">${clKindSel === 'not' ? 'Not son temas tarihini değiştirmez.' : `Kaydedince son temas güncellenir · +${nf(TEMAS_PTS)} puan`}</span>
          <button class="cl-btn pri" onclick="clAddNote('${id}')">${clKindSel === 'temas' ? 'Temas kaydet' : clKindSel === 'rapor' ? 'Rapor gönderildi' : 'Not kaydet'}</button></div>
      </div>
      <div>${notes.length ? notes.map(n => `<div class="cl-ev"><div class="d">${clFmt(n.date)}</div>
          <div class="x"><span class="cl-pill ${n.kind === 'temas' ? 'acc' : n.kind === 'rapor' ? 'ok' : ''}">${CL_KIND[n.kind] || 'Not'}${n.channel ? ' · ' + esc(n.channel) : ''}</span>${esc(n.text)}</div>
          <button class="btn-icon danger" title="Kaydı sil" onclick="clDelNote('${id}','${n.id}')">×</button></div>`).join('')
        : '<div class="cl-hint">Henüz kayıt yok. Her konuşmayı Temas, gönderdiğin raporu Rapor olarak kaydet; son temas tarihi otomatik güncellenir.</div>'}</div>
    </div>

    <div class="cl-sec">
      <div class="cl-sec-h"><h3>Mesaj taslağı</h3><div class="cl-actions">
        <select class="cl-sel" style="width:auto" onchange="clSetTpl(this.value)" aria-label="Şablon">${Object.entries(MSG_TEMPLATES).map(([k, v]) => `<option value="${k}" ${clTpl === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <button class="cl-btn sm" onclick="clCopyDraft()">Kopyala</button>
        <button class="cl-btn sm" onclick="rdPdf('${id}')">📄 Aylık PDF</button></div></div>
      <textarea class="cl-ta" id="cl-draft" style="min-height:190px">${esc(clDraft(c))}</textarea>
      <span class="cl-hint">Rakamlar reklam tablolarından (son 7 gün, önceki 7 günle kıyas) gelir; {…} alanlarını doldur. Kurallar: müşteri iletişim sistemi. Gönderince Temas olarak kaydet.</span>
    </div>
  </div>`;
}

function clOpen(id) {
  clSel = id; clAdOpen = false;
  if (weekView !== 'clients') setWeekView('clients'); else rerenderView();
  if (window.innerWidth <= 760) document.querySelector('.cl-grid')?.scrollIntoView({block:'start'});
}
function clClose() { clSel = null; rerenderView(); }
function clKind(k) {
  const txt = document.getElementById('cl-note-text')?.value || '';
  clKindSel = k; rerenderView();
  const t = document.getElementById('cl-note-text'); if (t) t.value = txt;
}
function clFocusNote(k) {
  clKind(k);
  const t = document.getElementById('cl-note-text');
  if (t) { t.scrollIntoView({block:'center'}); t.focus(); }
}
function clSet(id, field, val, msg) {
  const c = clGet(id); if (!c) return;
  c[field] = val; saveClients(); rerenderView();
  if (msg) toast('✅ ' + msg);
}
function clSaveStatus(id) {
  const c = clGet(id), v = document.getElementById('cl-status').value.trim();
  if (v === (c.currentStatus || '')) { toast('Değişiklik yok'); return; }
  c.currentStatus = v; c.statusUpdated = clToday();
  saveClients(); rerenderView(); toast('✅ Güncel durum kaydedildi');
}
function clAddClient() {
  const n = document.getElementById('cl-new-name'), s = document.getElementById('cl-new-sector');
  const name = n.value.trim();
  if (!name) { n.focus(); return; }
  const base = clNorm(name).replace(/ /g, '-') || 'musteri';
  const id = base + '-' + Date.now().toString(36);
  clientsData.clients[id] = {id, name, sector:s.value.trim(), status:'aktif', rhythmDays:4, currentStatus:'', statusUpdated:'', createdAt:Date.now(), ads:[], notes:[]};
  clSel = id;
  saveClients(); rerenderView(); toast('✅ ' + name + ' eklendi');
}
function clAddAd(id) {
  const name = document.getElementById('cl-ad-name').value.trim();
  if (!name) { document.getElementById('cl-ad-name').focus(); return; }
  clGet(id).ads.push({id:newId(), name, startedAt:document.getElementById('cl-ad-start').value || clToday(),
    why:document.getElementById('cl-ad-why').value.trim(), expectation:document.getElementById('cl-ad-exp').value.trim(),
    state:document.getElementById('cl-ad-state').value, result:'', createdAt:Date.now(), unit:'Mesaj', log:[], events:[]});
  clAdOpen = false;
  saveClients(); rerenderView(); toast('✅ Reklam eklendi');
}
function clAdSet(id, adId, field, val) {
  const a = (clGet(id)?.ads || []).find(x => x.id === adId); if (!a || a[field] === val) return;
  if (field === 'state' && val === 'durdu') { adOpen(id, adId, true); return; }   // kapanış notu penceresi
  if (field === 'state') adEvent(a, `Durum: ${CL_STATE[a.state]} → ${CL_STATE[val]}`);
  a[field] = val; saveClients();
  if (field === 'state') { rerenderView(); toast('Durum: ' + CL_STATE[val]); } else toast('✅ Sonuç notu kaydedildi');
}
function clRecord(id, kind, date, channel, text) {
  const c = clGet(id); if (!c) return;
  const wi = WEEKS.findIndex(w => date >= isoDay(w.mon) && date <= isoDay(addDays(w.mon, 6)));
  const before = wi >= 0 ? temasCount(wi) : 0;
  c.notes.push({id:newId(), kind, date, channel:kind === 'not' ? '' : channel, text, createdAt:Date.now()});
  saveClients();
  const gained = wi >= 0 && temasCount(wi) > before;
  updateHeroStats(); updateWeekBtns();
  return gained;
}
function clAddNote(id) {
  const text = document.getElementById('cl-note-text').value.trim(), k = clKindSel;
  if (!text && k === 'not') { toast('⚠️ Not boş olamaz'); return; }
  const gained = clRecord(id, k, document.getElementById('cl-note-date').value || clToday(), document.getElementById('cl-note-chan')?.value || '', text);
  rerenderView();
  toast(`✅ ${CL_KIND[k]} kaydedildi${gained ? ` · +${nf(TEMAS_PTS)} puan` : ''}`);
}
function clDelNote(id, nid) {
  if (!confirm('Bu kayıt silinsin mi?')) return;
  const c = clGet(id); c.notes = c.notes.filter(n => n.id !== nid);
  saveClients(); updateHeroStats(); updateWeekBtns(); rerenderView(); toast('Kayıt silindi');
}
function clCopyDraft() {
  const t = document.getElementById('cl-draft');
  navigator.clipboard.writeText(t.value).then(() => toast('✅ Taslak kopyalandı'), () => { t.select(); toast('Metni seçtim, kopyalayabilirsin'); });
}

/* ══ REKLAM PENCERESİ — Excel benzeri takip tablosu, zaman çizelgesi, kapanış + arşiv ══
   Reklam alanları (geriye uyumlu): unit (sonuç türü), log:[{id,date,spend,res,note}],
   events:[{date,text}], endedAt, closeNote */
const AD_UNITS = ['Mesaj', 'Satış', 'Takipçi', 'Potansiyel müşteri', 'Tıklama', 'Randevu', 'Erişim'];
let adModal = null;   // {cid, adId, closing} | {cid, archive:true}

function adNorm(a) {
  if (!Array.isArray(a.log)) a.log = [];
  if (!Array.isArray(a.events)) a.events = [];
  if (!a.unit) a.unit = 'Mesaj';
  return a;
}
function adNum(v) {
  let s = String(v ?? '').trim().replace(/\s|₺|tl/gi, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
const adMoney = n => n === null || n === undefined || isNaN(n) ? '—' : '₺' + nf(n, n < 100 ? 2 : 0);
function adRows(a) { return [...adNorm(a).log].sort((x, y) => (x.date || '').localeCompare(y.date || '') || x.id.localeCompare(y.id)); }
function adTotals(a) {
  let spend = 0, res = 0;
  for (const r of a.log || []) { spend += Number(r.spend) || 0; res += Number(r.res) || 0; }
  return {spend, res, cpr: res ? spend / res : null, days: (a.log || []).length};
}
function adSpan(a) {
  const end = a.state === 'durdu' ? (a.endedAt || a.startedAt) : clToday();
  const d1 = clParse(a.startedAt), d2 = clParse(end);
  return d1 && d2 ? Math.max(1, Math.round((d2 - d1) / 86400000) + 1) : null;
}
function adFind() {
  if (!adModal) return {};
  const c = clGet(adModal.cid);
  const a = c && adModal.adId ? (c.ads || []).find(x => x.id === adModal.adId) : null;
  return {c, a: a ? adNorm(a) : null};
}
function adEvent(a, text) { adNorm(a).events.push({date: clToday(), text, at: Date.now()}); }

function adOpen(cid, adId, closing) { adModal = {cid, adId, closing: !!closing}; adRender(true); }
function adArchiveOpen(cid) { adModal = {cid, archive: true}; adRender(true); }
function adCloseModal() {
  document.getElementById('adm-root')?.remove();
  document.body.style.overflow = '';
  adModal = null;
  rerenderView();
}

function adRender(top) {
  let root = document.getElementById('adm-root');
  const box = root?.querySelector('.adm-box'), keep = box && !top ? box.scrollTop : 0;
  if (!root) {
    root = document.createElement('div'); root.id = 'adm-root'; root.className = 'adm-overlay';
    root.addEventListener('mousedown', e => { if (e.target === root) adCloseModal(); });
    document.body.appendChild(root);
    document.body.style.overflow = 'hidden';
  }
  const {c, a} = adFind();
  if (!c) { adCloseModal(); return; }
  root.innerHTML = `<div class="adm-box" role="dialog" aria-modal="true">${adModal.archive ? adArchiveHTML(c) : a ? adHTML(c, a) : ''}</div>`;
  root.querySelector('.adm-box').scrollTop = keep;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && adModal) adCloseModal(); });

function adHTML(c, a) {
  const t = adTotals(a), rows = adRows(a), closed = a.state === 'durdu', span = adSpan(a);
  const cid = esc(c.id), aid = esc(a.id);
  const ev = [{date: a.startedAt, text: 'Reklam başladı'}, ...a.events].filter(e => e.date)
    .sort((x, y) => x.date.localeCompare(y.date) || (x.at || 0) - (y.at || 0));
  return `
  <div class="adm-head">
    <div style="min-width:0">
      <div class="adm-crumb">${esc(c.name)} · Reklam</div>
      <input class="adm-title" value="${esc(a.name)}" onchange="adSet('name',this.value.trim())" aria-label="Reklam adı">
    </div>
    <div class="adm-head-r">
      <span class="cl-pill ${closed ? '' : a.state === 'kazanan' ? 'ok' : 'acc'}">${closed ? '🗄 Arşivde' : CL_STATE[a.state]}</span>
      <button class="adm-x" onclick="adCloseModal()" title="Kapat (Esc)">×</button>
    </div>
  </div>

  <div class="adm-kpis">
    <div class="adm-kpi"><span>Toplam harcama</span><b>${adMoney(t.spend)}</b></div>

function adChart(a) {
  const rows = adRows(a).filter(r => r.date && (Number(r.spend) || Number(r.res)));
  if (rows.length < 2) return `<h3 class="adm-h3">Grafik</h3><div class="cl-hint">En az 2 satır girince harcama ve ${esc(a.unit.toLocaleLowerCase('tr'))} başı maliyet grafiği burada çizilir.</div>`;
  const W = 640, H = 150, P = 26, n = rows.length, bw = Math.min(34, (W - P * 2) / n * 0.6);
  const sp = rows.map(r => Number(r.spend) || 0), cp = rows.map(r => Number(r.res) ? (Number(r.spend) || 0) / Number(r.res) : null);
  const maxS = Math.max(...sp, 1), cpv = cp.filter(v => v !== null), maxC = Math.max(...cpv, 1);
  const x = i => P + (n === 1 ? (W - P * 2) / 2 : i * (W - P * 2) / (n - 1));
  const bars = sp.map((v, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(H - P - v / maxS * (H - P * 2)).toFixed(1)}" width="${bw.toFixed(1)}" height="${(v / maxS * (H - P * 2)).toFixed(1)}" rx="3" fill="rgba(0,113,227,.28)"><title>${clFmt(rows[i].date)} · harcama ${adMoney(v)}</title></rect>`).join('');
  const pts = cp.map((v, i) => v === null ? null : [x(i), H - P - v / maxC * (H - P * 2)]);
  const line = pts.filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const dots = pts.map((p, i) => p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--orange)"><title>${clFmt(rows[i].date)} · ${esc(a.unit.toLocaleLowerCase('tr'))} başı ${adMoney(cp[i])}</title></circle>` : '').join('');
  const step = Math.ceil(n / 8);
  const labels = rows.map((r, i) => i % step === 0 || i === n - 1 ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${clFmt(r.date)}</text>` : '').join('');
  return `<div class="cl-sec-h"><h3 class="adm-h3">Grafik</h3><span class="adm-legend"><i style="background:rgba(0,113,227,.45)"></i>Harcama <i style="background:var(--orange);border-radius:50%"></i>${esc(a.unit)} başı maliyet</span></div>
    <svg class="adm-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}<path d="${line}" fill="none" stroke="var(--orange)" stroke-width="2"/>${dots}${labels}</svg>`;
}

function adRowAdd() {

  const inp = document.querySelectorAll(`.adm-table tbody tr`);

function adRowSet(rid, field, val, rerender) {

function adRowDel(rid) {

function adChangeState(v) {

function adCopyTSV() {
  const {c, a} = adFind(); if (!a) return;
  const t = adTotals(a), f = v => v === null || v === undefined || v === '' ? '' : String(v).replace('.', ',');
  const lines = [[`${c.name} — ${a.name}`], ['Tarih', 'Harcama (TL)', a.unit, `${a.unit} başı (TL)`, 'Not']];
  adRows(a).forEach(r => lines.push([r.date, f(r.spend), f(r.res), Number(r.res) ? f(+((Number(r.spend) || 0) / Number(r.res)).toFixed(2)) : '', r.note || '']));

/* ══ MÜŞTERİ İLETİŞİM SİSTEMİ — şablonlar, ajan taslakları, aylık rapor PDF ══
   Kurallar: ai-agency/operasyon/client_success/musteri_iletisim_sistemi.md
   reportDrafts = { drafts: { id: {id, client, type:'haftalik'|'aylik'|'uyari', period, text, rows:[{ad,date,spend,res,note}],
                    flags:[], notes:'', createdAt, status:'bekliyor'|'gonderildi'|'atlandi'} } }
   Ajan (Claude masaüstü, zamanlanmış görev) #ajan sayfasından özeti okur, taslakları aynı sayfadan kaydeder.
   Hiçbir taslak Şeref onaylamadan müşteriye gitmez. */
let reportDrafts = JSON.parse(localStorage.getItem('rd26') || 'null') || {drafts: {}};
function saveDrafts() {
  try { localStorage.setItem('rd26', JSON.stringify(reportDrafts)); _dirty.add('rd26'); saveToCloud(); }
  catch(e) { toast('⚠️ Depolama dolu'); }
}
function clDrafts(cid, status = 'bekliyor') {
  return Object.values(reportDrafts.drafts || {}).filter(d => d.client === cid && (!status || d.status === status))
    .sort((a, b) => b.createdAt - a.createdAt);
}
const RD_TYPE = {haftalik: 'Haftalık bilgi', aylik: 'Aylık rapor', uyari: 'Anında uyarı'};

/* — Rakamlar: reklam tablolarından dönem toplamları — */
function clPeriod(c, fromIso, toIso) {
  let spend = 0, res = 0, units = new Set(); const per = [];
  for (const a of (c.ads || []).map(adNorm)) {
    let s = 0, r = 0;
    for (const row of a.log) if (row.date >= fromIso && row.date <= toIso) { s += Number(row.spend) || 0; r += Number(row.res) || 0; }
    if (s || r) { per.push({name: a.name, unit: a.unit, spend: s, res: r, cpr: r ? s / r : null, state: a.state}); units.add(a.unit); }
    spend += s; res += r;
  }
  return {spend, res, cpr: res ? spend / res : null, unit: units.size === 1 ? [...units][0] : 'sonuç', per};
}
function pctChange(now, prev) { return now === null || prev === null || !prev ? null : Math.round((now - prev) / prev * 100); }
function clWeekNumbers(c) {
  const t = clParse(clToday());
  const iso = d => isoDay(d);
  const cur = clPeriod(c, iso(addDays(t, -6)), iso(t)), prev = clPeriod(c, iso(addDays(t, -13)), iso(addDays(t, -7)));
  return {cur, prev, resPct: pctChange(cur.res, prev.res), cprPct: pctChange(cur.cpr, prev.cpr)};
}
function clMonthNumbers(c, monthKey) {
  const [y, m] = monthKey.split('-').map(Number);
  const from = `${monthKey}-01`, to = isoDay(new Date(y, m, 0));
  const pm = new Date(y, m - 2, 1), pk = isoDay(pm).slice(0, 7);
  return {cur: clPeriod(c, from, to), prev: clPeriod(c, `${pk}-01`, isoDay(new Date(pm.getFullYear(), pm.getMonth() + 1, 0))), from, to};
}
const tl = n => n === null || n === undefined ? '{?}' : nf(n, n < 100 ? 2 : 0) + ' TL';
function trendTxt(p, lowerIsBetter) {
  if (p === null) return 'geçen haftayla kıyas yok';
  if (p === 0) return 'geçen haftayla aynı';
  const good = lowerIsBetter ? p < 0 : p > 0;
  return `geçen haftaya göre %${Math.abs(p)} ${lowerIsBetter ? (p < 0 ? 'daha ucuz' : 'daha pahalı') : (p > 0 ? 'daha fazla' : 'daha az')}${good ? '' : ''}`;
}

/* — Şablonlar (musteri_iletisim_sistemi.md §4-§6). {…} alanları Şeref doldurur. — */
const MSG_TEMPLATES = {
  haftalik: 'Haftalık (standart)', iyi: 'İyi hafta', kotu: 'Kötü hafta', yeni: 'Yeni kampanya başladı',
  test: 'Test sonucu', butce: 'Bütçe önerisi', uyari: 'Anında uyarı', hatirlatma: 'Cevapsız — hatırlatma', aylik: 'Aylık rapor (mesaj)',
};
let clTpl = 'haftalik';
function clDraft(c, tpl = clTpl) {
  const H = c.hitap || '{Hitap}', w = clWeekNumbers(c), cur = w.cur, u = (cur.unit || 'sonuç').toLocaleLowerCase('tr');
  const live = (c.ads || []).filter(a => a.state !== 'durdu');
  const best = [...cur.per].filter(p => p.cpr !== null).sort((a, b) => a.cpr - b.cpr)[0];
  const newest = [...live].sort((a, b) => String(b.startedAt).localeCompare(String(a.startedAt)))[0];
  const ask = '🙏 Sizden ricam: Gelen mesajlardan kaçı randevuya döndü?';
  const line = cur.res
    ? `Bu hafta: ${nf(cur.res, 0)} ${u} geldi, ${u} başı ${tl(cur.cpr)} (${trendTxt(w.cprPct, true)}).`
    : 'Bu hafta: {sonuç sayısı} {mesaj/randevu} geldi, {sonuç} başı {X} TL ({geçen haftaya göre}).';
  if (tpl === 'iyi') return [`Merhaba ${H}, güzel bir hafta oldu 📊`, line,
    `En iyi çalışan: ${best ? best.name : '{reklam}'}. Bütçeyi bu reklama kaydırıyorum.`, '🔜 {plan}',
    '🙏 Bu mesajlardan kaçı randevuya döndü? Hangi saatlerde daha çok yazıyorlar?'].join('\n');
  if (tpl === 'kotu') return [`Merhaba ${H}, bu haftanın rakamlarını açıkça paylaşmak istiyorum.`, line,
    'Sebebi: {gözlem — örn. aynı görsel 3 haftadır dönüyor, kitle yoruldu}.',
    'Bugün yaptığım: {aksiyon}. {Gün} itibarıyla sonucu göreceğiz, size ayrıca yazacağım.'].join('\n');
  if (tpl === 'yeni') return [`Merhaba ${H}, ${newest ? newest.name : '{kampanya}'} bugün yayına girdi 🚀`,
    `Hedefimiz: ${newest?.expectation || '{beklenti — örn. haftada 20 mesaj, mesaj başı 250 TL altı}'}.`,
    `İlk 3-4 gün sistem öğreniyor, bu yüzden ilk değerlendirmeyi ${clFmt(isoDay(addDays(new Date(), 4)))} tarihinde paylaşacağım.`,
    '🙏 Gelen mesajlara ilk 1 saat içinde dönülmesi sonucu çok etkiliyor, ekibinize iletebilir misiniz?'].join('\n');
  if (tpl === 'test') {
    const p = [...cur.per].filter(x => x.cpr !== null).sort((a, b) => a.cpr - b.cpr);
    return [`Merhaba ${H}, ${p.length > 1 ? 'karşılaştırdığımız reklamların' : '{test adı}'} sonucu belli oldu:`,
      p.length > 1 ? p.slice(0, 2).map(x => `• ${x.name}: ${u} başı ${tl(x.cpr)}`).join('\n') : '• {A}: {X} TL\n• {B}: {Y} TL',

  }

function ajanOzet() {

      return {
        id: c.id, ad: c.name, hitap: c.hitap || '', sektor: c.sector, metaHesap: c.metaAccount || '', raporFormati: c.reportFormat || 'mesaj',

          neden: a.why, beklenti: a.expectation, son14: adRows(a).filter(x => x.date >= isoDay(addDays(clParse(today), -13)))
            .map(x => ({tarih: x.date, harcama: x.spend, sonuc: x.res, not: x.note})) })),
        buAyKapanan: (c.ads || []).filter(a => a.state === 'durdu' && (a.endedAt || '') >= isoDay(addDays(clParse(today), -40))).map(a => ({ad: a.name, kapanis: a.endedAt, not: a.closeNote})),
        sonKayitlar: [...(c.notes || [])].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5).map(n => ({tarih: n.date, tur: n.kind, metin: n.text})),
      };
    }),
  };
}
function ajanImport(raw) {
  let obj;
  try { obj = JSON.parse(String(raw).trim().replace(/^```(json)?|```$/g, '')); } catch(e) { return {ok: false, msg: 'JSON okunamadı: ' + e.message}; }
  const list = Array.isArray(obj) ? obj : obj.drafts;
  if (!Array.isArray(list)) return {ok: false, msg: '"drafts" listesi yok'};
  let n = 0; const bad = [];
  for (const d of list) {
    const c = clGet(d.client) || clAll().find(x => clMatches(d.client, x));
    if (!c || !d.text) { bad.push(d.client || '?'); continue; }
    // Aynı müşteri + tür için bekleyen eski taslak varsa yenisi onun yerine geçer
    clDrafts(c.id).filter(x => x.type === (d.type || 'haftalik')).forEach(x => { x.status = 'atlandi'; });
    const id = newId();
    reportDrafts.drafts[id] = {id, client: c.id, type: RD_TYPE[d.type] ? d.type : 'haftalik', period: d.period || '', text: String(d.text),
      rows: Array.isArray(d.rows) ? d.rows : [], flags: Array.isArray(d.flags) ? d.flags : [], notes: d.notes || '', createdAt: Date.now(), status: 'bekliyor'};
    n++;
  }
  if (n) saveDrafts();
  return {ok: n > 0, msg: `${n} taslak kaydedildi${bad.length ? ` · eşleşmeyen müşteri: ${bad.join(', ')}` : ''}`};
}

/* Günlük Plan → bugünün kartında müşteri küçük işleri (günün büyük işinin önüne geçmez) */
function clJobsToday(wi) {
  const today = clToday(), jobs = [];
  const first = monthRole(wi).first;
  for (const c of clSorted(clActive())) {
    const h = clHealth(c), last = clLast(c);
    const doneToday = last && last.date === today;
    if (h.cls !== 'ok') jobs.push({c, kind:'temas', text:`${c.name} — haftalık bilgi gönder`, color:h.cls === 'crit' ? 'var(--red)' : 'var(--orange)', done:false});
    else if (doneToday && last.kind === 'temas') jobs.push({c, kind:'temas', text:`${c.name} — haftalık bilgi gönder`, color:'var(--green)', done:true});
    if (first) {
      const rep = clReportDone(c);
      const repToday = (c.notes || []).some(n => n.kind === 'rapor' && n.date === today);
      if (!rep || repToday) jobs.push({c, kind:'rapor', text:`${c.name} — ${MONTHS_TR[new Date().getMonth()]} raporu gönder`, color:'var(--accent)', done:rep});
    }
  }
  return jobs;
}
function buildSmallJobs(wi) {
  const jobs = clJobsToday(wi);
  if (!jobs.length) return '';
  const open = jobs.filter(j => !j.done).length;
  return `<div class="dp-small">
    <div class="dp-small-h">Küçük işler · müşteri teması <span>${open ? `${open} bekliyor · her biri +${nf(TEMAS_PTS)}p` : 'hepsi tamam ✓'}</span></div>
    ${jobs.map(j => `<div class="dp-job ${j.done ? 'done' : ''}"><span class="jd" style="background:${j.color}"></span>

      ${j.done ? '<span class="cl-hint">✓</span>' : `<button onclick="clQuick('${esc(j.c.id)}','${j.kind}')">${j.kind === 'rapor' ? '✓ Gönderildi' : '✓ Temas'}</button>`}</div>`).join('')}
  </div>`;
}

function getCats(wi) {
  if(!weekCats[wi]) weekCats[wi] = JSON.parse(JSON.stringify(DEFAULT_CATS));
  return weekCats[wi];
}

function getData(wi) {
  if(!weekData[wi]) {
    const cats = getCats(wi);
    weekData[wi] = cats.map(cat=>cat.tasks.map(()=>Array(7).fill(0)));
  }
  return weekData[wi];
}

function syncWeekData(wi) {
  const cats = getCats(wi);
  const old = weekData[wi] || [];
  weekData[wi] = cats.map((cat,ci)=>cat.tasks.map((_,ti)=>(old[ci]?.[ti])||Array(7).fill(0)));
}

    _dirty.add('wc26'); _dirty.add('wd26');
    saveToCloud();

/* ══════════════════════════════════════════════════════════
   CALCULATIONS
══════════════════════════════════════════════════════════ */
// Görevin kazandığı puan: sessions>1 ise oturum oranına göre ölçeklenir
// Örnek: pts=3, sessions=5, 3 gün yapıldı → 3*(3/5) = 1.8 puan
function taskEarned(wi,ci,ti) {
  const cats=getCats(wi), d=getData(wi);
  const task=cats[ci].tasks[ti];
  const sessions=task.sessions||1;
  const done=(d[ci]?.[ti]||[]).reduce((a,b)=>a+b,0);
  if(sessions===1) {
    // Tek oturum: ya tam ya sıfır (eski davranış)
    return done>=1 ? task.pts : 0;
  }
  // Çoklu oturum: orana göre puan, sessions'ı geçemez
  const completed=Math.min(done,sessions);
  return +(task.pts*(completed/sessions)).toFixed(2);
}
function catTotal(wi,ci) {
  const cats=getCats(wi);
  return +cats[ci].tasks.reduce((s,_,ti)=>s+taskEarned(wi,ci,ti),0).toFixed(2);
}
function weekTotal(wi) {
  const cats=getCats(wi);
  // Görev puanları + müşteri temas puanı (temas/rapor kaydı başına 0,5)
  return +(cats.reduce((s,_,ci)=>s+catTotal(wi,ci),0) + temasBonus(wi)).toFixed(2);
}
function weekTarget(wi) { return getCats(wi).reduce((s,c)=>s+c.target,0); }
// weekPlan[wi].manual = { grade: 0-10 | null, note: '' } — ani değişiklik olan haftada not + elle puan
function manualOf(wi) { const m = weekPlan[wi]?.manual; return m && typeof m.grade === 'number' ? m : null; }
function autoPct(wi) { const t=weekTarget(wi); return t?Math.min(100,Math.round(weekTotal(wi)/t*100)):0; }
function weekPct(wi) { const m=manualOf(wi); return m ? Math.round(m.grade*10) : autoPct(wi); }
function hasData(wi) { return weekTotal(wi)>0 || !!manualOf(wi); }

// 10 uzerinden not sistemi
// Açık zeminde okunur yazı rengi: açık kategori renklerini koyulaştırır (zemin tonu için renk aynen kalır)
function inkOf(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return hex;
  let [r, g, b] = [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16));
  const lum = (r, g, b) => [r, g, b].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); })
    .reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0);
  let k = 0;
  while (lum(r, g, b) > .18 && k < 20) { r *= .9; g *= .9; b *= .9; k++; }
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function calcGrade(pct) { return +(pct/10).toFixed(1); }
function gradeInfo(g) {
  if(g>=9) return {emoji:'🏆',text:'Mükemmel',cls:'pill-great',color:'var(--green)'};
  if(g>=7) return {emoji:'✅',text:'İyi',cls:'pill-ok',color:'var(--accent)'};
  if(g>=5) return {emoji:'⚠️',text:'Orta',cls:'pill-mid',color:'var(--orange)'};
  return {emoji:'❌',text:'Geliştir',cls:'pill-low',color:'var(--red)'};
}
function pill(pct) {
  const g=calcGrade(pct);
  const {emoji,text,cls}=gradeInfo(g);
  return `<span class="pill ${cls}">${emoji} ${text} · <strong>${g.toFixed(1)}/10</strong></span>`;
}

function updateHeroStats() {
  const withData = WEEKS.filter(w=>hasData(w.idx));
  const avgGrade = withData.length
    ? (withData.reduce((s,w)=>s+calcGrade(weekPct(w.idx)),0)/withData.length).toFixed(1)
    : '—';
  const best = withData.length
    ? withData.reduce((b,w)=>weekPct(w.idx)>weekPct(b.idx)?w:b)
    : null;
  const g=id=>document.getElementById(id);
  if(g('stat-weeks')) g('stat-weeks').textContent=WEEKS.length;
  if(g('stat-avg')) g('stat-avg').textContent=avgGrade;
  if(g('stat-best')) g('stat-best').textContent=best?`${best.label} (${calcGrade(weekPct(best.idx)).toFixed(1)}/10)`:'—';
}

/* ══════════════════════════════════════════════════════════
   WEEK PAGE
══════════════════════════════════════════════════════════ */
let currentWI = 0;

function buildWeekPage(wi) {
  currentWI = wi;
  const role = monthRole(wi);
  if (weekView === 'month' && !role.first && !role.last) weekView = 'tasks';
  let body;
  if (weekView === 'mtasks') body = buildMonthTasksView(wi);
  else if (weekView === 'clients') body = buildClientsView(wi);
  else if (weekView === 'days') body = buildDaysView(wi);
  else if (weekView === 'month') body = buildMonthView(wi);
  else body = buildTasksView(wi);
  return buildWeekHeader(wi) + body + buildSubNav(wi);
}

function buildWeekHeader(wi) {
  const tgt = weekTarget(wi);
  return `
    <div class="week-header-bar">
      <div>
        <div class="week-title">${WEEKS[wi].label} · <span>${WEEKS[wi].dateLabel}</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums">
          Hafta hedef tavanı: <span style="color:var(--accent);font-weight:600">${tgt} puan</span>
          &nbsp;·&nbsp; Başarı notu bu tavana göre hesaplanır
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn-copy" onclick="showSettings(${wi})">⚙️ Bu Haftayı Düzenle</button>
        <button class="btn-copy" onclick="copyFromPrev(${wi})">📋 Önceki Haftadan Kopyala</button>
      </div>
    </div>`;
}

function gradeLine(wi) {
  const a = autoPct(wi), m = manualOf(wi);
  return m ? `${a}% → Otomatik: ${calcGrade(a).toFixed(1)} · ✍️ Elle: ${m.grade.toFixed(1)}/10`
           : `${a}% → Not: ${calcGrade(a).toFixed(1)}/10`;
}

/* ── HAFTA NOTU + ELLE PUAN ── */
function getWeekManual(wi) {
  const p = getPlan(wi);
  if (!p.manual) p.manual = {grade: null, note: ''};
  return p.manual;
}
function buildWeekNote(wi) {
  const m = weekPlan[wi]?.manual || {grade: null, note: ''};
  const on = typeof m.grade === 'number';
  const open = on || (m.note || '').trim();
  return `<details class="wn ${on ? 'on' : ''}" ${open ? 'open' : ''}>
    <summary>📝 Hafta notu${on ? ` · <span class="man-tag">✍️ Not elle belirlendi: ${m.grade.toFixed(1)}/10</span>` : (m.note || '').trim() ? ' · <span class="wn-has">not var</span>' : ' <span class="wn-hint">— ani bir değişiklik mi oldu? (hastalık, seyahat, acil iş…)</span>'}</summary>
    <div class="wn-body">
      <textarea class="wn-text" id="wn-text-${wi}" placeholder="Bu hafta ne oldu? Neden planlandığı gibi gitmedi / neyi değiştirdin?" oninput="wnNote(${wi},this.value)">${esc(m.note || '')}</textarea>
      <div class="wn-row">
        <label class="wn-chk"><input type="checkbox" id="wn-on-${wi}" ${on ? 'checked' : ''} onchange="wnToggle(${wi},this.checked)"> Bu haftanın notunu elle belirle</label>
        <span class="wn-grade ${on ? '' : 'off'}">
          <input type="number" id="wn-grade-${wi}" min="0" max="10" step="0.5" value="${on ? m.grade : ''}" ${on ? '' : 'disabled'} onchange="wnGrade(${wi},this.value)"> / 10
        </span>
        <span class="wn-auto">Otomatik hesap: <b id="wn-auto-${wi}">${calcGrade(autoPct(wi)).toFixed(1)}</b>/10</span>
      </div>
      <div class="wn-foot">Elle not girilince yıl ortalaması, grafikler ve ay değerlendirmesi bu notu kullanır. Görev puanların silinmez; kutuyu kaldırınca otomatik hesaba döner.</div>
    </div>
  </details>`;
}
function wnNote(wi, v) { getWeekManual(wi).note = v; savePlan(); }
function wnToggle(wi, on) {
  const m = getWeekManual(wi);
  if (on) {
    if (!(m.note || '').trim()) toast('📝 Elle not verirken kısa bir açıklama yazmayı unutma');
    m.grade = calcGrade(autoPct(wi));
  } else m.grade = null;
  savePlan(); afterManual(wi);
}
function wnGrade(wi, v) {
  const n = Math.max(0, Math.min(10, parseFloat(String(v).replace(',', '.'))));
  if (isNaN(n)) return;
  getWeekManual(wi).grade = Math.round(n * 10) / 10;
  savePlan(); afterManual(wi);
}
function afterManual(wi) {
  rerenderView(); updateHeroStats(); updateWeekBtns();
}

/* ── GÖREVİN NOTA KATKISI (10 üzerinden) ── */
const nf = (x, d=2) => (+x).toLocaleString('tr-TR', {maximumFractionDigits:d, minimumFractionDigits:0});
function gainHTML(wi, ci, ti) {
  const task = getCats(wi)[ci]?.tasks[ti], tgt = weekTarget(wi);
  if (!task || !tgt) return '';
  const sess = task.sessions || 1;
  const done = Math.min(sess, taskDoneCount(wi, ci, ti));
  const per = (task.pts / sess) / tgt * 10;          // 1 oturumun nota katkısı
  const left = sess - done;
  const tip = `Bu görev haftalık notuna toplam +${nf(task.pts / tgt * 10)} (%${nf(task.pts / tgt * 100, 1)}) ekler`
    + (sess > 1 ? ` · her oturum +${nf(per)}` : '') + (manualOf(wi) ? ' · Not: bu hafta elle not girildi, katkı otomatik nota eklenir' : '');
  if (left <= 0) return `<span class="gain got" id="wgain-${wi}-${ci}-${ti}" title="${tip}">✓ +${nf(task.pts / tgt * 10)} alındı</span>`;
  if (sess === 1) return `<span class="gain" id="wgain-${wi}-${ci}-${ti}" title="${tip}">+${nf(per)} not <span class="gs">· %${nf(per * 10, 1)}</span></span>`;
  return `<span class="gain" id="wgain-${wi}-${ci}-${ti}" title="${tip}">oturum +${nf(per)} <span class="gs">· kalan +${nf(per * left)}</span></span>`;
}

function buildTasksView(wi) {
  const cats=getCats(wi), data=getData(wi);
  const total=weekTotal(wi), tgt=weekTarget(wi), apct=autoPct(wi), pct=weekPct(wi), man=manualOf(wi);
  const gc=`1fr 30px auto ${DAYS_SHORT.map(()=>'30px').join(' ')}`;
  const rocks=getPlan(wi).rocks;

  let html=`
    <div class="score-row">
      <div class="score-card accent">
        <div class="sc-label">Toplam Puan</div>
        <div class="sc-val" id="wtotal-${wi}">${Number.isInteger(total)?total:total.toFixed(1)}</div>
        <div class="sc-sub">/ ${tgt} puan${temasBonus(wi)?` <span class="temas-bonus" title="Müşteri temas/rapor kayıtlarından">· +${nf(temasBonus(wi))} temas</span>`:''}</div>
      </div>
      <div class="score-card hero-score">
        <div class="sc-label">10 Üzerinden Not${man?' · <span class="man-tag">✍️ elle</span>':''}</div>
        <div class="sc-val" id="wpct-${wi}" style="color:var(--accent)">${calcGrade(pct).toFixed(1)}</div>
        <div class="sc-sub" id="wpill-${wi}">${pill(pct)}</div>
      </div>
      <div class="score-card">
        <div class="sc-label">Başarı %</div>
        <div class="sc-val" id="wpct3-${wi}" style="font-size:22px">${apct}%</div>
        <div class="sc-sub">${total} / ${tgt} puan</div>
      </div>
      ${cats.map((cat,ci)=>`
        <div class="score-card">
          <div class="sc-label" style="color:${inkOf(cat.color)}">${cat.name.split(' ')[0]}</div>
          <div class="sc-val" id="wcat-${wi}-${ci}" style="color:${inkOf(cat.color)}">${catTotal(wi,ci)}</div>
          <div class="sc-sub">/ ${cat.target}p</div>
        </div>`).join('')}
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Haftalık İlerleme (${total}/${tgt}p)</span><span id="wpct2-${wi}">${gradeLine(wi)}</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="wbar-${wi}" style="width:${apct}%"></div></div>
    </div>
    ${buildWeekNote(wi)}
    ${buildRocks(wi)}
    <div class="dl-legend">
      <span><span class="lg-chip up"></span>⏰ Deadline'lı görev</span>
      <span><span class="lg-chip od"></span>⚠ Süresi geçti</span>
      <span><span class="lg-chip fr"></span>Serbest — acelesi yok</span>
      <span><span class="gain" style="margin-left:0">+0,9 not</span> = görevi yaparsan 10 üzerinden notuna eklenen</span>
      <span style="margin-left:auto;opacity:.7">Deadline'ı görev düzenleyicide ayarla ⚙️</span>
    </div>`;

  cats.forEach((cat,ci)=>{
    html+=`<div class="task-table">
      <div class="cat-header" style="background:${cat.color}1f;color:${inkOf(cat.color)}">
        <div class="cat-dot" style="background:${cat.color}"></div>${cat.name}
        <span class="tgt-badge" style="background:${cat.color}26;color:${inkOf(cat.color)}">Hedef: ${cat.target}p</span>
      </div>
      <div class="day-headers" style="grid-template-columns:${gc}">
        <span style="text-align:left;width:auto;font-size:9px;color:var(--muted);letter-spacing:1px">GÖREV</span>
        <span class="dh-span" title="Bu haftanın taşı">TAŞ</span>
        <span class="dh-span" style="width:27px">PTS</span>
        ${DAYS_SHORT.map(d=>`<span class="dh-span">${d}</span>`).join('')}
      </div>
      ${cat.tasks.map((task,ti)=>{
        const sess=task.sessions||1;
        const totalDone=(data[ci]?.[ti]||[]).reduce((a,b)=>a+(b||0),0);
        const isDone=totalDone>=sess;
        const dl=(task.deadline===0||task.deadline)?task.deadline:null;
        let rowCls='', badge='';
        if(dl!==null){
          const d0=new Date(addDays(WEEKS[wi].mon,dl)); d0.setHours(0,0,0,0);
          const t0=new Date(); t0.setHours(0,0,0,0);
          const st = isDone ? 'done' : (t0>d0 ? 'overdue' : (t0.getTime()===d0.getTime() ? 'today' : 'upcoming'));
          rowCls = st==='overdue' ? 'has-deadline overdue' : 'has-deadline';
          const lbl = st==='overdue' ? `⚠ ${DAYS_SHORT[dl]} · geçti`
                    : st==='today'  ? `⏰ ${DAYS_SHORT[dl]} · bugün`
                    : st==='done'   ? `✓ ${DAYS_SHORT[dl]} teslim`
                    :                 `⏰ ${DAYS_SHORT[dl]}'e kadar`;
          badge=`<span class="dl-badge ${st}">${lbl}</span>`;
        } else {
          badge=`<span class="free-badge">serbest</span>`;
        }
        return `<div class="task-row ${rowCls} ${rocks.includes(taskKey(cat,task))?'is-rock':''}" style="grid-template-columns:${gc}">
          <span class="task-name">${task.name}${badge}${gainHTML(wi,ci,ti)}</span>
          ${(()=>{const k=taskKey(cat,task), on=rocks.includes(k);
            return `<button class="rk-tag ${on?'on':''}" data-key="${esc(k)}" title="${on?'Bu haftanın taşı — çıkarmak için dokun':'Bu haftanın 3 taşından biri yap'}" onclick="rkToggle(this.dataset.key)">🎯</button>`;})()}
          <span class="pts-badge" style="background:${cat.color}26;color:${inkOf(cat.color)};min-width:36px;font-size:9px;padding:2px 4px" title="${sess>1?`${sess} oturumda ${task.pts} puan`:`${task.pts} puan`}">
            ${task.pts}p${sess>1?`<span style="opacity:.6;font-size:8px"> /${sess}</span>`:''}
          </span>
          ${DAYS_SHORT.map((_,di)=>{
            const val=data[ci]?.[ti]?.[di]||0;
            const doneClass=val>=sess?'done':val>0?'partial':'';
            const dlCell = dl===di ? (rowCls.includes('overdue')?'deadline-cell overdue':'deadline-cell') : '';
            return `<input type="number" min="0" max="${sess}"
              class="day-input ${doneClass} ${dlCell}"
              value="${val}"
              title="${dl===di?`⏰ Deadline günü`:sess>1?`Hedef: ${sess} oturum — bugün: ${val}`:''}"
              onchange="updateCell(this,${wi},${ci},${ti},${di})">`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>`;
  });
  return html;
}

function updateCell(input,wi,ci,ti,di) {
  const cats=getCats(wi);
  const sessions=(cats[ci]?.tasks[ti]?.sessions)||1;
  const val=Math.min(sessions,Math.max(0,parseInt(input.value)||0));
  input.value=val;
  const wasDone=taskDoneCount(wi,ci,ti)>=sessions;
  if(!weekData[wi]) weekData[wi]=[];
  if(!weekData[wi][ci]) weekData[wi][ci]=[];
  if(!weekData[wi][ci][ti]) weekData[wi][ci][ti]=Array(7).fill(0);
  weekData[wi][ci][ti][di]=val;
  input.classList.remove('done','partial');
  if(val>=sessions) input.classList.add('done');
  else if(val>0) input.classList.add('partial');
  save();
  const total=weekTotal(wi),apct=autoPct(wi),pct=weekPct(wi);
  const g=id=>document.getElementById(id);
  if(g(`wtotal-${wi}`)) g(`wtotal-${wi}`).textContent=Number.isInteger(total)?total:total.toFixed(1);
  if(g(`wpct-${wi}`)) g(`wpct-${wi}`).textContent=calcGrade(pct).toFixed(1);
  if(g(`wpct3-${wi}`)) g(`wpct3-${wi}`).textContent=apct+'%';
  if(g(`wpct2-${wi}`)) g(`wpct2-${wi}`).textContent=gradeLine(wi);
  if(g(`wbar-${wi}`)) g(`wbar-${wi}`).style.width=apct+'%';
  if(g(`wn-auto-${wi}`)) g(`wn-auto-${wi}`).textContent=calcGrade(apct).toFixed(1);
  if(g(`wpill-${wi}`)) g(`wpill-${wi}`).innerHTML=pill(pct);
  if(g(`wcat-${wi}-${ci}`)) g(`wcat-${wi}-${ci}`).textContent=(t=>Number.isInteger(t)?t:t.toFixed(1))(catTotal(wi,ci));
  const gEl=g(`wgain-${wi}-${ci}-${ti}`);
  if(gEl) gEl.outerHTML=gainHTML(wi,ci,ti);
  updateHeroStats();
  updateWeekBtns();
  mtSyncFromWeek(wi,ci,ti,wasDone);
}

function taskDoneCount(wi,ci,ti) {
  return (weekData[wi]?.[ci]?.[ti]||[]).reduce((a,b)=>a+(b||0),0);
}

/* ══════════════════════════════════════════════════════════
   COPY FROM PREVIOUS WEEK
══════════════════════════════════════════════════════════ */
function copyFromPrev(wi) {
  if(wi===0){toast('İlk hafta, kopyalanacak önceki hafta yok');return;}
  if(!confirm(`Hafta ${wi} görev listesini bu haftaya (${WEEKS[wi].label}) kopyalamak ister misin?\nMevcut bu haftanın görevleri silinecek.`)) return;
  weekCats[wi] = JSON.parse(JSON.stringify(getCats(wi-1)));
  syncWeekData(wi);
  save();
  toast('✅ Önceki haftadan kopyalandı!');
  renderWeek(wi);
}

   SETTINGS (per-week)

function buildCatEditor(wi,cat,ci) {
  return `<div class="cat-editor" id="ce-${wi}-${ci}">
    <div class="cat-ed-header">
      <div class="color-swatch" style="background:${cat.color}" title="Renk seç">
        <input type="color" id="cp-${wi}-${ci}" class="cp-input" value="${cat.color}"
          oninput="this.parentElement.style.background=this.value">
      </div>
      <input class="cat-name-in" id="cn-${wi}-${ci}" value="${cat.name}" placeholder="Kategori adı...">
      <div class="tgt-wrap">
        <span>Hedef:</span>
        <input type="number" class="small-num" id="ct-${wi}-${ci}" value="${cat.target}" min="1" max="50" oninput="updatePtsWarn(${wi})">
        <span>p</span>
      </div>
      <button class="btn-icon danger" onclick="removeCat(${wi},${ci})">🗑</button>
    </div>
    ${cat.tasks.map((task,ti)=>`
      <div class="task-ed-row" id="tr-${wi}-${ci}-${ti}">
        <span class="drag-h">⠿</span>
        <input class="task-name-in" id="tn-${wi}-${ci}-${ti}" value="${task.name}" placeholder="Görev adı...">
        <input type="number" class="small-num" id="tp-${wi}-${ci}-${ti}" value="${task.pts}" min="1" max="20" title="Puan">
        <span style="font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums">p</span>
        <span style="font-size:9px;color:var(--muted);margin-left:4px" title="Haftalık oturum sayısı">×</span>
        <input type="number" class="small-num" id="ts-${wi}-${ci}-${ti}" value="${task.sessions||1}" min="1" max="7" title="Haftalık kaç oturumda tamamlanır?">
        <span style="font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums" title="Oturum sayısı">otr</span>
        <select class="dl-select" id="td-${wi}-${ci}-${ti}" title="Deadline — son teslim günü (yoksa Serbest)">
          <option value="" ${task.deadline==null?'selected':''}>Serbest</option>
          ${DAYS_SHORT.map((d,di)=>`<option value="${di}" ${task.deadline===di?'selected':''}>⏰ ${d}</option>`).join('')}
        </select>
        <button class="btn-icon danger" onclick="removeTask(${wi},${ci},${ti})">✕</button>
      </div>`).join('')}
    <div class="add-task-row">
      <span style="font-size:15px;color:var(--muted)">＋</span>
      <input class="add-task-in" id="nt-${wi}-${ci}" placeholder="Yeni görev ekle..." onkeydown="if(event.key==='Enter')addTask(${wi},${ci})">
      <input type="number" class="small-num" id="np-${wi}-${ci}" value="2" min="1" max="20" title="Puan">
      <span style="font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums">p</span>
      <span style="font-size:9px;color:var(--muted);margin-left:2px">×</span>
      <input type="number" class="small-num" id="ns-${wi}-${ci}" value="1" min="1" max="7" title="Haftalık oturum sayısı">
      <span style="font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums">otr</span>
      <select class="dl-select" id="nd-${wi}-${ci}" title="Deadline — son teslim günü (yoksa Serbest)">
        <option value="">Serbest</option>
        ${DAYS_SHORT.map((d,di)=>`<option value="${di}">⏰ ${d}</option>`).join('')}
      </select>
      <button class="btn-add" onclick="addTask(${wi},${ci})">Ekle</button>
    </div>
  </div>`;
}

function getPtsTotal(wi) {
  return getCats(wi).reduce((_,__,ci)=>{
    const el=document.getElementById(`ct-${wi}-${ci}`);
    return _+(el?parseInt(el.value)||0:getCats(wi)[ci].target);
  },0);
}

function updatePtsWarn(wi) {
  const total=getPtsTotal(wi);
  document.querySelectorAll('.pts-warn').forEach(el=>{
    el.className='pts-warn '+(total===35?'warn-ok':'warn-bad');
    el.textContent=total===35?`✅ Toplam hedef: ${total} / 35`:`⚠️ Toplam hedef: ${total} / 35 — 35 önerilir`;
  });
}

function showSettings(wi) {
  const cats=getCats(wi), tgt=weekTarget(wi);
  const warnC=tgt===35?'warn-ok':'warn-bad';
  const warnT=tgt===35?`✅ Toplam hedef: ${tgt} / 35`:`⚠️ Toplam hedef: ${tgt} / 35 — 35 önerilir`;
  document.getElementById('app').innerHTML=`
    <div class="settings-wrap">
      <div class="settings-info">
        <strong>⚙️ ${WEEKS[wi].label} · ${WEEKS[wi].dateLabel}</strong> haftasına özel görev düzenleyici.<br>
        Değişiklikler yalnızca bu haftayı etkiler. Diğer haftalar korunur.
      </div>
      <div class="copy-notice">💡 Bir sonraki haftaya geçip "Önceki Haftadan Kopyala" diyerek bu listeyi aktarabilirsin.</div>
      <div class="pts-warn ${warnC}">${warnT}</div>
      <div id="se-cats">${cats.map((c,ci)=>buildCatEditor(wi,c,ci)).join('')}</div>
      <button class="add-cat-btn" onclick="addCat(${wi})">＋ Yeni Kategori Ekle</button>
      <div class="settings-actions">
        <button class="btn-danger-out" onclick="resetWeek(${wi})">🗑 Bu Haftayı Sıfırla</button>
        <button class="btn-secondary" onclick="renderWeek(${wi})">İptal</button>
        <button class="btn-primary" onclick="saveSettings(${wi})">💾 Kaydet & Uygula</button>
      </div>
    </div>`;
}

function addTask(wi,ci) {
  const inp=document.getElementById(`nt-${wi}-${ci}`);
  const ptsEl=document.getElementById(`np-${wi}-${ci}`);
  const sessEl=document.getElementById(`ns-${wi}-${ci}`);
  const dlEl=document.getElementById(`nd-${wi}-${ci}`);
  const name=inp.value.trim(); if(!name)return;
  const pts=parseInt(ptsEl.value)||2;
  const sessions=Math.min(7,Math.max(1,parseInt(sessEl?.value)||1));
  const deadline = dlEl && dlEl.value!=='' ? parseInt(dlEl.value) : null;
  getCats(wi)[ci].tasks.push({name,pts,sessions,deadline});
  rerenderCatEd(wi,ci);
  setTimeout(()=>{ const el=document.getElementById(`nt-${wi}-${ci}`); if(el){el.value='';el.focus();} },30);
}

function removeTask(wi,ci,ti) {
  getCats(wi)[ci].tasks.splice(ti,1);
  rerenderCatEd(wi,ci);
}

function removeCat(wi,ci) {
  if(!confirm(`"${getCats(wi)[ci].name}" silinecek. Emin misin?`)) return;
  getCats(wi).splice(ci,1);
  document.getElementById('se-cats').innerHTML=getCats(wi).map((c,i)=>buildCatEditor(wi,c,i)).join('');
  updatePtsWarn(wi);
}

function addCat(wi) {
  const pal=['#ff6b9d','#c77dff','#4cc9f0','#f72585','#06d6a0','#ffbe0b'];
  getCats(wi).push({name:'Yeni Kategori',color:pal[getCats(wi).length%pal.length],target:5,tasks:[{name:'Yeni Görev',pts:5,sessions:1}]});
  document.getElementById('se-cats').innerHTML=getCats(wi).map((c,i)=>buildCatEditor(wi,c,i)).join('');
  updatePtsWarn(wi);
  setTimeout(()=>document.getElementById(`ce-${wi}-${getCats(wi).length-1}`)?.scrollIntoView({behavior:'smooth',block:'center'}),100);
}

function rerenderCatEd(wi,ci) {
  const el=document.getElementById(`ce-${wi}-${ci}`);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=buildCatEditor(wi,getCats(wi)[ci],ci);el.replaceWith(tmp.firstElementChild);}
}

function saveSettings(wi) {
  const cats=getCats(wi);
  cats.forEach((cat,ci)=>{
    const n=document.getElementById(`cn-${wi}-${ci}`);
    const t=document.getElementById(`ct-${wi}-${ci}`);
    const cp=document.getElementById(`cp-${wi}-${ci}`);
    if(n) cat.name=n.value.trim()||cat.name;
    if(t) cat.target=parseInt(t.value)||cat.target;
    if(cp) cat.color=cp.value;
    cat.tasks.forEach((task,ti)=>{
      const tn=document.getElementById(`tn-${wi}-${ci}-${ti}`);
      const tp=document.getElementById(`tp-${wi}-${ci}-${ti}`);
      const ts=document.getElementById(`ts-${wi}-${ci}-${ti}`);
      const td=document.getElementById(`td-${wi}-${ci}-${ti}`);
      if(tn) task.name=tn.value.trim()||task.name;
      if(tp) task.pts=parseInt(tp.value)||task.pts;
      if(ts) task.sessions=Math.min(7,Math.max(1,parseInt(ts.value)||1));
      if(td) task.deadline = td.value!=='' ? parseInt(td.value) : null;
    });
  });
  syncWeekData(wi); save();
  toast('✅ Kaydedildi!');
  setTimeout(()=>renderWeek(wi),600);
}

function resetWeek(wi) {
  if(!confirm(`${WEEKS[wi].label} haftasının tüm verisi silinecek ve varsayılan görevlere dönülecek. Emin misin?`)) return;
  delete weekCats[wi]; delete weekData[wi]; save();
  toast('🔄 Hafta sıfırlandı');
  renderWeek(wi);
}
