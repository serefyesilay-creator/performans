<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Performans">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Haftalık Takip</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f17;--surface:#16161f;--card:#1c1c28;--border:#2a2a3d;
  --text:#e8e8f0;--muted:#6b6b8a;--accent:#7c83fd;--white:#fff;
  --green:#57c97a;--red:#f38ba8;--orange:#fab387;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;padding-bottom:80px;}

/* HERO */
.hero{background:linear-gradient(135deg,#0f0f17,#1a1a2e,#16213e);border-bottom:1px solid var(--border);padding:30px 24px 24px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(124,131,253,.15),transparent 70%);pointer-events:none;}
.hero-badge{display:inline-block;background:rgba(124,131,253,.12);border:1px solid rgba(124,131,253,.3);color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;padding:4px 14px;border-radius:20px;margin-bottom:12px;}
.hero h1{font-size:clamp(18px,4vw,32px);font-weight:700;color:var(--white);margin-bottom:4px;}
.hero h1 span{color:var(--accent);}
.hero p{color:var(--muted);font-size:13px;}
.hero-stats{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap;}
.hero-stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;padding:5px 16px;font-size:12px;color:var(--muted);}
.hero-stat strong{color:var(--accent);font-weight:700;}

/* QUARTER TABS */
.q-tabs{display:flex;justify-content:center;gap:8px;padding:18px 16px 0;flex-wrap:wrap;}
.q-tab{padding:8px 22px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.q-tab:hover{border-color:var(--accent);color:var(--text);}
.q-tab.active{background:var(--accent);border-color:var(--accent);color:var(--white);}

/* WEEK SELECTOR */
.week-selector-wrap{max-width:1100px;margin:0 auto;padding:18px 16px 0;}
.week-selector-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
.week-btn{padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .2s;text-align:center;line-height:1.4;}
.week-btn:hover{border-color:var(--accent);color:var(--text);}
.week-btn.active{background:var(--accent);border-color:var(--accent);color:var(--white);font-weight:600;}
.week-btn .wdate{font-size:9px;opacity:.7;display:block;margin-top:2px;}
.week-btn .wpct{font-size:10px;color:var(--green);display:block;margin-top:2px;}
.week-btn.active .wpct{color:rgba(255,255,255,.8);}

/* MAIN */
.container{max-width:1100px;margin:0 auto;padding:20px 16px;}

/* WEEK HEADER */
.week-header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.week-title{font-size:18px;font-weight:700;color:var(--white);}
.week-title span{color:var(--accent);}
.week-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;}
.btn-copy{background:rgba(124,131,253,.12);border:1px solid rgba(124,131,253,.3);color:var(--accent);border-radius:8px;padding:7px 16px;font-family:'Space Grotesk',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.btn-copy:hover{background:rgba(124,131,253,.25);}

/* SCORE ROW */
.score-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.score-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;transition:transform .2s;}
.score-card:hover{transform:translateY(-2px);}
.sc-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:7px;}
.sc-val{font-size:28px;font-weight:700;color:var(--white);line-height:1;margin-bottom:3px;}
.sc-sub{font-size:11px;color:var(--muted);}
.score-card.accent{border-color:var(--accent);background:rgba(124,131,253,.08);}
.score-card.accent .sc-val{color:var(--accent);}

/* PROGRESS */
.progress-wrap{margin-bottom:18px;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;}
.progress-bar-bg{height:7px;background:var(--border);border-radius:8px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--accent),#a78bfa);}

/* TASK TABLE */
.task-table{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.cat-header{padding:9px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tgt-badge{margin-left:auto;font-family:'DM Mono',monospace;font-size:11px;padding:2px 8px;border-radius:6px;}
.day-headers{display:grid;align-items:center;padding:6px 16px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);gap:6px;}
.dh-span{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);text-align:center;width:30px;}
.task-row{display:grid;align-items:center;padding:6px 16px;border-top:1px solid var(--border);gap:6px;transition:background .15s;}
.task-row:hover{background:rgba(255,255,255,.02);}
.task-name{font-size:12px;color:var(--text);}
.gain{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 8px;border-radius:20px;font-family:'DM Mono',monospace;font-size:9.5px;font-weight:600;color:var(--green);background:rgba(87,201,122,.1);border:1px solid rgba(87,201,122,.3);white-space:nowrap;}
.gain .gs{opacity:.7;font-weight:500;}
.gain.got{color:var(--muted);background:transparent;border-color:var(--border);font-weight:500;}
.pts-badge{font-family:'DM Mono',monospace;font-size:10px;padding:2px 5px;border-radius:5px;font-weight:500;min-width:27px;text-align:center;}
.day-input{width:30px;height:29px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;text-align:center;transition:all .15s;cursor:pointer;-moz-appearance:textfield;}
.day-input::-webkit-inner-spin-button,.day-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.day-input:hover{border-color:var(--accent);}
.day-input:focus{outline:none;border-color:var(--accent);background:rgba(124,131,253,.08);}
.day-input.done{background:rgba(87,201,122,.15);border-color:var(--green);color:var(--green);}
.day-input.partial{background:rgba(250,179,135,.12);border-color:var(--orange);color:var(--orange);}
/* ── DEADLINE ── */
.day-input.deadline-cell{box-shadow:0 0 0 2px var(--orange);border-color:var(--orange);}
.day-input.deadline-cell.overdue{box-shadow:0 0 0 2px var(--red);border-color:var(--red);}
.task-row.has-deadline{box-shadow:inset 3px 0 0 var(--orange);}
.task-row.has-deadline.overdue{box-shadow:inset 3px 0 0 var(--red);background:rgba(243,139,168,.05);}
.dl-badge{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:1px 8px;border-radius:20px;font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.3px;vertical-align:middle;white-space:nowrap;}
.dl-badge.upcoming{background:rgba(250,179,135,.16);color:var(--orange);border:1px solid rgba(250,179,135,.35);}
.dl-badge.today{background:rgba(250,179,135,.28);color:var(--orange);border:1px solid var(--orange);box-shadow:0 0 8px rgba(250,179,135,.3);}
.dl-badge.overdue{background:rgba(243,139,168,.18);color:var(--red);border:1px solid var(--red);animation:dlpulse 1.6s ease-in-out infinite;}
.dl-badge.done{background:rgba(87,201,122,.14);color:var(--green);border:1px solid rgba(87,201,122,.3);}
.free-badge{display:inline-flex;align-items:center;margin-left:8px;padding:1px 8px;border-radius:20px;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);border:1px dashed var(--border);opacity:.7;vertical-align:middle;white-space:nowrap;}
@keyframes dlpulse{0%,100%{opacity:1}50%{opacity:.5}}
.dl-select{height:29px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:0 6px;cursor:pointer;}
.dl-select:focus{outline:none;border-color:var(--orange);}
.dl-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:2px 0 16px;padding:9px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
.dl-legend span{display:inline-flex;align-items:center;gap:6px;}
.lg-chip{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.lg-chip.up{background:var(--orange);}
.lg-chip.od{background:var(--red);}
.lg-chip.fr{border:1px dashed var(--muted);}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
.chart-card h3{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:14px;}
.chart-card canvas{max-height:220px;}

/* SETTINGS */
.settings-wrap{display:flex;flex-direction:column;gap:14px;}
.settings-info{background:rgba(124,131,253,.08);border:1px solid rgba(124,131,253,.25);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.6;}
.settings-info strong{color:var(--accent);}
.copy-notice{background:rgba(87,201,122,.08);border:1px solid rgba(87,201,122,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--green);}

.cat-editor{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2px;}
.cat-ed-header{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.01);}
.color-swatch{width:22px;height:22px;border-radius:6px;flex-shrink:0;cursor:pointer;position:relative;border:2px solid rgba(255,255,255,.15);transition:transform .15s;}
.color-swatch:hover{transform:scale(1.15);}
.cp-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.cat-name-in{flex:1;background:transparent;border:none;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--white);outline:none;border-bottom:1px solid transparent;transition:border .15s;}
.cat-name-in:focus{border-bottom-color:var(--accent);}
.tgt-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
.small-num{width:44px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:3px 5px;text-align:center;outline:none;transition:border .15s;-moz-appearance:textfield;}
.small-num::-webkit-inner-spin-button,.small-num::-webkit-outer-spin-button{-webkit-appearance:none;}
.small-num:focus{border-color:var(--accent);}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:3px 6px;border-radius:5px;transition:all .15s;line-height:1;}
.btn-icon:hover{background:rgba(255,255,255,.06);color:var(--text);}
.btn-icon.danger:hover{color:var(--red);background:rgba(243,139,168,.1);}

.task-ed-row{display:flex;align-items:center;gap:7px;padding:7px 14px;border-top:1px solid var(--border);transition:background .15s;}
.task-ed-row:hover{background:rgba(255,255,255,.015);}
.drag-h{color:var(--muted);font-size:12px;cursor:grab;user-select:none;}
.task-name-in{flex:1;background:transparent;border:none;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--text);outline:none;border-bottom:1px solid transparent;transition:border .15s;padding:2px 0;}
.task-name-in:focus{border-bottom-color:var(--accent);}

.add-task-row{display:flex;align-items:center;gap:7px;padding:9px 14px;border-top:1px solid var(--border);background:rgba(255,255,255,.008);}
.add-task-in{flex:1;background:transparent;border:none;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--muted);outline:none;transition:color .15s;}
.add-task-in:focus{color:var(--text);}
.add-task-in::placeholder{color:var(--border);}
.btn-add{background:rgba(124,131,253,.12);border:1px solid rgba(124,131,253,.3);color:var(--accent);border-radius:6px;padding:4px 12px;font-family:'Space Grotesk',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-add:hover{background:rgba(124,131,253,.25);}

.add-cat-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:var(--card);border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
.add-cat-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,131,253,.05);}

.settings-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;}
.btn-primary{background:var(--accent);border:none;color:var(--white);border-radius:9px;padding:10px 22px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn-primary:hover{opacity:.85;}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 18px;font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger-out{background:rgba(243,139,168,.08);border:1px solid rgba(243,139,168,.25);color:var(--red);border-radius:9px;padding:10px 18px;font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;}
.btn-danger-out:hover{background:rgba(243,139,168,.15);}

.pts-warn{font-family:'DM Mono',monospace;font-size:11px;padding:9px 14px;border-radius:9px;text-align:center;}
.warn-ok{background:rgba(87,201,122,.1);color:var(--green);border:1px solid rgba(87,201,122,.2);}
.warn-bad{background:rgba(243,139,168,.1);color:var(--red);border:1px solid rgba(243,139,168,.2);}

/* PILL */
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;font-family:'DM Mono',monospace;}
.pill-great{background:rgba(87,201,122,.15);color:var(--green);}
.pill-ok{background:rgba(124,131,253,.15);color:var(--accent);}
.pill-mid{background:rgba(250,179,135,.15);color:var(--orange);}
.pill-low{background:rgba(243,139,168,.15);color:var(--red);}

/* YEAR OVERVIEW */
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px;margin-bottom:20px;}
.year-cell{padding:6px 4px;border-radius:7px;border:1px solid var(--border);background:var(--surface);text-align:center;cursor:pointer;transition:all .2s;font-size:9px;font-family:'DM Mono',monospace;color:var(--muted);}
.year-cell:hover{border-color:var(--accent);}
.year-cell.has-data{background:var(--card);}
.year-cell .yc-pct{font-size:11px;font-weight:700;margin-top:2px;}
.year-cell.pct-great{border-color:rgba(87,201,122,.4);}.year-cell.pct-great .yc-pct{color:var(--green);}
.year-cell.pct-ok{border-color:rgba(124,131,253,.4);}.year-cell.pct-ok .yc-pct{color:var(--accent);}
.year-cell.pct-mid{border-color:rgba(250,179,135,.4);}.year-cell.pct-mid .yc-pct{color:var(--orange);}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#2a2a3d;border:1px solid var(--accent);color:var(--text);padding:9px 22px;border-radius:28px;font-size:12px;z-index:9999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.data-bar{display:flex;justify-content:center;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.data-bar-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;}
.btn-export{display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid;}
.btn-export.green{background:rgba(87,201,122,.1);border-color:rgba(87,201,122,.3);color:#57c97a;}
.btn-export.green:hover{background:rgba(87,201,122,.2);}
.btn-export.blue{background:rgba(124,131,253,.1);border-color:rgba(124,131,253,.3);color:#7c83fd;}
.btn-export.blue:hover{background:rgba(124,131,253,.2);}
.btn-export.red{background:rgba(243,139,168,.08);border-color:rgba(243,139,168,.25);color:#f38ba8;}
.btn-export.red:hover{background:rgba(243,139,168,.15);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#1c1c28;border:1px solid #2a2a3d;border-radius:16px;padding:24px;max-width:500px;width:100%;}
.modal-box h2{font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;}
.modal-box p{font-size:13px;color:#6b6b8a;margin-bottom:16px;line-height:1.6;}
.modal-textarea{width:100%;background:#16161f;border:1px solid #2a2a3d;border-radius:8px;color:#e8e8f0;font-family:'DM Mono',monospace;font-size:11px;padding:12px;height:160px;resize:vertical;outline:none;margin-bottom:12px;transition:border .15s;}
.modal-textarea:focus{border-color:#7c83fd;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}

/* ── HAFTA ALT BAR ── */
.week-subnav{position:sticky;bottom:12px;z-index:50;display:flex;gap:6px;flex-wrap:wrap;margin:22px auto 0;padding:7px;background:rgba(22,22,31,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:14px;max-width:820px;box-shadow:0 8px 28px rgba(0,0,0,.4);}
.wsn-btn{flex:1;min-width:120px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.wsn-btn:hover{border-color:var(--accent);color:var(--text);}
.wsn-btn.active{background:var(--accent);border-color:var(--accent);color:var(--white);}
.wsn-btn.month{border-color:rgba(87,201,122,.4);color:var(--green);}
.wsn-btn.month.active{background:var(--green);border-color:var(--green);color:#0f0f17;}
.sub-intro{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.sub-intro b{color:var(--white);}
.sub-hint{display:block;font-size:11px;color:var(--accent);margin-top:2px;}

/* ── ÖNCELİK (görev satırı etiketi + matris özeti) ── */
.rk-tag{width:30px;height:24px;border-radius:7px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;line-height:1;cursor:pointer;padding:0;transition:all .15s;opacity:.55;}
.rk-tag:hover{border-color:var(--accent);opacity:1;}
.rk-tag.on{border:1px solid rgba(250,179,135,.7);background:rgba(250,179,135,.16);opacity:1;}
.task-row.is-rock{background:rgba(250,179,135,.06);}
.qp-menu{position:absolute;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px;min-width:210px;}

/* ══════════════════════════════════════════════════════════
   WEEK GENERATION — Start: 23 Feb 2026 (Monday)
══════════════════════════════════════════════════════════ */
const START = new Date(2026,1,23); // Feb=1
const DAYS_SHORT = ['Pzt','Sal','Çar','Per','Cum','Cts','Paz'];
const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(d){return `${d.getDate()} ${MONTHS_TR[d.getMonth()]}`;}
function fmtDateShort(d){return `${d.getDate()}/${d.getMonth()+1}`;}

// Generate all weeks of 2026 starting from 23 Feb
const WEEKS = [];
let cur = new Date(START);
let wNum = 1;
const END_OF_YEAR = new Date(2026,11,31);
while(cur <= END_OF_YEAR) {
  const mon = new Date(cur);
  const sun = addDays(cur,6);
  WEEKS.push({
    idx: WEEKS.length,
    num: wNum++,
    mon, sun,
    label: `H${WEEKS.length+1}`,
    dateLabel: `${fmtDate(mon)} – ${fmtDate(sun)}`,
    shortLabel: `${fmtDateShort(mon)}`,
    month: mon.getMonth(),
    quarter: Math.floor(mon.getMonth()/3),
  });
  cur = addDays(cur,7);
}

// Quarter groupings (by actual quarter of start month)
// Q1=Feb-Mar(0-1 but starts Feb), Q2=Apr-Jun, Q3=Jul-Sep, Q4=Oct-Dec
const Q_LABELS = ['Şub–Mar','Nis–Haz','Tem–Eyl','Eki–Ara'];
const Q_WEEKS = [
  WEEKS.filter(w=>w.month<=2),   // Feb,Mar (month 1,2)
  WEEKS.filter(w=>w.month>=3&&w.month<=5),
  WEEKS.filter(w=>w.month>=6&&w.month<=8),

];

async function sbGet(key) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/performans?key=eq.${encodeURIComponent(key)}&select=value&limit=1`, {
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json'
      }
    });
    if(!r.ok) { console.error('sbGet error', r.status, await r.text()); return null; }
    const d = await r.json();
    return d && d[0] ? JSON.parse(d[0].value) : null;
  } catch(e) { console.error('sbGet exception', e); return null; }
}

async function sbSet(key, value) {
  try {
    const body = JSON.stringify({key: key, value: JSON.stringify(value)});
    // keepalive: sayfa kapanırken de istek tamamlanabilsin (tarayıcı limiti ~64KB)
    const keepalive = body.length < 60000;
    // First try to delete existing, then insert
    await fetch(`${SB_URL}/rest/v1/performans?key=eq.${encodeURIComponent(key)}`, {
      method: 'DELETE',
      keepalive,
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY
      }
    });
    const r = await fetch(`${SB_URL}/rest/v1/performans`, {
      method: 'POST',

        'Authorization': 'Bearer ' + SB_KEY,

  } catch(e) { console.error('sbSet exception', e); }

function getCats(wi) {
  if(!weekCats[wi]) weekCats[wi] = JSON.parse(JSON.stringify(DEFAULT_CATS));
  return weekCats[wi];
}

function getData(wi) {
  if(!weekData[wi]) {
    const cats = getCats(wi);
    weekData[wi] = cats.map(cat=>cat.tasks.map(()=>Array(7).fill(0)));
  }
  return weekData[wi];
}

function syncWeekData(wi) {
  const cats = getCats(wi);
  const old = weekData[wi] || [];
  weekData[wi] = cats.map((cat,ci)=>cat.tasks.map((_,ti)=>(old[ci]?.[ti])||Array(7).fill(0)));
}

    localStorage.setItem('wc26', JSON.stringify(weekCats));
    localStorage.setItem('wd26', JSON.stringify(weekData));
    _dirty.add('wc26'); _dirty.add('wd26');
    saveToCloud();
  } catch(e) { toast('⚠️ Depolama dolu, eski veriler silinebilir'); }
}

/* ══════════════════════════════════════════════════════════
   CALCULATIONS
══════════════════════════════════════════════════════════ */
// Görevin kazandığı puan: sessions>1 ise oturum oranına göre ölçeklenir
// Örnek: pts=3, sessions=5, 3 gün yapıldı → 3*(3/5) = 1.8 puan
function taskEarned(wi,ci,ti) {
  const cats=getCats(wi), d=getData(wi);
  const task=cats[ci].tasks[ti];
  const sessions=task.sessions||1;
  const done=(d[ci]?.[ti]||[]).reduce((a,b)=>a+b,0);
  if(sessions===1) {
    // Tek oturum: ya tam ya sıfır (eski davranış)
    return done>=1 ? task.pts : 0;
  }
  // Çoklu oturum: orana göre puan, sessions'ı geçemez
  const completed=Math.min(done,sessions);
  return +(task.pts*(completed/sessions)).toFixed(2);
}
function catTotal(wi,ci) {
  const cats=getCats(wi);
  return +cats[ci].tasks.reduce((s,_,ti)=>s+taskEarned(wi,ci,ti),0).toFixed(2);
}
function weekTotal(wi) {
  const cats=getCats(wi);
  return +cats.reduce((s,_,ci)=>s+catTotal(wi,ci),0).toFixed(2);
}
function weekTarget(wi) { return getCats(wi).reduce((s,c)=>s+c.target,0); }
// weekPlan[wi].manual = { grade: 0-10 | null, note: '' } — ani değişiklik olan haftada not + elle puan
function manualOf(wi) { const m = weekPlan[wi]?.manual; return m && typeof m.grade === 'number' ? m : null; }
function autoPct(wi) { const t=weekTarget(wi); return t?Math.round(weekTotal(wi)/t*100):0; }
function weekPct(wi) { const m=manualOf(wi); return m ? Math.round(m.grade*10) : autoPct(wi); }
function hasData(wi) { return weekTotal(wi)>0 || !!manualOf(wi); }

// 10 uzerinden not sistemi
function calcGrade(pct) { return +(pct/10).toFixed(1); }
function gradeInfo(g) {
  if(g>=9) return {emoji:'🏆',text:'Mükemmel',cls:'pill-great',color:'var(--green)'};
  if(g>=7) return {emoji:'✅',text:'İyi',cls:'pill-ok',color:'var(--accent)'};
  if(g>=5) return {emoji:'⚠️',text:'Orta',cls:'pill-mid',color:'var(--orange)'};
  return {emoji:'❌',text:'Geliştir',cls:'pill-low',color:'var(--red)'};
}
function pill(pct) {
  const g=calcGrade(pct);
  const {emoji,text,cls}=gradeInfo(g);
  return `<span class="pill ${cls}">${emoji} ${text} · <strong>${g.toFixed(1)}/10</strong></span>`;
}

function updateHeroStats() {
  const withData = WEEKS.filter(w=>hasData(w.idx));
  const avgGrade = withData.length
    ? (withData.reduce((s,w)=>s+calcGrade(weekPct(w.idx)),0)/withData.length).toFixed(1)
    : '—';
  const best = withData.length
    ? withData.reduce((b,w)=>weekPct(w.idx)>weekPct(b.idx)?w:b)
    : null;
  const g=id=>document.getElementById(id);
  if(g('stat-weeks')) g('stat-weeks').textContent=WEEKS.length;
  if(g('stat-avg')) g('stat-avg').textContent=avgGrade;
  if(g('stat-best')) g('stat-best').textContent=best?`${best.label} (${calcGrade(weekPct(best.idx)).toFixed(1)}/10)`:'—';
}

/* ══════════════════════════════════════════════════════════
   WEEK PAGE
══════════════════════════════════════════════════════════ */
let currentWI = 0;

function buildWeekPage(wi) {
  currentWI = wi;
  const role = monthRole(wi);
  if (weekView === 'month' && !role.first && !role.last) weekView = 'tasks';
  let body;
  if (weekView === 'mtasks') body = buildMonthTasksView(wi);
  else if (weekView === 'days') body = buildDaysView(wi);
  else if (weekView === 'month') body = buildMonthView(wi);
  else body = buildTasksView(wi);
  return buildWeekHeader(wi) + body + buildSubNav(wi);
}

function buildWeekHeader(wi) {
  const tgt = weekTarget(wi);
  return `
    <div class="week-header-bar">
      <div>
        <div class="week-title">${WEEKS[wi].label} · <span>${WEEKS[wi].dateLabel}</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:'DM Mono',monospace">
          Hafta hedef tavanı: <span style="color:var(--accent);font-weight:600">${tgt} puan</span>
          &nbsp;·&nbsp; Başarı notu bu tavana göre hesaplanır
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn-copy" onclick="showSettings(${wi})">⚙️ Bu Haftayı Düzenle</button>
        <button class="btn-copy" onclick="copyFromPrev(${wi})">📋 Önceki Haftadan Kopyala</button>
      </div>
    </div>`;
}

function gradeLine(wi) {
  const a = autoPct(wi), m = manualOf(wi);
  return m ? `${a}% → Otomatik: ${calcGrade(a).toFixed(1)} · ✍️ Elle: ${m.grade.toFixed(1)}/10`
           : `${a}% → Not: ${calcGrade(a).toFixed(1)}/10`;
}

/* ── HAFTA NOTU + ELLE PUAN ── */
function getWeekManual(wi) {
  const p = getPlan(wi);
  if (!p.manual) p.manual = {grade: null, note: ''};
  return p.manual;
}
function buildWeekNote(wi) {
  const m = weekPlan[wi]?.manual || {grade: null, note: ''};
  const on = typeof m.grade === 'number';
  const open = on || (m.note || '').trim();
  return `<details class="wn ${on ? 'on' : ''}" ${open ? 'open' : ''}>
    <summary>📝 Hafta notu${on ? ` · <span class="man-tag">✍️ Not elle belirlendi: ${m.grade.toFixed(1)}/10</span>` : (m.note || '').trim() ? ' · <span class="wn-has">not var</span>' : ' <span class="wn-hint">— ani bir değişiklik mi oldu? (hastalık, seyahat, acil iş…)</span>'}</summary>
    <div class="wn-body">
      <textarea class="wn-text" id="wn-text-${wi}" placeholder="Bu hafta ne oldu? Neden planlandığı gibi gitmedi / neyi değiştirdin?" oninput="wnNote(${wi},this.value)">${esc(m.note || '')}</textarea>
      <div class="wn-row">
        <label class="wn-chk"><input type="checkbox" id="wn-on-${wi}" ${on ? 'checked' : ''} onchange="wnToggle(${wi},this.checked)"> Bu haftanın notunu elle belirle</label>
        <span class="wn-grade ${on ? '' : 'off'}">
          <input type="number" id="wn-grade-${wi}" min="0" max="10" step="0.5" value="${on ? m.grade : ''}" ${on ? '' : 'disabled'} onchange="wnGrade(${wi},this.value)"> / 10
        </span>
        <span class="wn-auto">Otomatik hesap: <b id="wn-auto-${wi}">${calcGrade(autoPct(wi)).toFixed(1)}</b>/10</span>
      </div>
      <div class="wn-foot">Elle not girilince yıl ortalaması, grafikler ve ay değerlendirmesi bu notu kullanır. Görev puanların silinmez; kutuyu kaldırınca otomatik hesaba döner.</div>
    </div>
  </details>`;
}
function wnNote(wi, v) { getWeekManual(wi).note = v; savePlan(); }
function wnToggle(wi, on) {
  const m = getWeekManual(wi);
  if (on) {
    if (!(m.note || '').trim()) toast('📝 Elle not verirken kısa bir açıklama yazmayı unutma');
    m.grade = calcGrade(autoPct(wi));
  } else m.grade = null;
  savePlan(); afterManual(wi);
}
function wnGrade(wi, v) {
  const n = Math.max(0, Math.min(10, parseFloat(String(v).replace(',', '.'))));
  if (isNaN(n)) return;
  getWeekManual(wi).grade = Math.round(n * 10) / 10;
  savePlan(); afterManual(wi);
}
function afterManual(wi) {
  rerenderView(); updateHeroStats(); updateWeekBtns();
}

/* ── GÖREVİN NOTA KATKISI (10 üzerinden) ── */
const nf = (x, d=2) => (+x).toLocaleString('tr-TR', {maximumFractionDigits:d, minimumFractionDigits:0});
function gainHTML(wi, ci, ti) {
  const task = getCats(wi)[ci]?.tasks[ti], tgt = weekTarget(wi);
  if (!task || !tgt) return '';
  const sess = task.sessions || 1;
  const done = Math.min(sess, taskDoneCount(wi, ci, ti));
  const per = (task.pts / sess) / tgt * 10;          // 1 oturumun nota katkısı
  const left = sess - done;
  const tip = `Bu görev haftalık notuna toplam +${nf(task.pts / tgt * 10)} (%${nf(task.pts / tgt * 100, 1)}) ekler`
    + (sess > 1 ? ` · her oturum +${nf(per)}` : '') + (manualOf(wi) ? ' · Not: bu hafta elle not girildi, katkı otomatik nota eklenir' : '');
  if (left <= 0) return `<span class="gain got" id="wgain-${wi}-${ci}-${ti}" title="${tip}">✓ +${nf(task.pts / tgt * 10)} alındı</span>`;
  if (sess === 1) return `<span class="gain" id="wgain-${wi}-${ci}-${ti}" title="${tip}">+${nf(per)} not <span class="gs">· %${nf(per * 10, 1)}</span></span>`;
  return `<span class="gain" id="wgain-${wi}-${ci}-${ti}" title="${tip}">oturum +${nf(per)} <span class="gs">· kalan +${nf(per * left)}</span></span>`;
}

function buildTasksView(wi) {

  const rocks=getPlan(wi).rocks;

        <div class="sc-label">Toplam Puan</div>
        <div class="sc-val" id="wtotal-${wi}">${Number.isInteger(total)?total:total.toFixed(1)}</div>
        <div class="sc-sub">/ ${tgt} puan</div>
      </div>
      <div class="score-card" style="border-color:var(--accent);background:rgba(124,131,253,.06)">
        <div class="sc-label">10 Üzerinden Not${man?' · <span class="man-tag">✍️ elle</span>':''}</div>
        <div class="sc-val" id="wpct-${wi}" style="color:var(--accent)">${calcGrade(pct).toFixed(1)}</div>
        <div class="sc-sub" id="wpill-${wi}">${pill(pct)}</div>
      </div>
      <div class="score-card">
        <div class="sc-label">Başarı %</div>
        <div class="sc-val" id="wpct3-${wi}" style="font-size:22px">${apct}%</div>
        <div class="sc-sub">${total} / ${tgt} puan</div>
      </div>
      ${cats.map((cat,ci)=>`
        <div class="score-card">
          <div class="sc-label" style="color:${cat.color}">${cat.name.split(' ')[0]}</div>
          <div class="sc-val" id="wcat-${wi}-${ci}" style="color:${cat.color}">${catTotal(wi,ci)}</div>
          <div class="sc-sub">/ ${cat.target}p</div>
        </div>`).join('')}
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Haftalık İlerleme (${total}/${tgt}p)</span><span id="wpct2-${wi}">${gradeLine(wi)}</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="wbar-${wi}" style="width:${apct}%"></div></div>
    </div>
    ${buildWeekNote(wi)}

    <div class="dl-legend">
      <span><span class="lg-chip up"></span>⏰ Deadline'lı görev</span>
      <span><span class="lg-chip od"></span>⚠ Süresi geçti</span>
      <span><span class="lg-chip fr"></span>Serbest — acelesi yok</span>
      <span><span class="gain" style="margin-left:0">+0,9 not</span> = görevi yaparsan 10 üzerinden notuna eklenen</span>
      <span style="margin-left:auto;opacity:.7">Deadline'ı görev düzenleyicide ayarla ⚙️</span>
    </div>`;

  cats.forEach((cat,ci)=>{
    html+=`<div class="task-table">
      <div class="cat-header" style="background:${cat.color}20;color:${cat.color}">
        <div class="cat-dot" style="background:${cat.color}"></div>${cat.name}
        <span class="tgt-badge" style="background:${cat.color}20;color:${cat.color}">Hedef: ${cat.target}p</span>
      </div>
      <div class="day-headers" style="grid-template-columns:${gc}">
        <span style="text-align:left;width:auto;font-size:9px;color:var(--muted);letter-spacing:1px">GÖREV</span>
        <span class="dh-span" title="Bu haftanın taşı">TAŞ</span>
        <span class="dh-span" style="width:27px">PTS</span>
        ${DAYS_SHORT.map(d=>`<span class="dh-span">${d}</span>`).join('')}
      </div>
      ${cat.tasks.map((task,ti)=>{
        const sess=task.sessions||1;
        const totalDone=(data[ci]?.[ti]||[]).reduce((a,b)=>a+(b||0),0);
        const isDone=totalDone>=sess;
        const dl=(task.deadline===0||task.deadline)?task.deadline:null;
        let rowCls='', badge='';
        if(dl!==null){
          const d0=new Date(addDays(WEEKS[wi].mon,dl)); d0.setHours(0,0,0,0);
          const t0=new Date(); t0.setHours(0,0,0,0);
          const st = isDone ? 'done' : (t0>d0 ? 'overdue' : (t0.getTime()===d0.getTime() ? 'today' : 'upcoming'));
          rowCls = st==='overdue' ? 'has-deadline overdue' : 'has-deadline';
          const lbl = st==='overdue' ? `⚠ ${DAYS_SHORT[dl]} · geçti`
                    : st==='today'  ? `⏰ ${DAYS_SHORT[dl]} · bugün`
                    : st==='done'   ? `✓ ${DAYS_SHORT[dl]} teslim`
                    :                 `⏰ ${DAYS_SHORT[dl]}'e kadar`;
          badge=`<span class="dl-badge ${st}">${lbl}</span>`;
        } else {
          badge=`<span class="free-badge">serbest</span>`;
        }
        return `<div class="task-row ${rowCls} ${rocks.includes(taskKey(cat,task))?'is-rock':''}" style="grid-template-columns:${gc}">
          <span class="task-name">${task.name}${badge}${gainHTML(wi,ci,ti)}</span>
          ${(()=>{const k=taskKey(cat,task), on=rocks.includes(k);
            return `<button class="rk-tag ${on?'on':''}" data-key="${esc(k)}" title="${on?'Bu haftanın taşı — çıkarmak için dokun':'Bu haftanın 3 taşından biri yap'}" onclick="rkToggle(this.dataset.key)">🎯</button>`;})()}
          <span class="pts-badge" style="background:${cat.color}20;color:${cat.color};min-width:36px;font-size:9px;padding:2px 4px" title="${sess>1?`${sess} oturumda ${task.pts} puan`:`${task.pts} puan`}">
            ${task.pts}p${sess>1?`<span style="opacity:.6;font-size:8px"> /${sess}</span>`:''}
          </span>
          ${DAYS_SHORT.map((_,di)=>{
            const val=data[ci]?.[ti]?.[di]||0;
            const doneClass=val>=sess?'done':val>0?'partial':'';
            const dlCell = dl===di ? (rowCls.includes('overdue')?'deadline-cell overdue':'deadline-cell') : '';
            return `<input type="number" min="0" max="${sess}"
              class="day-input ${doneClass} ${dlCell}"
              value="${val}"
              title="${dl===di?`⏰ Deadline günü`:sess>1?`Hedef: ${sess} oturum — bugün: ${val}`:''}"
              onchange="updateCell(this,${wi},${ci},${ti},${di})">`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>`;
  });
  return html;
}

function updateCell(input,wi,ci,ti,di) {
  const cats=getCats(wi);
  const sessions=(cats[ci]?.tasks[ti]?.sessions)||1;
  const val=Math.min(sessions,Math.max(0,parseInt(input.value)||0));
  input.value=val;
  const wasDone=taskDoneCount(wi,ci,ti)>=sessions;
  if(!weekData[wi]) weekData[wi]=[];
  if(!weekData[wi][ci]) weekData[wi][ci]=[];
  if(!weekData[wi][ci][ti]) weekData[wi][ci][ti]=Array(7).fill(0);
  weekData[wi][ci][ti][di]=val;
  input.classList.remove('done','partial');
  if(val>=sessions) input.classList.add('done');
  else if(val>0) input.classList.add('partial');
  save();
  const total=weekTotal(wi),apct=autoPct(wi),pct=weekPct(wi);
  const g=id=>document.getElementById(id);
  if(g(`wtotal-${wi}`)) g(`wtotal-${wi}`).textContent=Number.isInteger(total)?total:total.toFixed(1);
  if(g(`wpct-${wi}`)) g(`wpct-${wi}`).textContent=calcGrade(pct).toFixed(1);
  if(g(`wpct3-${wi}`)) g(`wpct3-${wi}`).textContent=apct+'%';
  if(g(`wpct2-${wi}`)) g(`wpct2-${wi}`).textContent=gradeLine(wi);
  if(g(`wbar-${wi}`)) g(`wbar-${wi}`).style.width=apct+'%';
  if(g(`wn-auto-${wi}`)) g(`wn-auto-${wi}`).textContent=calcGrade(apct).toFixed(1);
  if(g(`wpill-${wi}`)) g(`wpill-${wi}`).innerHTML=pill(pct);
  if(g(`wcat-${wi}-${ci}`)) g(`wcat-${wi}-${ci}`).textContent=(t=>Number.isInteger(t)?t:t.toFixed(1))(catTotal(wi,ci));
  const gEl=g(`wgain-${wi}-${ci}-${ti}`);
  if(gEl) gEl.outerHTML=gainHTML(wi,ci,ti);
  updateHeroStats();
  updateWeekBtns();
  mtSyncFromWeek(wi,ci,ti,wasDone);
}

function taskDoneCount(wi,ci,ti) {
  return (weekData[wi]?.[ci]?.[ti]||[]).reduce((a,b)=>a+(b||0),0);
}

function copyFromPrev(wi) {
  if(wi===0){toast('İlk hafta, kopyalanacak önceki hafta yok');return;}
  if(!confirm(`Hafta ${wi} görev listesini bu haftaya (${WEEKS[wi].label}) kopyalamak ister misin?\nMevcut bu haftanın görevleri silinecek.`)) return;
  weekCats[wi] = JSON.parse(JSON.stringify(getCats(wi-1)));
  syncWeekData(wi);
  save();
  toast('✅ Önceki haftadan kopyalandı!');
  renderWeek(wi);
}

        <input type="number" class="small-num" id="ts-${wi}-${ci}-${ti}" value="${task.sessions||1}" min="1" max="7" title="Haftalık kaç oturumda tamamlanır?">
        <span style="font-size:9px;color:var(--muted);font-family:'DM Mono',monospace" title="Oturum sayısı">otr</span>
        <select class="dl-select" id="td-${wi}-${ci}-${ti}" title="Deadline — son teslim günü (yoksa Serbest)">
          <option value="" ${task.deadline==null?'selected':''}>Serbest</option>
          ${DAYS_SHORT.map((d,di)=>`<option value="${di}" ${task.deadline===di?'selected':''}>⏰ ${d}</option>`).join('')}
        </select>
        <button class="btn-icon danger" onclick="removeTask(${wi},${ci},${ti})">✕</button>
      </div>`).join('')}
    <div class="add-task-row">
      <span style="font-size:15px;color:var(--muted)">＋</span>
      <input class="add-task-in" id="nt-${wi}-${ci}" placeholder="Yeni görev ekle..." onkeydown="if(event.key==='Enter')addTask(${wi},${ci})">
      <input type="number" class="small-num" id="np-${wi}-${ci}" value="2" min="1" max="20" title="Puan">

function getPtsTotal(wi) {
  return getCats(wi).reduce((_,__,ci)=>{
    const el=document.getElementById(`ct-${wi}-${ci}`);
    return _+(el?parseInt(el.value)||0:getCats(wi)[ci].target);
  },0);
}

function updatePtsWarn(wi) {
  const total=getPtsTotal(wi);
  document.querySelectorAll('.pts-warn').forEach(el=>{
    el.className='pts-warn '+(total===35?'warn-ok':'warn-bad');
    el.textContent=total===35?`✅ Toplam hedef: ${total} / 35`:`⚠️ Toplam hedef: ${total} / 35 — 35 önerilir`;
  });
}

function showSettings(wi) {
  const cats=getCats(wi), tgt=weekTarget(wi);
  const warnC=tgt===35?'warn-ok':'warn-bad';
  const warnT=tgt===35?`✅ Toplam hedef: ${tgt} / 35`:`⚠️ Toplam hedef: ${tgt} / 35 — 35 önerilir`;
  document.getElementById('app').innerHTML=`
    <div class="settings-wrap">
      <div class="settings-info">
        <strong>⚙️ ${WEEKS[wi].label} · ${WEEKS[wi].dateLabel}</strong> haftasına özel görev düzenleyici.<br>
        Değişiklikler yalnızca bu haftayı etkiler. Diğer haftalar korunur.
      </div>
      <div class="copy-notice">💡 Bir sonraki haftaya geçip "Önceki Haftadan Kopyala" diyerek bu listeyi aktarabilirsin.</div>
      <div class="pts-warn ${warnC}">${warnT}</div>
      <div id="se-cats">${cats.map((c,ci)=>buildCatEditor(wi,c,ci)).join('')}</div>
      <button class="add-cat-btn" onclick="addCat(${wi})">＋ Yeni Kategori Ekle</button>
      <div class="settings-actions">
        <button class="btn-danger-out" onclick="resetWeek(${wi})">🗑 Bu Haftayı Sıfırla</button>
        <button class="btn-secondary" onclick="renderWeek(${wi})">İptal</button>
        <button class="btn-primary" onclick="saveSettings(${wi})">💾 Kaydet & Uygula</button>
      </div>
    </div>`;
}

function addTask(wi,ci) {
  const inp=document.getElementById(`nt-${wi}-${ci}`);
  const ptsEl=document.getElementById(`np-${wi}-${ci}`);
  const sessEl=document.getElementById(`ns-${wi}-${ci}`);
  const dlEl=document.getElementById(`nd-${wi}-${ci}`);
  const name=inp.value.trim(); if(!name)return;
  const pts=parseInt(ptsEl.value)||2;
  const sessions=Math.min(7,Math.max(1,parseInt(sessEl?.value)||1));
  const deadline = dlEl && dlEl.value!=='' ? parseInt(dlEl.value) : null;
  getCats(wi)[ci].tasks.push({name,pts,sessions,deadline});
  rerenderCatEd(wi,ci);
  setTimeout(()=>{ const el=document.getElementById(`nt-${wi}-${ci}`); if(el){el.value='';el.focus();} },30);
}

function removeTask(wi,ci,ti) {
  getCats(wi)[ci].tasks.splice(ti,1);
  rerenderCatEd(wi,ci);
}

function removeCat(wi,ci) {
  if(!confirm(`"${getCats(wi)[ci].name}" silinecek. Emin misin?`)) return;
  getCats(wi).splice(ci,1);
  document.getElementById('se-cats').innerHTML=getCats(wi).map((c,i)=>buildCatEditor(wi,c,i)).join('');
  updatePtsWarn(wi);
}

function addCat(wi) {
  const pal=['#ff6b9d','#c77dff','#4cc9f0','#f72585','#06d6a0','#ffbe0b'];
  getCats(wi).push({name:'Yeni Kategori',color:pal[getCats(wi).length%pal.length],target:5,tasks:[{name:'Yeni Görev',pts:5,sessions:1}]});
  document.getElementById('se-cats').innerHTML=getCats(wi).map((c,i)=>buildCatEditor(wi,c,i)).join('');
  updatePtsWarn(wi);
  setTimeout(()=>document.getElementById(`ce-${wi}-${getCats(wi).length-1}`)?.scrollIntoView({behavior:'smooth',block:'center'}),100);
}

function rerenderCatEd(wi,ci) {
  const el=document.getElementById(`ce-${wi}-${ci}`);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=buildCatEditor(wi,getCats(wi)[ci],ci);el.replaceWith(tmp.firstElementChild);}
}

function saveSettings(wi) {
  const cats=getCats(wi);
  cats.forEach((cat,ci)=>{
    const n=document.getElementById(`cn-${wi}-${ci}`);
    const t=document.getElementById(`ct-${wi}-${ci}`);
    const cp=document.getElementById(`cp-${wi}-${ci}`);
    if(n) cat.name=n.value.trim()||cat.name;
    if(t) cat.target=parseInt(t.value)||cat.target;
    if(cp) cat.color=cp.value;
    cat.tasks.forEach((task,ti)=>{
      const tn=document.getElementById(`tn-${wi}-${ci}-${ti}`);
      const tp=document.getElementById(`tp-${wi}-${ci}-${ti}`);
      const ts=document.getElementById(`ts-${wi}-${ci}-${ti}`);
      const td=document.getElementById(`td-${wi}-${ci}-${ti}`);
      if(tn) task.name=tn.value.trim()||task.name;
      if(tp) task.pts=parseInt(tp.value)||task.pts;
      if(ts) task.sessions=Math.min(7,Math.max(1,parseInt(ts.value)||1));
      if(td) task.deadline = td.value!=='' ? parseInt(td.value) : null;
    });
  });
  syncWeekData(wi); save();
  toast('✅ Kaydedildi!');
  setTimeout(()=>renderWeek(wi),600);
}

function resetWeek(wi) {
  if(!confirm(`${WEEKS[wi].label} haftasının tüm verisi silinecek ve varsayılan görevlere dönülecek. Emin misin?`)) return;
  delete weekCats[wi]; delete weekData[wi]; save();
  toast('🔄 Hafta sıfırlandı');
  renderWeek(wi);
}

      <div class="year-grid">
        ${qw.map(w=>{
          const pct=weekPct(w.idx);
          const cls=hasData(w.idx)?(pct>=80?'pct-great':pct>=60?'pct-ok':pct>=40?'pct-mid':'has-data'):'';
          return `<div class="year-cell ${cls}" onclick="jumpToWeek(${w.idx})">

            <div style="font-size:8px;color:var(--muted)">${w.shortLabel}</div>
            ${hasData(w.idx)?`<div class="yc-pct">${manualOf(w.idx)?'✍️ ':''}${calcGrade(weekPct(w.idx)).toFixed(1)}/10</div><div style="font-size:8px;color:var(--muted)">${weekTotal(w.idx)}/${weekTarget(w.idx)}p</div>`:`<div style="font-size:9px;color:var(--border)">—</div>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  return html;
}

function jumpToWeek(wi) {
  const q=WEEKS[wi].quarter;
  const adjustedQ = WEEKS[wi].month<=2?0:WEEKS[wi].month<=5?1:WEEKS[wi].month<=8?2:3;
  currentQ=adjustedQ;
  document.querySelectorAll('.q-tab').forEach((t,i)=>t.classList.toggle('active',i===adjustedQ));
  renderWeekSelector(adjustedQ);
  renderWeek(wi);
}

   CHARTS (year-wide)
══════════════════════════════════════════════════════════ */
let charts={};
function buildChartsPage() {
  return `
    <div class="charts-grid">
      <div class="chart-card" style="grid-column:span 2"><h3>Haftalık Toplam Puan Trendi (Tüm Yıl)</h3><canvas id="cYearLine"></canvas></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Çeyrek Bazlı Ortalama</h3><canvas id="cQBar"></canvas></div>
      <div class="chart-card"><h3>Başarı Oranı Dağılımı</h3><canvas id="cPieDist"></canvas></div>
      <div class="chart-card"><h3>En Aktif Günler</h3><canvas id="cDayBar"></canvas></div>
    </div>`;
}

function initCharts() {
  const grid='rgba(255,255,255,.05)',tick='#6b6b8a',tt={backgroundColor:'#1c1c28',borderColor:'#2a2a3d',borderWidth:1};
  Chart.defaults.color='#9090a0'; Chart.defaults.font.family='Space Grotesk';
  const mk=(id,cfg)=>{if(charts[id])charts[id].destroy();const el=document.getElementById(id);if(el)charts[id]=new Chart(el,cfg);};

  // Year line
  const weeksWithLabels=WEEKS.map(w=>({l:w.shortLabel,v:hasData(w.idx)?calcGrade(weekPct(w.idx)):null,p:weekTotal(w.idx),t:weekTarget(w.idx)}));
  mk('cYearLine',{type:'line',data:{
    labels:weeksWithLabels.map(w=>w.l),
    datasets:[{label:'10 Uzerinden Not',data:weeksWithLabels.map(w=>w.v),borderColor:'#7c83fd',backgroundColor:'rgba(124,131,253,.08)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#7c83fd',tension:0.3,fill:true,spanGaps:false},
      {label:'Hedef (10)',data:WEEKS.map(()=>10),borderColor:'rgba(87,201,122,.25)',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false},
      {label:'Orta Sınır (5)',data:WEEKS.map(()=>5),borderColor:'rgba(250,179,135,.2)',borderWidth:1,borderDash:[3,3],pointRadius:0,fill:false}]
  },options:{responsive:true,plugins:{legend:{labels:{usePointStyle:true,color:'#9090a0',pointStyleWidth:8}},tooltip:tt},
    scales:{y:{min:0,max:10.5,grid:{color:grid},ticks:{color:tick,callback:v=>v+'/10'},border:{display:false}},
      x:{grid:{display:false},ticks:{color:tick,maxTicksLimit:12,font:{size:9}},border:{display:false}}}}});

  // Quarter averages
  const qAvgs=Q_WEEKS.map(qw=>{
    const filled=qw.filter(w=>hasData(w.idx));
    return filled.length?(filled.reduce((s,w)=>s+calcGrade(weekPct(w.idx)),0)/filled.length).toFixed(1):0;
  });
  mk('cQBar',{type:'bar',data:{labels:['Q1 Şub-Mar','Q2 Nis-Haz','Q3 Tem-Eyl','Q4 Eki-Ara'],datasets:[{label:'Ort. Puan',data:qAvgs,
    backgroundColor:['rgba(124,131,253,.75)','rgba(87,201,122,.75)','rgba(250,179,135,.75)','rgba(203,166,247,.75)'],borderRadius:8,borderSkipped:false}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:tt},
      scales:{y:{min:0,max:10,grid:{color:grid},ticks:{color:tick,callback:v=>v+'/10'},border:{display:false}},x:{grid:{display:false},ticks:{color:tick},border:{display:false}}}}});

  // Success distribution
  const grades=WEEKS.filter(w=>hasData(w.idx)).map(w=>calcGrade(weekPct(w.idx)));
  const dist=[grades.filter(g=>g>=9).length,grades.filter(g=>g>=7&&g<9).length,grades.filter(g=>g>=5&&g<7).length,grades.filter(g=>g<5).length];
  mk('cPieDist',{type:'doughnut',data:{labels:['🏆 Mükemel (9-10/10)','✅ İyi (7-8.9/10)','⚠️ Orta (5-6.9/10)','❌ Geliştir (<5/10)'],datasets:[{data:dist,
    backgroundColor:['rgba(87,201,122,.8)','rgba(124,131,253,.8)','rgba(250,179,135,.8)','rgba(243,139,168,.8)'],borderColor:['#57c97a','#7c83fd','#fab387','#f38ba8'],borderWidth:2,hoverOffset:8}]},
    options:{responsive:true,cutout:'58%',plugins:{legend:{position:'bottom',labels:{color:'#9090a0',usePointStyle:true,padding:10,font:{size:10}}},tooltip:tt}}});

  // Day activity
  const dayTotals=Array(7).fill(0);
  WEEKS.forEach(w=>{
    const cats=getCats(w.idx),data=getData(w.idx);
    cats.forEach((cat,ci)=>cat.tasks.forEach((_,ti)=>DAYS_SHORT.forEach((_,di)=>{dayTotals[di]+=(data[ci]?.[ti]?.[di]||0);})));
  });
  mk('cDayBar',{type:'bar',data:{labels:DAYS_SHORT,datasets:[{label:'Tamamlanan',data:dayTotals,
    backgroundColor:'rgba(124,131,253,.7)',borderRadius:8,borderSkipped:false}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:tt},
      scales:{y:{min:0,grid:{color:grid},ticks:{color:tick},border:{display:false}},x:{grid:{display:false},ticks:{color:tick},border:{display:false}}}}});
}

/* ══════════════════════════════════════════════════════════
   WEEK SELECTOR
══════════════════════════════════════════════════════════ */
let currentQ=0;

function renderWeekSelector(q) {
  const wrap=document.getElementById('week-selector-wrap');
  if(q>=4){wrap.innerHTML='';return;}
  const qw=Q_WEEKS[q];
  wrap.innerHTML=`
    <div class="week-selector-label">Hafta seçin · Q${q+1} ${Q_LABELS[q]}</div>
    <div class="week-grid" id="wgrid">
      ${qw.map(w=>{
        const pct=weekPct(w.idx);
        const pctTxt=hasData(w.idx)?`<span class="wpct">${weekTotal(w.idx)}p</span>`:'';
        return `<button class="week-btn ${w.idx===currentWI?'active':''}" id="wbtn-${w.idx}" onclick="renderWeek(${w.idx})">
          ${w.label}
          <span class="wdate">${w.shortLabel}</span>
          ${pctTxt}
        </button>`;
      }).join('')}
    </div>`;
}

function updateWeekBtns() {
  WEEKS.forEach(w=>{
    const btn=document.getElementById(`wbtn-${w.idx}`);
    if(btn){
      const pctEl=btn.querySelector('.wpct');
      const pctTxt=hasData(w.idx)?`${manualOf(w.idx)?'✍️':''}${calcGrade(weekPct(w.idx)).toFixed(1)}/10`:'';
      if(pctEl) pctEl.textContent=pctTxt;
      else if(pctTxt){const s=document.createElement('span');s.className='wpct';s.textContent=pctTxt;btn.appendChild(s);}
    }
  });
  updateHeroStats();
}

function renderWeek(wi) {
  currentWI=wi;
  // update active btn
  document.querySelectorAll('.week-btn').forEach(b=>b.classList.remove('active'));
  const activebtn=document.getElementById(`wbtn-${wi}`);
  if(activebtn) activebtn.classList.add('active');
  document.getElementById('app').innerHTML=buildWeekPage(wi);
}

/* ══════════════════════════════════════════════════════════
   QUARTER ROUTER
══════════════════════════════════════════════════════════ */
function showQ(q,tabEl) {
  currentQ=q;
  document.querySelectorAll('.q-tab').forEach(t=>t.classList.remove('active'));
  if(tabEl) tabEl.classList.add('active');
  const app=document.getElementById('app');
  if(q===4){
    document.getElementById('week-selector-wrap').innerHTML='';
    app.innerHTML=buildYearOverview();
  } else if(q===5){
    document.getElementById('week-selector-wrap').innerHTML='';
    app.innerHTML=buildChartsPage();
    setTimeout(initCharts,60);
  } else {
    const qw=Q_WEEKS[q];
    renderWeekSelector(q);
    // Select first week of quarter or current if in this quarter
    const wi = qw.find(w=>w.idx===currentWI) ? currentWI : qw[0]?.idx ?? 0;
    renderWeek(wi);
  }
  updateHeroStats();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

/* ══════════════════════════════════════════════════════════
   EXPORT / IMPORT / RESET
══════════════════════════════════════════════════════════ */
function exportData() {
  const payload = {
    version: 3,
    exportedAt: new Date().toISOString(),
    weekCats: weekCats,
    weekData: weekData,
    weekPlan: weekPlan,
    monthNotes: monthNotes,
    monthTasks: monthTasks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toLocaleDateString('tr-TR').replace(/\./g,'-');
  a.href = url;
  a.download = 'haftalik-performans-' + dateStr + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ Yedek dosyası indirildi!');
}

function showImport() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'import-modal';
  overlay.innerHTML = `
    <div class="modal-box">
      <h2>⬆️ Yedek Yükle</h2>
      <p>Daha önce indirdiğin <strong>.json</strong> yedek dosyasını seç ya da içeriğini yapıştır.<br>
      <span style="color:#f38ba8;font-size:12px">⚠️ Mevcut veriler silinecek, yerine yedekteki veriler yüklenecek.</span></p>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="loadImportFile(this)">
      <div style="margin-bottom:12px;">
        <button class="btn-export blue" style="width:100%;justify-content:center" onclick="document.getElementById('import-file').click()">
          📂 Dosya Seç (.json)
        </button>
      </div>
      <textarea class="modal-textarea" id="import-text" placeholder="Ya da JSON içeriğini buraya yapıştır..."></textarea>
      <div class="modal-actions">
        <button class="btn-export red" onclick="document.getElementById('import-modal').remove()">İptal</button>
        <button class="btn-export green" onclick="importData()">✅ Yükle</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
}

function loadImportFile(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('import-text').value = e.target.result;
    toast('📂 Dosya yüklendi — "Yükle" butonuna bas');
  };
  reader.readAsText(file);
}

function importData() {
  const text = document.getElementById('import-text').value.trim();
  if(!text) { toast('⚠️ Önce dosya seç veya JSON yapıştır'); return; }
  try {
    const payload = JSON.parse(text);
    if(!payload.weekCats && !payload.weekData) throw new Error('Gecersiz format');
    if(!confirm('Mevcut tüm veriler silinip yedekteki veriler yüklenecek. Emin misin?')) return;
    weekCats = payload.weekCats || {};
    weekData = payload.weekData || {};
    // Eski (v1) yedeklerde plan ve ay notları yok: mevcutları silme
    if(payload.weekPlan) weekPlan = payload.weekPlan;
    if(payload.monthNotes) monthNotes = payload.monthNotes;
    if(payload.monthTasks) monthTasks = payload.monthTasks;
    save(); savePlan(); saveMonth(); saveMonthTasks();
    document.getElementById('import-modal').remove();
    toast('✅ Veriler basariyla yuklendi!');
    renderWeekSelector(currentQ);
    renderWeek(currentWI);
    updateHeroStats();
    updateWeekBtns();
  } catch(e) {
    toast('❌ Hatali dosya — gecerli bir yedek sec');
  }
}

function resetAllData() {
  if(!confirm('Tüm haftalara ait veriler, özel görev listeleri, aylık görevler, günlük planlar ve ay notları silinecek.\nBu işlem geri alınamaz. Emin misin?')) return;
  weekCats = {}; weekData = {}; weekPlan = {}; monthNotes = {}; monthTasks = {};
  save(); savePlan(); saveMonth(); saveMonthTasks();
  toast('🔄 Tüm veriler sıfırlandı');
  renderWeekSelector(currentQ);
  renderWeek(currentWI);
  updateHeroStats();
  updateWeekBtns();
}

/* ══════════════════════════════════════════════════════════
   HAFTA ALT SAYFALARI — Görevler & Odak · Aylık Görevler · Günlük Plan · Ay Notları
══════════════════════════════════════════════════════════ */
let weekView = 'tasks';   // tasks | mtasks | days | month

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Görevlerin kalıcı bir id'si yok; kategori + görev adı, düzenlemelere karşı indeksten daha dayanıklı
function taskKey(cat, task) { return cat.name + '::' + task.name; }

function getPlan(wi) {
  if (!weekPlan[wi]) weekPlan[wi] = {matrix:{}, days:[]};
  const p = weekPlan[wi];
  if (!p.matrix) p.matrix = {};
  if (!Array.isArray(p.rocks)) p.rocks = [];
  if (!Array.isArray(p.days)) p.days = [];
  for (let i = 0; i < 7; i++) if (!p.days[i]) p.days[i] = {items:[], note:''};
  return p;
}

function weekTasks(wi) {
  const cats = getCats(wi), data = getData(wi), out = [];
  cats.forEach((cat, ci) => cat.tasks.forEach((task, ti) => {
    const done = (data[ci]?.[ti] || []).reduce((a, b) => a + (b || 0), 0) >= (task.sessions || 1);
    out.push({
      key: taskKey(cat, task), name: task.name, cat: cat.name, color: cat.color,
      deadline: (task.deadline === 0 || task.deadline) ? task.deadline : null, done,
    });
  }));
  return out;
}

// Bir hafta, pazartesisinin düştüğü ayın ilk/son haftası mı?
function monthRole(wi) {
  const w = WEEKS[wi], m = w.month, y = w.mon.getFullYear();
  const same = WEEKS.filter(x => x.month === m && x.mon.getFullYear() === y);
  return {
    first: same[0]?.idx === wi,
    last: same[same.length - 1]?.idx === wi,
    key: `${y}-${String(m + 1).padStart(2, '0')}`,
    month: m, year: y,
  };
}

function setWeekView(v) {
  weekView = v;
  qpClose();
  rerenderView();
  const app = document.getElementById('app');
  const top = app.getBoundingClientRect().top + window.scrollY - 10;
  if (window.scrollY > top) window.scrollTo({top, behavior:'smooth'});
}

function rerenderView() { document.getElementById('app').innerHTML = buildWeekPage(currentWI); }

function buildSubNav(wi) {
  const r = monthRole(wi), mn = MONTHS_TR[r.month];
  const btn = (v, label, extra = '') =>
    `<button class="wsn-btn ${extra} ${weekView === v ? 'active' : ''}" onclick="setWeekView('${v}')">${label}</button>`;
  let monthBtn = '';
  if (r.first && r.last) monthBtn = btn('month', `🌱 ${mn} Hedef & Değerlendirme`, 'month');
  else if (r.first)      monthBtn = btn('month', `🌱 ${mn} Hedefleri`, 'month');
  else if (r.last)       monthBtn = btn('month', `🔍 ${mn} Değerlendirmesi`, 'month');
  return `<div class="week-subnav">
    ${btn('tasks', '📋 Görevler & Odak')}${btn('mtasks', `🗓 ${mn} Görevleri`)}${btn('days', '📅 Günlük Plan')}${monthBtn}
  </div>`;
}

/* ── ODAK: Bu haftanın 3 taşı (Covey "büyük taşlar" + Keller "tek şey") ── */
const ROCK_MAX = 3;
function rockTasks(wi) {
  const map = Object.fromEntries(weekTasks(wi).map(t => [t.key, t]));
  return getPlan(wi).rocks.map(k => map[k]).filter(Boolean);
}
function buildRocks(wi) {
  const rs = rockTasks(wi), done = rs.filter(t => t.done).length;
  const slots = [];
  for (let i = 0; i < ROCK_MAX; i++) {
    const t = rs[i];
    slots.push(t
      ? `<div class="rk-slot ${t.done ? 'done' : ''}"><span class="rk-n">${t.done ? '✓' : i + 1}</span>
           <span class="rk-name">${esc(t.name)}<span class="rk-cat">${esc(t.cat)}</span></span>
           <button class="rk-x" title="Taşlardan çıkar" data-key="${esc(t.key)}" onclick="rkToggle(this.dataset.key)">×</button></div>`
      : `<div class="rk-slot empty">＋ Görev satırındaki 🎯 ile seç</div>`);
  }
  return `<div class="rk">
    <div class="rk-head"><span class="rk-title">🎯 Bu Haftanın 3 Taşı</span>
      <span class="rk-count">${rs.length ? `${done}/${rs.length} tamamlandı` : ''}</span></div>
    <div class="rk-q">"Cuma akşamı sadece 3 iş bitmiş olsa — hangi 3'ü bitince <b>'iyi bir hafta geçirdim'</b> derim?"</div>
    <div class="rk-slots">${slots.join('')}</div>
    <div class="rk-foot">Sıra önemli: 1 bitmeden 2'ye geçme. En fazla ${ROCK_MAX} — yenisi için önce birini çıkar.</div>
  </div>`;
}
function rkToggle(key) {
  const p = getPlan(currentWI), i = p.rocks.indexOf(key);
  if (i >= 0) p.rocks.splice(i, 1);
  else {
    if (p.rocks.length >= ROCK_MAX) { toast(`🎯 En fazla ${ROCK_MAX} taş — önce birini çıkar`); return; }
    p.rocks.push(key);
  }
  savePlan();
  rerenderView();
}

let qpKey = null;   // öncelik menüsü açık olan görevin anahtarı
function qpClose() {
  document.getElementById('qp-menu')?.remove();
  qpKey = null;
}
document.addEventListener('click', qpClose);
window.addEventListener('resize', qpClose);

/* ── AYLIK GÖREVLER (puansız, ayın tüm haftalarında aynı) ── */
function getMonthTasks(key) {
  if (!Array.isArray(monthTasks[key])) monthTasks[key] = [];
  return monthTasks[key];
}
function monthKeyOf(y, m) {
  const d = new Date(y, m, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function buildMonthTasksView(wi) {
  const r = monthRole(wi), mn = MONTHS_TR[r.month], list = monthTasks[r.key] || [];
  const doneN = list.filter(i => i.done).length;
  const pct = list.length ? Math.round(doneN / list.length * 100) : 0;
  const pm = new Date(r.year, r.month - 1, 1), pk = monthKeyOf(r.year, r.month - 1);
  const carry = (monthTasks[pk] || []).filter(i => !i.done && !list.some(x => x.text === i.text));

  const rows = list.map(it => {
    const inWeek = mtWeekTask(wi, it);
    return `<div class="mt-item ${it.done ? 'done' : ''}">
      <input type="checkbox" ${it.done ? 'checked' : ''} onchange="mtToggle('${r.key}','${it.id}',this.checked)">
      <input class="mt-text" value="${esc(it.text)}" oninput="mtEdit('${r.key}','${it.id}',this.value)">
      <span class="mt-actions">
        ${inWeek
          ? `<span class="mt-inweek" title="${esc(inWeek.cat)} kategorisinde">📌 Bu haftada</span>`
          : (it.done ? '' : `<button class="mt-toweek" onclick="mtWeekOpen(event,'${r.key}','${it.id}')">＋ Haftaya ekle</button>`)}
        <button class="btn-icon danger" title="Sil" onclick="mtDel('${r.key}','${it.id}')">×</button>
      </span>
    </div>`;
  }).join('');

  return `<div class="mt-wrap">
    <div class="sub-intro">
      <b>${mn} Görevleri</b> — Bu ay yapılacak işlerin listesi. Ayın bütün haftalarında aynı liste görünür; puan vermez.
      <span class="sub-hint">"＋ Haftaya ekle" ile görevi bu haftanın puanlı görevlerine taşı; haftada tamamlandığında bu listeden otomatik çıkar.</span>
    </div>
    ${carry.length ? `<div class="mt-carry">
      <span>${MONTHS_TR[pm.getMonth()]} listesinden tamamlanmayan <b>${carry.length}</b> görev var.</span>
      <button class="btn-add" onclick="mtCarry('${r.key}','${pk}')">Bu aya aktar</button>
    </div>` : ''}
    <div class="mt-card">
      <div class="mt-head"><h3>🗓 ${mn} ${r.year}</h3><span class="mt-count">${list.length ? `${doneN}/${list.length} tamamlandı` : ''}</span></div>
      ${list.length ? `<div class="mt-bar"><div style="width:${pct}%"></div></div>` : ''}
      <div class="mt-items">${rows || '<div class="mt-empty">Bu ay için henüz görev yok. Aşağıdan ekle.</div>'}</div>
      <div class="mt-add">
        <input class="mt-text" id="mta" placeholder="+ Görev ekle, Enter'a bas" onkeydown="if(event.key==='Enter')mtAdd('${r.key}')">
        <button class="btn-add" onclick="mtAdd('${r.key}')">Ekle</button>
      </div>
    </div>
  </div>`;
}

function mtFind(key, id) { return getMonthTasks(key).find(i => i.id === id); }
function mtNorm(t) { return String(t || '').trim().toLocaleLowerCase('tr'); }
// Aylık görev bu haftanın puanlı görevlerinde var mı? (bağlantıyla ya da aynı isimle)
function mtWeekTask(wi, it) {
  for (const cat of getCats(wi)) for (const task of cat.tasks)
    if (task.mt === it.id || mtNorm(task.name) === mtNorm(it.text)) return {cat:cat.name, task};
  return null;
}

// Haftalık görev tamamlanınca aylık listeden çıkar; tamamlanma geri alınırsa geri koy
function mtSyncFromWeek(wi, ci, ti, wasDone) {
  const task = getCats(wi)[ci]?.tasks[ti];
  if (!task) return;
  const nowDone = taskDoneCount(wi, ci, ti) >= (task.sessions || 1);
  if (nowDone === wasDone) return;
  const key = monthRole(wi).key, list = getMonthTasks(key);
  if (nowDone) {
    const i = list.findIndex(x => (task.mt && x.id === task.mt) || mtNorm(x.text) === mtNorm(task.name));
    if (i < 0) return;
    const it = list.splice(i, 1)[0];
    task.mt = it.id; task.mtText = it.text; task.mtMonth = key;
    save(); saveMonthTasks();
    toast(`🗓 "${it.text}" tamamlandı, aylık listeden çıkarıldı`);
  } else if (task.mt && task.mtMonth === key && !list.some(x => x.id === task.mt)) {
    list.push({id:task.mt, text:task.mtText || task.name, done:false});
    saveMonthTasks();
    toast(`↩️ "${task.mtText || task.name}" aylık listeye geri eklendi`);
  }
}

// "Haftaya ekle": kategori seçme menüsü
function mtWeekOpen(e, key, id) {
  e.stopPropagation();
  qpClose();
  const cats = getCats(currentWI);
  const m = document.createElement('div');
  m.className = 'qp-menu'; m.id = 'qp-menu';
  m.innerHTML = '<div class="qp-title">Hangi kategoriye? (2 puan)</div>' + cats.map((c, ci) =>
    `<button onclick="mtToWeek('${key}','${id}',${ci})"><span class="cat-dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('');
  m.addEventListener('click', ev => ev.stopPropagation());
  document.body.appendChild(m);
  const r = e.currentTarget.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.right + window.scrollX - m.offsetWidth, window.scrollX + document.documentElement.clientWidth - m.offsetWidth - 8));
  let top = r.bottom + window.scrollY + 4;
  if (r.bottom + m.offsetHeight + 8 > window.innerHeight) top = r.top + window.scrollY - m.offsetHeight - 4;
  m.style.left = left + 'px'; m.style.top = top + 'px';
}
function mtToWeek(key, id, ci) {
  qpClose();
  const it = mtFind(key, id), cat = getCats(currentWI)[ci];
  if (!it || !cat) return;
  cat.tasks.push({name:it.text, pts:2, sessions:1, deadline:null, mt:it.id, mtText:it.text, mtMonth:key});
  syncWeekData(currentWI); save();
  toast(`✅ "${it.text}" → ${cat.name} (2p). Puanı ⚙️ Bu Haftayı Düzenle'den değiştirebilirsin`);
  rerenderView();
}
function mtAdd(key) {
  const inp = document.getElementById('mta'), text = inp.value.trim();
  if (!text) { inp.focus(); return; }
  getMonthTasks(key).push({id:newId(), text, done:false});
  saveMonthTasks();
  rerenderView();
  document.getElementById('mta')?.focus();
}
function mtToggle(key, id, val) {
  const it = mtFind(key, id); if (!it) return;
  it.done = val;
  saveMonthTasks();
  rerenderView();
}
function mtEdit(key, id, val) {
  const it = mtFind(key, id); if (!it) return;
  it.text = val;
  saveMonthTasks();
}
function mtDel(key, id) {
  monthTasks[key] = getMonthTasks(key).filter(i => i.id !== id);
  saveMonthTasks();
  rerenderView();
}
function mtCarry(key, fromKey) {
  const list = getMonthTasks(key);
  (monthTasks[fromKey] || []).filter(i => !i.done && !list.some(x => x.text === i.text))
    .forEach(i => list.push({id:newId(), text:i.text, done:false}));
  saveMonthTasks();
  toast('✅ Tamamlanmayan görevler bu aya aktarıldı');
  rerenderView();
}

/* ── GÜNLÜK PLAN (Ivy Lee: sıralı liste · Brian Tracy: günün kurbağası) ── */
const DAY_MAX = 6;
// Kurbağa en üstte, kalanlar kullanıcının verdiği sırada (dizi sırası)
function orderedItems(day) {
  const f = day.items.find(i => i.id === day.frog);
  return f ? [f, ...day.items.filter(i => i !== f)] : [...day.items];
}

function buildDaysView(wi) {
  const plan = getPlan(wi), tasks = weekTasks(wi);
  const tmap = Object.fromEntries(tasks.map(t => [t.key, t]));
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);

  // "Görev listesinden ekle": haftanın taşları en üstte
  const order = t => { const i = plan.rocks.indexOf(t.key); return i < 0 ? 9 : i; };
  const wOpts = [...tasks].sort((a, b) => order(a) - order(b)).map(t => {
    const rk = plan.rocks.includes(t.key);
    return `<option value="${esc(t.key)}">${rk ? '🎯 ' : ''}${esc(t.name)} · ${esc(t.cat)}${t.done ? ' ✓' : ''}</option>`;
  }).join('');
  const mOpen = (monthTasks[monthRole(wi).key] || []).filter(i => !i.done);
  const opts = (wOpts ? `<optgroup label="Haftalık görevler">${wOpts}</optgroup>` : '')
    + (mOpen.length ? `<optgroup label="${MONTHS_TR[monthRole(wi).month]} görevleri">${mOpen.map(i => `<option value="mt::${i.id}">🗓 ${esc(i.text)}</option>`).join('')}</optgroup>` : '');

  const cards = DAYS_SHORT.map((dn, di) => {
    const date = addDays(WEEKS[wi].mon, di); date.setHours(0, 0, 0, 0);
    const isToday = date.getTime() === t0.getTime();
    const day = plan.days[di];
    const doneN = day.items.filter(i => i.done).length;
    const dls = tasks.filter(t => t.deadline === di && !t.done);

    const list = orderedItems(day), frogOn = !!list.length && list[0].id === day.frog;
    const rows = list.map((it, n) => {
      const ref = it.ref ? tmap[it.ref] : null;
      const rk = ref && plan.rocks.includes(it.ref);
      const isFrog = it.id === day.frog;
      const canUp = n > (frogOn ? 1 : 0) && !isFrog, canDn = n < list.length - 1 && !isFrog;
      return `<div class="dp-item ${it.done ? 'done' : ''} ${isFrog ? 'frog' : ''}" ${ref && !isFrog ? `style="box-shadow:inset 3px 0 0 ${ref.color}"` : ''}>
        <span class="dp-n">${isFrog ? '🐸' : n + 1}</span>
        <input type="checkbox" ${it.done ? 'checked' : ''} onchange="dpToggle(${wi},${di},'${it.id}',this.checked)">
        <input type="time" class="dp-time" value="${esc(it.time || '')}" onchange="dpEdit(${wi},${di},'${it.id}','time',this.value,true)">
        <input class="dp-text" value="${esc(it.text)}" oninput="dpEdit(${wi},${di},'${it.id}','text',this.value)">
        <span class="dp-actions">${rk ? '<span class="dp-q" title="Haftanın taşı">🎯</span>' : ''}${it.ref?.startsWith('mt::') ? '<span class="dp-q" title="Aylık görev">🗓</span>' : ''}<button class="dp-fr ${isFrog ? 'on' : ''}" title="${isFrog ? 'Kurbağayı kaldır' : 'Günün kurbağası yap (sabah ilk iş)'}" onclick="dpFrog(${wi},${di},'${it.id}')">🐸</button><button class="dp-mv" title="Yukarı" ${canUp ? '' : 'disabled'} onclick="dpMove(${wi},${di},'${it.id}',-1)">▲</button><button class="dp-mv" title="Aşağı" ${canDn ? '' : 'disabled'} onclick="dpMove(${wi},${di},'${it.id}',1)">▼</button><button class="btn-icon danger" title="Sil" onclick="dpDel(${wi},${di},'${it.id}')">×</button></span>
      </div>`;
    }).join('');

    return `<div class="dp-card ${isToday ? 'today' : ''}">
      <div class="dp-head">
        <div><span class="dp-day">${dn}</span> <span class="dp-date">${fmtDate(date)}</span>${isToday ? ' <span class="dp-today">BUGÜN</span>' : ''}</div>
        <span class="dp-count">${day.items.length ? `${doneN}/${day.items.length}` : ''}</span>
      </div>
      ${dls.length ? `<div class="dp-dl">⏰ Bugün teslim: ${dls.map(t => esc(t.name)).join(', ')}</div>` : ''}
      ${list.length && !day.frog ? '<div class="dp-frog-hint">🐸 Günün kurbağasını seç: en zor / en çok ertelediğin iş, sabah ilk o.</div>' : ''}
      <div class="dp-items">${rows || '<div class="dp-empty">Henüz plan yok</div>'}</div>
      ${day.items.length > DAY_MAX ? `<div class="dp-over">${day.items.length} madde — en önemli ${DAY_MAX} yeter, gerisini başka güne taşı.</div>` : ''}
      <div class="dp-add">
        <input type="time" class="dp-time" id="dpat-${di}" title="Saat (isteğe bağlı)">
        <input class="dp-text" id="dpa-${di}" placeholder="+ Plan ekle, Enter'a bas" onkeydown="if(event.key==='Enter')dpAdd(${wi},${di})">
        <button class="btn-add" onclick="dpAdd(${wi},${di})">Ekle</button>
      </div>
      <select class="dp-from" onchange="if(this.value)dpAddTask(${wi},${di},this.value)">
        <option value="">↳ Görev listesinden ekle…</option>${opts}
      </select>
      <textarea class="dp-note" placeholder="Günün notu…" oninput="dpNote(${wi},${di},this.value)">${esc(day.note)}</textarea>
    </div>`;
  }).join('');

  return `
    <div class="sub-intro">
      <b>Günlük Plan</b> — Her gün için en fazla ${DAY_MAX} işi önem sırasına diz (▲▼) ve 1 tane 🐸 <b>kurbağa</b> seç: sabah ilk onu yap, 1 bitmeden 2'ye geçme.
      <span class="sub-hint">Haftanın taşları 🎯 ile işaretli. Buradaki işaretler puanı değiştirmez; puan için Görevler sekmesini kullan.</span>
    </div>
    <div class="dp-grid">${cards}</div>`;
}

function dpFind(wi, di, id) { return getPlan(wi).days[di].items.find(i => i.id === id); }

function dpAdd(wi, di) {
  const inp = document.getElementById(`dpa-${di}`), tin = document.getElementById(`dpat-${di}`);
  const text = inp.value.trim();
  if (!text) { inp.focus(); return; }
  getPlan(wi).days[di].items.push({id:newId(), text, time:tin.value || '', done:false});
  savePlan();
  rerenderView();
  document.getElementById(`dpa-${di}`)?.focus();
}
function dpAddTask(wi, di, key) {
  const t = key.startsWith('mt::')
    ? (monthTasks[monthRole(wi).key] || []).map(i => ({key:'mt::' + i.id, name:i.text})).find(x => x.key === key)
    : weekTasks(wi).find(x => x.key === key);
  if (!t) return;
  getPlan(wi).days[di].items.push({id:newId(), text:t.name, time:'', done:false, ref:key});
  savePlan();
  rerenderView();
}
function dpToggle(wi, di, id, val) {
  const it = dpFind(wi, di, id); if (!it) return;
  it.done = val;
  savePlan();
  rerenderView();
}
function dpEdit(wi, di, id, field, val, rerender) {
  const it = dpFind(wi, di, id); if (!it) return;
  it[field] = val;
  savePlan();
  if (rerender) rerenderView();
}
function dpFrog(wi, di, id) {
  const d = getPlan(wi).days[di];
  d.frog = d.frog === id ? null : id;
  savePlan();
  rerenderView();
}
function dpMove(wi, di, id, dir) {
  const d = getPlan(wi).days[di];
  const vis = orderedItems(d).filter(i => i.id !== d.frog);   // kurbağa sabit, diğerleri sıralanır
  const k = vis.findIndex(i => i.id === id), j = k + dir;
  if (k < 0 || j < 0 || j >= vis.length) return;
  [vis[k], vis[j]] = [vis[j], vis[k]];
  const f = d.items.find(i => i.id === d.frog);
  d.items = f ? [f, ...vis] : vis;
  savePlan();
  rerenderView();
}
function dpDel(wi, di, id) {
  const d = getPlan(wi).days[di];
  if (d.frog === id) d.frog = null;
  d.items = d.items.filter(i => i.id !== id);
  savePlan();
  rerenderView();
}
function dpNote(wi, di, val) { getPlan(wi).days[di].note = val; savePlan(); }

/* ── AY HEDEFLERİ / AY DEĞERLENDİRMESİ ── */
function getMonthNote(key) {
  if (!monthNotes[key]) monthNotes[key] = {goal:'', review:''};
  return monthNotes[key];
}
function moEdit(key, field, val) { getMonthNote(key)[field] = val; saveMonth(); }

function monthStats(m, y) {
  const ws = WEEKS.filter(w => w.month === m && w.mon.getFullYear() === y && hasData(w.idx));
  if (!ws.length) return null;
  const avg = ws.reduce((s, w) => s + calcGrade(weekPct(w.idx)), 0) / ws.length;
  const best = ws.reduce((b, w) => weekPct(w.idx) > weekPct(b.idx) ? w : b);
  let rkAll = 0, rkDone = 0;
  WEEKS.filter(w => w.month === m && w.mon.getFullYear() === y).forEach(w => {
    const rs = weekPlan[w.idx]?.rocks ? rockTasks(w.idx) : [];
    rkAll += rs.length; rkDone += rs.filter(t => t.done).length;
  });
  return {count:ws.length, avg:avg.toFixed(1), best:`${best.label} · ${calcGrade(weekPct(best.idx)).toFixed(1)}/10`, rocks: rkAll ? `${rkDone}/${rkAll}` : null};
}

function buildMonthView(wi) {
  const r = monthRole(wi), mn = MONTHS_TR[r.month], note = getMonthNote(r.key);
  const prevDate = new Date(r.year, r.month - 1, 1);
  const prevKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
  const prevReview = monthNotes[prevKey]?.review?.trim();
  let html = '<div class="mo-wrap">';

  if (r.first) {
    if (prevReview) html += `<div class="mo-card mo-ref">
      <h3>🔍 ${MONTHS_TR[prevDate.getMonth()]} değerlendirmen</h3>
      <div class="mo-ref-text">${esc(prevReview)}</div>
    </div>`;
    html += `<div class="mo-card">
      <h3>🌱 ${mn} ${r.year} — Bu aydan ne bekliyorum?</h3>
      <ul class="mo-prompts">
        <li>Bu aydan ne bekliyorum?</li>
        <li>Bu ay mutlaka yapmam gereken 3 şey ne?</li>
        <li>Neye "hayır" diyeceğim, neyi bırakacağım?</li>
        <li>Ay sonunda neyi görürsem "iyi geçti" diyeceğim?</li>
      </ul>
      <textarea class="mo-text" placeholder="Yazmaya başla…" oninput="moEdit('${r.key}','goal',this.value)">${esc(note.goal)}</textarea>
      <div class="mo-saved">Yazdıkların otomatik kaydedilir.</div>
    </div>`;
  }

  if (r.last) {
    const st = monthStats(r.month, r.year);
    if (!r.first && note.goal.trim()) html += `<div class="mo-card mo-ref">
      <h3>🌱 Ay başında hedeflediklerin</h3>
      <div class="mo-ref-text">${esc(note.goal)}</div>
    </div>`;
    html += `<div class="mo-card">
      <h3>🔍 ${mn} ${r.year} — Bu ay nasıl geçti?</h3>
      ${st ? `<div class="mo-stats">
        <span>Veri girilen hafta: <b>${st.count}</b></span>
        <span>Ay not ortalaması: <b>${st.avg}/10</b></span>
        <span>En iyi hafta: <b>${st.best}</b></span>
        ${st.rocks ? `<span>Tamamlanan taş: <b>${st.rocks}</b></span>` : ''}
      </div>` : ''}
      <ul class="mo-prompts">
        <li>Bu ay genel olarak nasıl geçti?</li>
        <li>Nelerde iyiydim, neyi sürdürmeliyim?</li>
        <li>Neleri daha iyi yapabilirdim?</li>
        <li>Gelecek aya neyi taşıyorum?</li>
      </ul>
      <textarea class="mo-text" placeholder="Yazmaya başla…" oninput="moEdit('${r.key}','review',this.value)">${esc(note.review)}</textarea>
      <div class="mo-saved">Yazdıkların otomatik kaydedilir.</div>
    </div>`;
  }

  return html + '</div>';
}

renderWeekSelector(0);

updateHeroStats();
