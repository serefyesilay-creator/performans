<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-title" content="Performans">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Haftalık Takip</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Apple Store dili: açık gri zemin, beyaz kartlar, mavi vurgu. --white = vurgulu metin (koyu) */
  --bg:#f5f5f7;--surface:#f5f5f7;--card:#ffffff;--border:#d2d2d7;--hair:#e8e8ed;
  --text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--white:#1d1d1f;--on-accent:#ffffff;
  --green:#1f8a3c;--red:#d70015;--orange:#b64400;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;
  --shadow:2px 4px 12px rgba(0,0,0,.08);--shadow-hover:2px 4px 16px rgba(0,0,0,.16);
  --r-card:18px;color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding-bottom:80px;}

/* HERO */
.hero{background:linear-gradient(135deg,#0f0f17,#1a1a2e,#16213e);border-bottom:1px solid var(--border);padding:30px 24px 24px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(0,113,227,.15),transparent 70%);pointer-events:none;}
.hero-badge{display:inline-block;background:rgba(0,113,227,.12);border:1px solid rgba(0,113,227,.3);color:var(--accent);font-family:var(--font);font-size:11px;letter-spacing:2px;padding:4px 14px;border-radius:20px;margin-bottom:12px;}
.hero h1{font-size:clamp(18px,4vw,32px);font-weight:700;color:var(--white);margin-bottom:4px;}
.hero h1 span{color:var(--accent);}
.hero p{color:var(--muted);font-size:13px;}
.hero-stats{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap;}
.hero-stat{background:rgba(0,0,0,.04);border:1px solid var(--border);border-radius:20px;padding:5px 16px;font-size:12px;color:var(--muted);}
.hero-stat strong{color:var(--accent);font-weight:700;}

/* QUARTER TABS */
.q-tabs{display:flex;justify-content:center;gap:8px;padding:18px 16px 0;flex-wrap:wrap;}
.q-tab{padding:8px 22px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.q-tab:hover{border-color:var(--accent);color:var(--text);}
.q-tab.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}

/* WEEK SELECTOR */
.week-selector-wrap{max-width:1100px;margin:0 auto;padding:18px 16px 0;}
.week-selector-label{font-family:var(--font);font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
.week-btn{padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--font);font-size:10px;cursor:pointer;transition:all .2s;text-align:center;line-height:1.4;}
.week-btn:hover{border-color:var(--accent);color:var(--text);}
.week-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
.week-btn .wdate{font-size:9px;opacity:.7;display:block;margin-top:2px;}
.week-btn .wpct{font-size:10px;color:var(--green);display:block;margin-top:2px;}
.week-btn.active .wpct{color:rgba(255,255,255,.85);}

/* MAIN */
.container{max-width:1100px;margin:0 auto;padding:20px 16px;}

/* WEEK HEADER */
.week-header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.week-title{font-size:18px;font-weight:700;color:var(--white);}
.week-title span{color:var(--accent);}
.week-date{font-family:var(--font);font-size:11px;color:var(--muted);margin-top:2px;}
.btn-copy{background:rgba(0,113,227,.12);border:1px solid rgba(0,113,227,.3);color:var(--accent);border-radius:8px;padding:7px 16px;font-family:var(--font);font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.btn-copy:hover{background:rgba(0,113,227,.25);}

/* SCORE ROW */
.score-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.score-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;transition:transform .2s;}
.score-card:hover{transform:translateY(-2px);}
.sc-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:var(--font);margin-bottom:7px;}
.sc-val{font-size:28px;font-weight:700;color:var(--white);line-height:1;margin-bottom:3px;}
.sc-sub{font-size:11px;color:var(--muted);}
.score-card.accent{border-color:var(--accent);background:rgba(0,113,227,.08);}
.score-card.accent .sc-val{color:var(--accent);}

/* PROGRESS */
.progress-wrap{margin-bottom:18px;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;}
.progress-bar-bg{height:7px;background:var(--border);border-radius:8px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--accent),#a78bfa);}

/* TASK TABLE */
.task-table{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.cat-header{padding:9px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tgt-badge{margin-left:auto;font-family:var(--font);font-size:11px;padding:2px 8px;border-radius:6px;}
.day-headers{display:grid;align-items:center;padding:6px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.02);gap:6px;}
.dh-span{font-family:var(--font);font-size:9px;letter-spacing:1px;color:var(--muted);text-align:center;width:30px;}
.task-row{display:grid;align-items:center;padding:6px 16px;border-top:1px solid var(--border);gap:6px;transition:background .15s;}
.task-row:hover{background:rgba(0,0,0,.02);}
.task-name{font-size:12px;color:var(--text);}
.gain{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 8px;border-radius:20px;font-family:var(--font);font-size:9.5px;font-weight:600;color:var(--green);background:rgba(31,138,60,.1);border:1px solid rgba(31,138,60,.3);white-space:nowrap;}
.gain .gs{opacity:.7;font-weight:500;}
.gain.got{color:var(--muted);background:transparent;border-color:var(--border);font-weight:500;}
.pts-badge{font-family:var(--font);font-size:10px;padding:2px 5px;border-radius:5px;font-weight:500;min-width:27px;text-align:center;}
.day-input{width:30px;height:29px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;text-align:center;transition:all .15s;cursor:pointer;-moz-appearance:textfield;}
.day-input::-webkit-inner-spin-button,.day-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.day-input:hover{border-color:var(--accent);}
.day-input:focus{outline:none;border-color:var(--accent);background:rgba(0,113,227,.08);}
.day-input.done{background:rgba(31,138,60,.15);border-color:var(--green);color:var(--green);}
.day-input.partial{background:rgba(182,68,0,.12);border-color:var(--orange);color:var(--orange);}
/* ── DEADLINE ── */
.day-input.deadline-cell{box-shadow:0 0 0 2px var(--orange);border-color:var(--orange);}
.day-input.deadline-cell.overdue{box-shadow:0 0 0 2px var(--red);border-color:var(--red);}
.task-row.has-deadline{box-shadow:inset 3px 0 0 var(--orange);}
.task-row.has-deadline.overdue{box-shadow:inset 3px 0 0 var(--red);background:rgba(215,0,21,.05);}
.dl-badge{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:1px 8px;border-radius:20px;font-family:var(--font);font-size:9px;font-weight:600;letter-spacing:.3px;vertical-align:middle;white-space:nowrap;}
.dl-badge.upcoming{background:rgba(182,68,0,.16);color:var(--orange);border:1px solid rgba(182,68,0,.35);}
.dl-badge.today{background:rgba(182,68,0,.28);color:var(--orange);border:1px solid var(--orange);box-shadow:0 0 8px rgba(182,68,0,.3);}
.dl-badge.overdue{background:rgba(215,0,21,.18);color:var(--red);border:1px solid var(--red);animation:dlpulse 1.6s ease-in-out infinite;}
.dl-badge.done{background:rgba(31,138,60,.14);color:var(--green);border:1px solid rgba(31,138,60,.3);}
.free-badge{display:inline-flex;align-items:center;margin-left:8px;padding:1px 8px;border-radius:20px;font-family:var(--font);font-size:9px;color:var(--muted);border:1px dashed var(--border);opacity:.7;vertical-align:middle;white-space:nowrap;}
@keyframes dlpulse{0%,100%{opacity:1}50%{opacity:.5}}
.dl-select{height:29px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);font-size:11px;padding:0 6px;cursor:pointer;}
.dl-select:focus{outline:none;border-color:var(--orange);}
.dl-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:2px 0 16px;padding:9px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:10px;color:var(--muted);font-family:var(--font);}
.dl-legend span{display:inline-flex;align-items:center;gap:6px;}
.lg-chip{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.lg-chip.up{background:var(--orange);}
.lg-chip.od{background:var(--red);}
.lg-chip.fr{border:1px dashed var(--muted);}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
.chart-card h3{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:var(--font);margin-bottom:14px;}
.chart-card canvas{max-height:220px;}

/* SETTINGS */
.settings-wrap{display:flex;flex-direction:column;gap:14px;}
.settings-info{background:rgba(0,113,227,.08);border:1px solid rgba(0,113,227,.25);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.6;}
.settings-info strong{color:var(--accent);}
.copy-notice{background:rgba(31,138,60,.08);border:1px solid rgba(31,138,60,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--green);}

.cat-editor{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2px;}
.cat-ed-header{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.01);}
.color-swatch{width:22px;height:22px;border-radius:6px;flex-shrink:0;cursor:pointer;position:relative;border:2px solid rgba(0,0,0,.15);transition:transform .15s;}
.color-swatch:hover{transform:scale(1.15);}
.cp-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.cat-name-in{flex:1;background:transparent;border:none;font-family:var(--font);font-size:13px;font-weight:600;color:var(--white);outline:none;border-bottom:1px solid transparent;transition:border .15s;}
.cat-name-in:focus{border-bottom-color:var(--accent);}
.tgt-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
.small-num{width:44px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:12px;padding:3px 5px;text-align:center;outline:none;transition:border .15s;-moz-appearance:textfield;}
.small-num::-webkit-inner-spin-button,.small-num::-webkit-outer-spin-button{-webkit-appearance:none;}
.small-num:focus{border-color:var(--accent);}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:3px 6px;border-radius:5px;transition:all .15s;line-height:1;}
.btn-icon:hover{background:rgba(0,0,0,.06);color:var(--text);}
.btn-icon.danger:hover{color:var(--red);background:rgba(215,0,21,.1);}

.task-ed-row{display:flex;align-items:center;gap:7px;padding:7px 14px;border-top:1px solid var(--border);transition:background .15s;}
.task-ed-row:hover{background:rgba(0,0,0,.015);}
.drag-h{color:var(--muted);font-size:12px;cursor:grab;user-select:none;}
.task-name-in{flex:1;background:transparent;border:none;font-family:var(--font);font-size:12px;color:var(--text);outline:none;border-bottom:1px solid transparent;transition:border .15s;padding:2px 0;}
.task-name-in:focus{border-bottom-color:var(--accent);}

.add-task-row{display:flex;align-items:center;gap:7px;padding:9px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,.008);}
.add-task-in{flex:1;background:transparent;border:none;font-family:var(--font);font-size:12px;color:var(--muted);outline:none;transition:color .15s;}
.add-task-in:focus{color:var(--text);}
.add-task-in::placeholder{color:var(--border);}
.btn-add{background:rgba(0,113,227,.12);border:1px solid rgba(0,113,227,.3);color:var(--accent);border-radius:6px;padding:4px 12px;font-family:var(--font);font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-add:hover{background:rgba(0,113,227,.25);}

.add-cat-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:var(--card);border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-family:var(--font);font-size:13px;cursor:pointer;transition:all .2s;}
.add-cat-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,113,227,.05);}

.settings-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;}
.btn-primary{background:var(--accent);border:none;color:var(--on-accent);border-radius:9px;padding:10px 22px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn-primary:hover{opacity:.85;}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 18px;font-family:var(--font);font-size:13px;cursor:pointer;transition:all .15s;}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger-out{background:rgba(215,0,21,.08);border:1px solid rgba(215,0,21,.25);color:var(--red);border-radius:9px;padding:10px 18px;font-family:var(--font);font-size:13px;cursor:pointer;transition:all .15s;}
.btn-danger-out:hover{background:rgba(215,0,21,.15);}

.pts-warn{font-family:var(--font);font-size:11px;padding:9px 14px;border-radius:9px;text-align:center;}
.warn-ok{background:rgba(31,138,60,.1);color:var(--green);border:1px solid rgba(31,138,60,.2);}
.warn-bad{background:rgba(215,0,21,.1);color:var(--red);border:1px solid rgba(215,0,21,.2);}

/* PILL */
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;font-family:var(--font);}
.pill-great{background:rgba(31,138,60,.15);color:var(--green);}
.pill-ok{background:rgba(0,113,227,.15);color:var(--accent);}
.pill-mid{background:rgba(182,68,0,.15);color:var(--orange);}
.pill-low{background:rgba(215,0,21,.15);color:var(--red);}

/* YEAR OVERVIEW */
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px;margin-bottom:20px;}
.year-cell{padding:6px 4px;border-radius:7px;border:1px solid var(--border);background:var(--surface);text-align:center;cursor:pointer;transition:all .2s;font-size:9px;font-family:var(--font);color:var(--muted);}
.year-cell:hover{border-color:var(--accent);}
.year-cell.has-data{background:var(--card);}
.year-cell .yc-pct{font-size:11px;font-weight:700;margin-top:2px;}
.year-cell.pct-great{border-color:rgba(31,138,60,.4);}.year-cell.pct-great .yc-pct{color:var(--green);}
.year-cell.pct-ok{border-color:rgba(0,113,227,.4);}.year-cell.pct-ok .yc-pct{color:var(--accent);}
.year-cell.pct-mid{border-color:rgba(182,68,0,.4);}.year-cell.pct-mid .yc-pct{color:var(--orange);}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--border);border:1px solid var(--accent);color:var(--text);padding:9px 22px;border-radius:28px;font-size:12px;z-index:9999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.data-bar{display:flex;justify-content:center;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.02);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.data-bar-label{font-family:var(--font);font-size:10px;color:var(--muted);letter-spacing:1px;}
.btn-export{display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid;}
.btn-export.green{background:rgba(31,138,60,.1);border-color:rgba(31,138,60,.3);color:var(--green);}
.btn-export.green:hover{background:rgba(31,138,60,.2);}
.btn-export.blue{background:rgba(0,113,227,.1);border-color:rgba(0,113,227,.3);color:var(--accent);}
.btn-export.blue:hover{background:rgba(0,113,227,.2);}
.btn-export.red{background:rgba(215,0,21,.08);border-color:rgba(215,0,21,.25);color:var(--red);}
.btn-export.red:hover{background:rgba(215,0,21,.15);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:500px;width:100%;}
.modal-box h2{font-size:16px;font-weight:700;color:var(--white);margin-bottom:8px;}
.modal-box p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.modal-textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:11px;padding:12px;height:160px;resize:vertical;outline:none;margin-bottom:12px;transition:border .15s;}
.modal-textarea:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}

/* ── HAFTA ALT BAR ── */
.week-subnav{position:sticky;bottom:12px;z-index:50;display:flex;gap:6px;flex-wrap:wrap;margin:22px auto 0;padding:7px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:14px;max-width:820px;box-shadow:0 8px 28px rgba(0,0,0,.4);}
.wsn-btn{flex:1;min-width:120px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.wsn-btn:hover{border-color:var(--accent);color:var(--text);}
.wsn-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.wsn-btn.month{border-color:rgba(31,138,60,.4);color:var(--green);}
.wsn-btn.month.active{background:var(--green);border-color:var(--green);color:#fff;}
.sub-intro{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.sub-intro b{color:var(--white);}
.sub-hint{display:block;font-size:11px;color:var(--accent);margin-top:2px;}

/* ── ÖNCELİK (görev satırı etiketi + matris özeti) ── */
.rk-tag{width:30px;height:24px;border-radius:7px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;line-height:1;cursor:pointer;padding:0;transition:all .15s;opacity:.55;}
.rk-tag:hover{border-color:var(--accent);opacity:1;}
.rk-tag.on{border:1px solid rgba(182,68,0,.7);background:rgba(182,68,0,.16);opacity:1;}
.task-row.is-rock{background:rgba(182,68,0,.06);}
.qp-menu{position:absolute;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px;min-width:210px;}
.qp-menu button{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:none;border-radius:7px;color:var(--text);font-family:var(--font);font-size:12.5px;padding:8px 10px;cursor:pointer;}
.qp-menu button:hover,.qp-menu button.cur{background:rgba(0,113,227,.14);}
.qp-menu .qp-act{margin-left:auto;font-family:var(--font);font-size:10px;color:var(--muted);}
.qp-menu .qp-clear{color:var(--muted);border-top:1px solid var(--border);border-radius:0 0 7px 7px;margin-top:2px;}
.wn{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;}
.wn.on{border-color:rgba(182,68,0,.55);}
.wn summary{cursor:pointer;padding:11px 14px;font-size:13px;font-weight:700;color:var(--white);list-style:none;}
.wn summary::-webkit-details-marker{display:none;}
.wn-hint{font-weight:500;font-size:11.5px;color:var(--muted);}
.wn-has{font-weight:600;font-size:11.5px;color:var(--accent);}
.man-tag{font-family:var(--font);font-size:10.5px;font-weight:600;color:var(--orange);letter-spacing:0;text-transform:none;}
.wn-body{padding:0 14px 14px;}
.wn-text{width:100%;min-height:70px;resize:vertical;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--font);font-size:13px;padding:9px 11px;outline:none;}
.wn-text:focus{border-color:var(--accent);}
.wn-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text);}
.wn-chk{display:flex;align-items:center;gap:7px;cursor:pointer;}
.wn-chk input{accent-color:var(--orange);width:16px;height:16px;}
.wn-grade input{width:64px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--white);font-family:var(--font);font-size:14px;padding:4px 6px;text-align:center;}
.wn-grade.off{opacity:.4;}
.wn-auto{font-size:11.5px;color:var(--muted);margin-left:auto;}
.wn-auto b{color:var(--accent);}
.wn-foot{font-size:10.5px;color:var(--muted);margin-top:8px;}
.rk{background:var(--card);border:1px solid rgba(182,68,0,.35);border-radius:14px;padding:14px;margin-bottom:16px;}
.rk-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.rk-title{font-size:14px;font-weight:700;color:var(--white);}
.rk-count{font-family:var(--font);font-size:11px;color:var(--orange);}
.rk-q{font-size:11.5px;color:var(--muted);margin:4px 0 10px;font-style:italic;}
.rk-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.rk-slot{display:flex;align-items:center;gap:8px;min-height:52px;border-radius:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text);}
.rk-slot.empty{border-style:dashed;color:var(--muted);opacity:.7;justify-content:center;font-size:11.5px;}
.rk-slot.done .rk-name{text-decoration:line-through;opacity:.55;}
.rk-n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;}
.rk-slot.done .rk-n{background:var(--green);}
.rk-name{flex:1;min-width:0;line-height:1.3;}
.rk-cat{display:block;font-size:10px;color:var(--muted);}
.rk-x{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0 2px;}
.rk-x:hover{color:var(--red);}
.rk-foot{font-size:11px;color:var(--muted);margin-top:8px;}

/* ── AYLIK GÖREVLER ── */
.mt-wrap{max-width:820px;margin:0 auto;}
.mt-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.mt-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.02);}
.mt-head h3{font-size:15px;font-weight:700;color:var(--white);}
.mt-count{font-family:var(--font);font-size:11px;color:var(--green);}
.mt-bar{height:4px;background:var(--border);}
.mt-bar div{height:100%;background:var(--green);transition:width .3s;}
.mt-items{padding:6px 10px;display:flex;flex-direction:column;gap:1px;}
.mt-actions{display:flex;align-items:center;gap:6px;}
.mt-toweek{background:none;border:1px solid var(--border);border-radius:7px;color:var(--accent);font-family:var(--font);font-size:11px;font-weight:600;padding:4px 8px;cursor:pointer;white-space:nowrap;}
.mt-toweek:hover{border-color:var(--accent);background:rgba(0,113,227,.1);}
.mt-inweek{font-size:11px;color:var(--green);white-space:nowrap;}
.qp-title{font-family:var(--font);font-size:10px;color:var(--muted);padding:6px 10px 4px;letter-spacing:.5px;}
.mt-item{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;}
.mt-item:hover{background:rgba(0,0,0,.03);}
.mt-item input[type=checkbox]{accent-color:var(--green);width:16px;height:16px;cursor:pointer;}
.mt-item.done .mt-text{text-decoration:line-through;opacity:.5;}
.mt-text{width:100%;min-width:0;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);font-family:var(--font);font-size:13.5px;padding:3px 0;outline:none;}
.mt-text:focus{border-bottom-color:var(--accent);}
.mt-empty{font-size:12px;color:var(--muted);opacity:.7;padding:12px 6px;}
.mt-add{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--border);}
.mt-add .mt-text{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface);}
.mt-add .mt-text:focus{border-color:var(--accent);}
.mt-carry{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(0,113,227,.07);border:1px solid rgba(0,113,227,.3);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--text);}

/* ── GÜNLÜK PLAN ── */
.dp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.dp-card{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
.dp-card.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.dp-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.02);}
.dp-day{font-size:13px;font-weight:700;color:var(--white);}
.dp-date{font-family:var(--font);font-size:11px;color:var(--muted);}
.dp-today{font-family:var(--font);font-size:9px;font-weight:700;letter-spacing:1px;color:var(--on-accent);background:var(--accent);padding:2px 7px;border-radius:10px;}
.dp-count{font-family:var(--font);font-size:11px;color:var(--green);}
.dp-dl{padding:6px 12px;font-size:11px;color:var(--orange);background:rgba(182,68,0,.07);border-bottom:1px solid var(--border);}
.dp-items{padding:6px 8px;display:flex;flex-direction:column;gap:1px;}
.dp-empty{font-size:11px;color:var(--muted);opacity:.6;padding:6px 4px;}
.dp-item{display:grid;grid-template-columns:16px 16px 50px 1fr auto;align-items:center;gap:6px;padding:4px 4px 4px 7px;border-radius:7px;}
.dp-item:hover{background:rgba(0,0,0,.03);}
.dp-item input[type=checkbox]{accent-color:var(--green);width:15px;height:15px;cursor:pointer;}
.dp-item.done .dp-text{text-decoration:line-through;opacity:.5;}
.dp-time{width:84px;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--muted);font-family:var(--font);font-size:11px;padding:2px 3px;color-scheme:light;}
.dp-time:hover,.dp-time:focus{border-color:var(--border);outline:none;}
.dp-text{width:100%;min-width:0;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);font-family:var(--font);font-size:12.5px;padding:2px 0;outline:none;}
.dp-text:focus{border-bottom-color:var(--accent);}
.dp-actions{display:flex;align-items:center;gap:2px;}
.dp-q{font-size:10px;}
.dp-n{font-family:var(--font);font-size:10px;color:var(--muted);text-align:right;}
.dp-item .dp-time{width:50px;padding:2px 0;font-size:10.5px;}
.dp-item .dp-time::-webkit-calendar-picker-indicator{display:none;}
.dp-item .dp-actions{gap:0;}
.dp-item.frog{background:rgba(31,138,60,.08);box-shadow:inset 0 0 0 1px rgba(31,138,60,.35);}
.dp-item.frog .dp-n{color:var(--green);}
.dp-mv{background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;padding:0 1px;line-height:1;}
.dp-mv:hover{color:var(--text);}
.dp-mv:disabled{opacity:.25;cursor:default;}
.dp-fr{background:none;border:none;font-size:12px;cursor:pointer;padding:0 2px;opacity:.3;filter:grayscale(1);}
.dp-fr:hover{opacity:.8;filter:none;}
.dp-fr.on{opacity:1;filter:none;}
.dp-frog-hint{padding:6px 12px;font-size:11px;color:var(--green);background:rgba(31,138,60,.06);border-bottom:1px solid var(--border);}
.dp-over{padding:4px 12px;font-size:10.5px;color:var(--orange);}
.dp-add{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:6px;padding:8px;border-top:1px solid var(--border);margin-top:auto;}
.dp-add .dp-time{border-color:var(--border);}
.dp-add .dp-text::placeholder{color:var(--muted);opacity:.6;}
.dp-from{margin:0 8px 8px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--font);font-size:11.5px;padding:0 6px;cursor:pointer;}
.dp-from:focus{outline:none;border-color:var(--accent);}
.dp-note{margin:0 8px 8px;min-height:44px;resize:vertical;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:12px;padding:7px 9px;outline:none;}
.dp-note:focus{border-color:var(--accent);}

/* ── MÜŞTERİLER (temas ritmi + reklam hafızası) ── */
.cl-wrap{max-width:1100px;margin:0 auto;}
.cl-stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.cl-stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:7px;}
.cl-stat b{font-family:var(--font);font-size:16px;color:var(--white);}
.cl-stat.red b{color:var(--red);}.cl-stat.orange b{color:var(--orange);}
.cl-grid{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:14px;align-items:start;}
@media(max-width:760px){.cl-grid{grid-template-columns:minmax(0,1fr);}.cl-grid.open .cl-listcol{display:none;}.cl-grid:not(.open) .cl-detcol{display:none;}}
.cl-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.cl-row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:11px;align-items:center;width:100%;padding:11px 12px 11px 0;background:none;border:0;border-bottom:1px solid var(--border);text-align:left;cursor:pointer;color:var(--text);font-family:var(--font);}
.cl-row:last-child{border-bottom:0;}
.cl-row:hover,.cl-row.sel{background:rgba(0,0,0,.035);}
.cl-row.sel{box-shadow:inset 0 0 0 1px rgba(0,113,227,.35);}
.cl-stripe{align-self:stretch;border-radius:0 3px 3px 0;background:var(--border);}
.cl-row.ok .cl-stripe{background:var(--green);}.cl-row.warn .cl-stripe{background:var(--orange);}.cl-row.crit .cl-stripe{background:var(--red);}
.cl-nm{font-size:13.5px;font-weight:600;color:var(--white);}
.cl-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-days{font-family:var(--font);font-size:11px;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.ok .cl-days,.cl-pill.ok{background:rgba(31,138,60,.12);color:var(--green);}
.warn .cl-days,.cl-pill.warn{background:rgba(182,68,0,.13);color:var(--orange);}
.crit .cl-days,.cl-pill.crit{background:rgba(215,0,21,.13);color:var(--red);}
.cl-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.05);color:var(--muted);}
.cl-pill.acc{background:rgba(0,113,227,.14);color:var(--accent);}
.cl-arch{padding:10px 14px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--border);}
.cl-add{display:flex;flex-wrap:wrap;gap:8px;padding:11px 12px;border-top:1px solid var(--border);}
.cl-in,.cl-ta,.cl-sel{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;}
.cl-in:focus,.cl-ta:focus,.cl-sel:focus{border-color:var(--accent);}
.cl-ta{resize:vertical;min-height:64px;line-height:1.5;}
.cl-add .cl-in{flex:1 1 130px;min-width:0;width:auto;}
.cl-empty{padding:20px 14px;font-size:12.5px;color:var(--muted);}
.cl-det{display:flex;flex-direction:column;gap:12px;}
.cl-sec{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.cl-sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.cl-sec-h h3{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.cl-title{display:flex;flex-wrap:wrap;align-items:center;gap:9px;}
.cl-title h2{font-size:19px;font-weight:700;color:var(--white);}
.cl-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);align-items:center;}
.cl-meta b{color:var(--text);font-weight:600;}
.cl-meta select{width:auto;padding:3px 6px;font-size:12px;}
.cl-actions{display:flex;flex-wrap:wrap;gap:8px;}
.cl-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;}
.cl-btn:hover{border-color:var(--accent);}
.cl-btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.cl-btn.pri:hover{filter:brightness(1.08);}
.cl-btn.ghost{background:none;border-color:transparent;color:var(--muted);}
.cl-btn.sm{padding:5px 10px;font-size:11.5px;}
.cl-back{display:none;}
@media(max-width:760px){.cl-back{display:inline-flex;}}
.cl-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;border:1px dashed var(--border);border-radius:10px;padding:11px;}
.cl-form .full{grid-column:1/-1;}
.cl-form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600;}
@media(max-width:520px){.cl-form{grid-template-columns:minmax(0,1fr);}}
.cl-ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;}
.cl-ad{border:1px solid var(--border);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:7px;background:var(--surface);min-width:0;}
.cl-ad.win{border-color:var(--green);}
.cl-ad-t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.cl-ad-t b{font-size:13px;color:var(--white);overflow-wrap:anywhere;}
.cl-ad-t select{width:auto;padding:3px 6px;font-size:11.5px;}
.cl-kv{font-size:12.5px;overflow-wrap:anywhere;color:var(--text);}
.cl-kv span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.cl-ad .cl-ta{min-height:48px;font-size:12.5px;}
.cl-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.cl-seg button{border:0;background:none;padding:5px 12px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.cl-seg button.on{background:var(--accent);color:var(--on-accent);}
.cl-ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--border);align-items:start;}
.cl-ev:first-child{border-top:0;}
.cl-ev .d{font-family:var(--font);font-size:11px;color:var(--muted);padding-top:2px;}
.cl-ev .x{font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--text);}
.cl-ev .x .cl-pill{margin-right:6px;}
.cl-todo{display:flex;flex-direction:column;gap:2px;}
.cl-todo div{font-size:13px;color:var(--text);padding:5px 0;border-top:1px solid var(--border);}
.cl-todo div:first-child{border-top:0;}
.cl-todo small{color:var(--muted);font-family:var(--font);font-size:10.5px;margin-left:6px;}
.cl-ph{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;}
.cl-hint{font-size:11.5px;color:var(--muted);}
/* Reklam penceresi (tablo + zaman çizelgesi + arşiv) */
.adm-overlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:hidden;}
.adm-box{width:100%;max-width:1000px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:0 0 18px;}
.adm-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;background:var(--card);border-bottom:1px solid var(--border);}
.adm-head-r{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.adm-crumb{font-size:11px;color:var(--muted);font-family:var(--font);margin-bottom:2px;}
.adm-title{display:block;width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--white);font-family:var(--font);font-size:20px;font-weight:700;padding:2px 0;outline:none;}
input.adm-title:hover,input.adm-title:focus{border-bottom-color:var(--border);}
.adm-x{background:var(--surface);border:1px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;}
.adm-x:hover{color:var(--white);border-color:var(--accent);}
.adm-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:14px 18px 4px;}
@media(max-width:640px){.adm-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
.adm-kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;min-width:0;}
.adm-kpi span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.04em;}
.adm-kpi b{display:block;font-family:var(--font);font-size:18px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.adm-kpi em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);}
.adm-kpi.hi{border-color:rgba(182,68,0,.45);}.adm-kpi.hi b{color:var(--orange);}
.adm-sec{margin:12px 18px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.adm-sec h3,.adm-h3{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.adm-grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 0;}
.adm-grid2 .adm-sec:first-child{margin-right:6px;}.adm-grid2 .adm-sec:last-child{margin-left:6px;}
@media(max-width:700px){.adm-grid2{grid-template-columns:minmax(0,1fr);}.adm-grid2 .adm-sec{margin-left:18px!important;margin-right:18px!important;}}
.adm-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.adm-unit{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.adm-unit select{width:auto;padding:4px 6px;font-size:12px;}
.adm-tw{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
.adm-table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
.adm-table th{position:sticky;top:0;background:#f5f5f7;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;}
.adm-table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:0;height:34px;vertical-align:middle;}
.adm-table th:last-child,.adm-table td:last-child{border-right:0;}
.adm-table tbody tr:nth-child(even) td{background:rgba(0,0,0,.015);}
.adm-table tbody tr:hover td{background:rgba(0,113,227,.06);}
.adm-table input{width:100%;height:33px;background:transparent;border:0;outline:none;color:var(--text);font-family:var(--font);font-size:13px;padding:0 8px;}
.adm-table input.num{font-family:var(--font);text-align:right;}
.adm-table input:focus{background:rgba(0,113,227,.12);box-shadow:inset 0 0 0 2px var(--accent);}
.adm-table input[type=date]{color-scheme:light;font-family:var(--font);font-size:12px;}
.adm-table td.calc{font-family:var(--font);text-align:right;padding:0 8px;color:var(--text);white-space:nowrap;}
.adm-table td.calc.hi{color:var(--orange);font-weight:600;}
.adm-table td .btn-icon{width:100%;height:33px;}
.adm-table tfoot td{background:#f5f5f7;font-weight:700;color:var(--white);padding:0 8px;font-size:12px;}
.adm-table.ro td{padding:8px;height:auto;}
.adm-table.ro td.wrap{white-space:normal;color:var(--text);font-size:12.5px;line-height:1.45;}
.adm-table tr.click{cursor:pointer;}
.adm-empty{padding:16px 10px!important;color:var(--muted);font-size:12.5px;white-space:normal;}
.adm-chart{width:100%;height:150px;display:block;}
.adm-chart text{fill:var(--muted);font-size:10px;font-family:var(--font);}
.adm-legend{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.adm-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px;}
.adm-lbl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600;}
.adm-lbl .cl-ta{min-height:54px;}
.adm-tl{display:flex;flex-direction:column;border-left:2px solid var(--border);margin-left:5px;padding-left:12px;gap:9px;}
.adm-ev{position:relative;display:flex;flex-direction:column;gap:1px;font-size:12.5px;}
.adm-ev::before{content:'';position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--accent);}
.adm-ev.now::before{background:var(--orange);border-color:var(--orange);}
.adm-ev .d{font-family:var(--font);font-size:10.5px;color:var(--muted);}
.adm-ev .x{color:var(--text);overflow-wrap:anywhere;}
.adm-state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.adm-state select{width:auto;}
.adm-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:auto;padding-top:6px;}
.adm-closed{margin:12px 18px 0;border:1px solid rgba(182,68,0,.4);background:rgba(182,68,0,.06);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--orange);}
.adm-closed.open{border-color:var(--accent);background:rgba(0,113,227,.06);color:var(--accent);}
/* Müşteri penceresindeki reklam kartları */
.cl-ad.click{cursor:pointer;transition:border-color .15s;}
.cl-ad.click:hover{border-color:var(--accent);}
.cl-ad-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
.cl-ad-stats div{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:5px 7px;min-width:0;}
.cl-ad-stats span{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.cl-ad-stats b{display:block;font-family:var(--font);font-size:12.5px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-ad-open{font-size:11px;color:var(--accent);font-weight:600;}
.cl-arc{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.cl-arc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 11px;border-top:1px solid var(--border);cursor:pointer;background:var(--surface);}
.cl-arc-row:first-child{border-top:0;}
.cl-arc-row:hover{background:rgba(0,113,227,.06);}
.cl-arc-row b{font-size:12.5px;color:var(--text);}
.cl-arc-row .m{font-family:var(--font);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;}
.cl-arc-row .n{grid-column:1/-1;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Günlük Plan: müşteri küçük işleri */
.dp-small{border-top:1px solid var(--border);padding:8px 12px 10px;background:rgba(182,68,0,.04);}
.dp-small-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin-bottom:4px;display:flex;justify-content:space-between;}
.dp-small-h span{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;}
.dp-job{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;color:var(--text);}
.dp-job .jt{flex:1;min-width:0;cursor:pointer;}
.dp-job .jt:hover{color:var(--white);text-decoration:underline;}
.dp-job.done .jt{text-decoration:line-through;opacity:.5;}
.dp-job .jd{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dp-job button{border:1px solid var(--border);background:var(--surface);color:var(--green);border-radius:6px;padding:3px 8px;font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.dp-job button:hover{border-color:var(--green);}
.temas-bonus{font-size:10.5px;color:var(--orange);font-family:var(--font);}

/* ── AY HEDEFLERİ / DEĞERLENDİRME ── */
.mo-wrap{max-width:820px;margin:0 auto;}
.mo-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.mo-card h3{font-size:16px;font-weight:700;color:var(--white);margin-bottom:10px;}
.mo-prompts{margin:0 0 12px 18px;font-size:12.5px;color:var(--muted);line-height:1.8;}
.mo-text{width:100%;min-height:280px;resize:vertical;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:14px;line-height:1.65;padding:14px 16px;outline:none;}
.mo-text:focus{border-color:var(--green);}
.mo-saved{font-family:var(--font);font-size:10px;color:var(--muted);margin-top:6px;}
.mo-ref{background:rgba(31,138,60,.05);border-color:rgba(31,138,60,.25);}
.mo-ref h3{font-size:13px;color:var(--green);}
.mo-ref-text{white-space:pre-wrap;font-size:13px;color:var(--text);line-height:1.6;}
.mo-stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--muted);}
.mo-stats b{color:var(--accent);}

@media(max-width:600px){
  .score-row{grid-template-columns:repeat(2,1fr);}
  .week-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}
  .wsn-btn{min-width:calc(50% - 3px);font-size:12px;padding:9px 8px;}
  .rk-slots{grid-template-columns:1fr;}
  .dp-grid{grid-template-columns:1fr;}
}

/* ══════════════════════════════════════════════════════════
   APPLE STORE DİLİ — açık gri zemin, gölgeli beyaz kartlar, iki tonlu başlıklar,
   yana kayan raflar, hap butonlar, buzlu cam menüler. (Önceki kuralların üstüne yazar.)
══════════════════════════════════════════════════════════ */
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.47;letter-spacing:-.011em;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding-bottom:100px;}
::selection{background:rgba(0,113,227,.2);}
button,input,select,textarea{font-family:var(--font);}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,113,227,.35)!important;}

/* Üst menü çubuğu (buzlu cam, sabit) */
.data-bar{position:sticky;top:0;z-index:900;display:block;padding:0 22px;background:rgba(250,250,252,.8);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);}
.gn-inner{max-width:1056px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.gn-brand{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--text);white-space:nowrap;}
.gn-brand span{color:var(--muted);font-weight:500;}
.gn-links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
.gn-links::-webkit-scrollbar{display:none;}
.btn-export,.btn-export.blue,.btn-export.green,.btn-export.red{background:none!important;border:0!important;color:var(--text)!important;opacity:.8;
  font-size:12.5px;font-weight:400;padding:6px 10px;border-radius:980px;white-space:nowrap;}
.btn-export:hover{opacity:1;background:rgba(0,0,0,.05)!important;}
.btn-export.red{color:var(--red)!important;}

/* Başlık (iki tonlu) */
.hero{background:none;border:0;padding:56px 22px 18px;text-align:left;overflow:visible;}
.hero::before{display:none;}
.hero-inner{max-width:1056px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px 48px;flex-wrap:wrap;}
.hero h1{flex:1 1 520px;max-width:720px;font-size:clamp(34px,5.4vw,56px);line-height:1.07;font-weight:600;letter-spacing:-.025em;color:var(--text);margin:0;}
.hero h1 span{color:var(--muted);}
.hero-side{display:flex;flex-direction:column;gap:10px;min-width:220px;padding-bottom:6px;}
.hero-stat{background:none;border:0;padding:0;font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:8px;border-radius:0;}
.hero-stat strong{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.02em;}

/* Çeyrek rafı: ikon + etiket */
.q-tabs{max-width:1100px;margin:0 auto;padding:22px 12px 6px;justify-content:flex-start;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
.q-tabs::-webkit-scrollbar{display:none;}
.q-tab{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:104px;padding:12px 10px 10px;border:0;border-radius:16px;background:none;
  color:var(--text);font-size:13px;font-weight:500;transition:background .2s,transform .2s;}
.q-tab .qi{font-size:34px;line-height:1;filter:saturate(1.1);transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.q-tab:hover{background:rgba(0,0,0,.04);color:var(--text);border:0;}
.q-tab:hover .qi{transform:translateY(-2px) scale(1.06);}
.q-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow);}
.q-tab.active .ql{color:var(--accent);font-weight:600;}

/* Hafta rafı (yana kayan kartlar) */
.week-selector-wrap{padding:30px 22px 0;}
.week-selector-label{font-size:clamp(20px,2.4vw,28px);font-weight:600;letter-spacing:-.02em;color:var(--muted);text-transform:none;margin-bottom:14px;line-height:1.15;}
.week-selector-label b{color:var(--text);font-weight:600;}
.week-grid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:22px;padding:6px 22px 22px;margin:0 -22px;scrollbar-width:none;}
.week-grid::-webkit-scrollbar{display:none;}
.week-btn{flex:0 0 138px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;height:112px;
  padding:16px;border:0;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow);color:var(--text);text-align:left;
  font-size:13px;transition:transform .3s cubic-bezier(0,0,.5,1),box-shadow .3s cubic-bezier(0,0,.5,1);}
.week-btn:hover{transform:scale(1.02);box-shadow:var(--shadow-hover);border:0;color:var(--text);}
.week-btn .wlabel{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-bottom:auto;}
.week-btn .wdate{font-size:12px;color:var(--muted);opacity:1;margin:0;}
.week-btn .wpct{font-size:12px;font-weight:600;color:var(--green);margin:0;}
.week-btn.active{background:#1d1d1f;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.22);}
.week-btn.active .wdate{color:rgba(255,255,255,.65);}
.week-btn.active .wpct{color:#6ee08a;}

/* İçerik alanı */
.container{padding:8px 22px 28px;}
.week-header-bar{margin:6px 0 22px;align-items:flex-end;}
.week-title{font-size:clamp(26px,3.4vw,40px);font-weight:600;letter-spacing:-.025em;line-height:1.1;}
.week-title span{color:var(--muted);}
.week-header-bar [style*="font-size:11px"]{font-size:13px!important;letter-spacing:0;}

/* Kartlar: beyaz, kenarlıksız, yumuşak gölge */
.score-card,.task-table,.chart-card,.dp-card,.mt-card,.cl-panel,.cl-sec,.rk,.wn,.sub-intro,.dl-legend,.cat-editor,
.add-cat-btn,.mt-carry,.settings-info,.copy-notice,.year-cell,.cl-stat,.adm-sec,.adm-kpi{
  border-color:transparent;border-radius:var(--r-card);box-shadow:var(--shadow);background:var(--card);}
.score-card{padding:20px 18px;text-align:left;transition:transform .3s cubic-bezier(0,0,.5,1),box-shadow .3s cubic-bezier(0,0,.5,1);}
.score-card:hover{transform:scale(1.015);box-shadow:var(--shadow-hover);}
.score-card.accent,.score-card.hero-score{background:var(--card);border-color:transparent;}
.score-card.hero-score{background:#1d1d1f;}
.score-card.hero-score .sc-label,.score-card.hero-score .sc-sub{color:rgba(255,255,255,.65);}
.score-card.hero-score .sc-val{color:#fff!important;}
.sc-label{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted);margin-bottom:10px;}
.sc-val{font-size:34px;font-weight:600;letter-spacing:-.03em;color:var(--text);}
.score-card.accent .sc-val{color:var(--accent);}
.sc-sub{font-size:12px;}
.score-row{gap:14px;margin-bottom:22px;}
.pill{font-size:11px;padding:3px 10px;border-radius:980px;}

/* Bölüm başlıkları: büyük harf yerine düz, sakin etiket */
.dh-span,.chart-card h3,.cl-sec-h h3,.adm-sec h3,.adm-h3,.cl-arch,.tile .lbl{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--muted);}
.chart-card h3{font-size:15px;color:var(--text);margin-bottom:16px;}

/* Görev tablosu */
.task-table{overflow:hidden;margin-bottom:18px;}
.cat-header{padding:14px 18px;font-size:15px;font-weight:600;letter-spacing:-.01em;}
.cat-dot{width:10px;height:10px;}
.tgt-badge{border-radius:980px;padding:3px 10px;font-size:12px;font-weight:600;}
.day-headers{background:#fafafc;border-bottom:1px solid var(--hair);padding:8px 18px;}
.task-row{border-top:1px solid var(--hair);padding:8px 18px;}
.task-row:hover{background:#fafafc;}
.task-name{font-size:14px;}
.day-input{border-radius:9px;border:1px solid transparent;background:#f2f2f5;height:32px;width:32px;font-size:14px;}
.day-input:hover{border-color:var(--border);}
.day-input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.2);}
.day-input.done{background:rgba(52,199,89,.16);border-color:transparent;color:var(--green);font-weight:600;}
.day-input.partial{background:rgba(255,149,0,.16);border-color:transparent;color:var(--orange);font-weight:600;}
.gain{background:rgba(52,199,89,.12);border:0;color:var(--green);border-radius:980px;}
.gain.got{background:transparent;}
.dl-badge,.free-badge{border-radius:980px;}
.progress-bar-bg{height:8px;background:#e8e8ed;border-radius:980px;}
.progress-bar-fill{background:var(--accent);border-radius:980px;}
.rk-tag{border-radius:980px;}
.rk-n{color:#fff;}

/* Butonlar: hap biçimi */
.btn-copy,.btn-add,.btn-primary,.btn-secondary,.btn-danger-out,.cl-btn,.mt-toweek,.dp-job button,.adm-x{border-radius:980px;}
.btn-copy{background:#e8e8ed;border:0;color:var(--text);font-size:13px;padding:8px 16px;font-weight:500;}
.btn-copy:hover{background:#dcdce1;}
.btn-add{background:var(--accent);border:0;color:#fff;padding:6px 14px;font-size:12.5px;font-weight:500;}
.btn-add:hover{background:#0077ed;}
.btn-primary{padding:11px 22px;font-size:15px;font-weight:500;}
.btn-primary:hover{opacity:1;background:#0077ed;}
.btn-secondary{background:#e8e8ed;border:0;font-size:15px;}
.btn-secondary:hover{background:#dcdce1;color:var(--text);}
.cl-btn{background:#e8e8ed;border:0;color:var(--text);font-weight:500;padding:8px 15px;}
.cl-btn:hover{background:#dcdce1;border:0;}
.cl-btn.pri{background:var(--accent);color:#fff;}
.cl-btn.pri:hover{background:#0077ed;filter:none;}
.cl-btn.ghost{background:none;color:var(--accent);}
.cl-btn.ghost:hover{background:rgba(0,113,227,.08);}
.mt-toweek{border:0;background:rgba(0,113,227,.1);}
.dp-job button{background:rgba(31,138,60,.1);border:0;}

/* Form alanları */
.cl-in,.cl-ta,.cl-sel,.wn-text,.dp-note,.dp-from,.small-num,.dl-select,.modal-textarea,.mt-add .mt-text{
  background:#fff;border:1px solid var(--border);border-radius:12px;color:var(--text);}
.cl-in:focus,.cl-ta:focus,.cl-sel:focus,.wn-text:focus,.dp-note:focus,.dp-from:focus,.small-num:focus,.modal-textarea:focus,.mt-add .mt-text:focus{
  border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.18);}

/* Alt sekme çubuğu: buzlu cam + siyah seçili hap */
.week-subnav{bottom:18px;padding:6px;gap:4px;border:0;border-radius:980px;background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);max-width:860px;}
.wsn-btn{border:0;background:none;color:var(--text);border-radius:980px;font-size:13px;font-weight:500;padding:10px 14px;min-width:0;}
.wsn-btn:hover{background:rgba(0,0,0,.05);border:0;color:var(--text);}
.wsn-btn.active{background:#1d1d1f;color:#fff;}
.wsn-btn.month{color:var(--green);border:0;}
.wsn-btn.month.active{background:var(--green);color:#fff;}
@media(max-width:700px){.week-subnav{border-radius:24px;}.wsn-btn{flex:1 1 45%;}}

/* Alt sayfalar */
.sub-intro{font-size:14px;line-height:1.55;padding:16px 18px;}
.sub-intro b{color:var(--text);}
.sub-hint{font-size:13px;color:var(--accent);margin-top:4px;}
.rk{border:0;}
.rk-title,.wn summary,.mt-head h3{font-size:17px;letter-spacing:-.02em;}
.rk-slot{background:#f5f5f7;border:0;border-radius:14px;}
.rk-slot.empty{background:none;border:1.5px dashed var(--border);}
.wn.on{box-shadow:var(--shadow),0 0 0 2px rgba(182,68,0,.35);}
.mt-head,.dp-head{background:none;border-bottom:1px solid var(--hair);}
.mt-head{padding:16px 18px;}
.dp-card.today{box-shadow:var(--shadow),0 0 0 2px var(--accent);}
.dp-day{font-size:15px;}
.dp-item:hover,.mt-item:hover{background:#f5f5f7;}
.dp-add,.mt-add,.cl-add{border-top:1px solid var(--hair);}
.dp-small{background:#fff8f2;border-top:1px solid var(--hair);}

/* Müşteriler */
.cl-row{border-bottom:1px solid var(--hair);padding:13px 14px 13px 0;}
.cl-row:hover{background:#fafafc;}
.cl-row.sel{background:rgba(0,113,227,.06);box-shadow:none;}
.cl-nm{font-size:15px;}
.cl-title h2{font-size:26px;letter-spacing:-.02em;}
.cl-stat{padding:10px 16px;font-size:13px;}
.cl-stat b{font-size:20px;}
.cl-ad,.cl-arc{background:#f5f5f7;border:0;border-radius:14px;}
.cl-ad.win{box-shadow:0 0 0 2px rgba(31,138,60,.5);}
.cl-ad.click:hover{box-shadow:var(--shadow-hover);border:0;}
.cl-ad-stats div{background:#fff;border:0;border-radius:10px;}
.cl-arc-row{background:#fff;border-top:1px solid var(--hair);}
.cl-pill{border-radius:980px;}
.cl-seg{border:0;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;}
.cl-seg button{border-radius:7px;color:var(--text);}
.cl-seg button.on{background:#fff;color:var(--text);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);}

/* Pencereler */

<script>
/* ══════════════════════════════════════════════════════════
   WEEK GENERATION — Start: 23 Feb 2026 (Monday)
══════════════════════════════════════════════════════════ */
const START = new Date(2026,1,23); // Feb=1
const DAYS_SHORT = ['Pzt','Sal','Çar','Per','Cum','Cts','Paz'];
const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(d){return `${d.getDate()} ${MONTHS_TR[d.getMonth()]}`;}
function fmtDateShort(d){return `${d.getDate()}/${d.getMonth()+1}`;}

// Generate all weeks of 2026 starting from 23 Feb
const WEEKS = [];
let cur = new Date(START);
let wNum = 1;
const END_OF_YEAR = new Date(2026,11,31);
while(cur <= END_OF_YEAR) {
  const mon = new Date(cur);
  const sun = addDays(cur,6);
  WEEKS.push({
    idx: WEEKS.length,
    num: wNum++,
    mon, sun,
    label: `H${WEEKS.length+1}`,
    dateLabel: `${fmtDate(mon)} – ${fmtDate(sun)}`,
    shortLabel: `${fmtDateShort(mon)}`,
    month: mon.getMonth(),
    quarter: Math.floor(mon.getMonth()/3),
  });
  cur = addDays(cur,7);
}

// Quarter groupings (by actual quarter of start month)
// Q1=Feb-Mar(0-1 but starts Feb), Q2=Apr-Jun, Q3=Jul-Sep, Q4=Oct-Dec
const Q_LABELS = ['Şub–Mar','Nis–Haz','Tem–Eyl','Eki–Ara'];
const Q_WEEKS = [
  WEEKS.filter(w=>w.month<=2),   // Feb,Mar (month 1,2)
  WEEKS.filter(w=>w.month>=3&&w.month<=5),
  WEEKS.filter(w=>w.month>=6&&w.month<=8),
  WEEKS.filter(w=>w.month>=9),
];

/* ══════════════════════════════════════════════════════════
   DEFAULT CATEGORIES (template)
══════════════════════════════════════════════════════════ */
const DEFAULT_CATS = [
  {name:'Dijital Pazarlama',color:'#4c9be8',target:10,tasks:[
    {name:'Müşteri Analizi & Raporlama',pts:2,sessions:1},

  {name:'YouTube Kanalı',color:'#f38ba8',target:9,tasks:[

  {name:'AI Influencer',color:'#57c97a',target:6,tasks:[

/* ══════════════════════════════════════════════════════════

   weekCats[weekIdx] = cats array (independent per week)
   weekData[weekIdx][ci][ti][di] = 0|1
══════════════════════════════════════════════════════════ */

// ── SUPABASE SYNC ──
const SB_URL = 'https://luiukheidcnyyqkblgzx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1aXVraGVpZGNueXlxa2JsZ3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NTgyMDIsImV4cCI6MjA4NzUzNDIwMn0.zqjStSUJHrY6Ed_TTyb0ujeYmfkXfLtbpmNWrW0Npi8';

async function sbGet(key) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/performans?key=eq.${encodeURIComponent(key)}&select=value&limit=1`, {
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json'
      }
    });
    if(!r.ok) { console.error('sbGet error', r.status, await r.text()); return null; }
    const d = await r.json();
    return d && d[0] ? JSON.parse(d[0].value) : null;
  } catch(e) { console.error('sbGet exception', e); return null; }
}

async function sbSet(key, value) {
  try {
    const body = JSON.stringify({key: key, value: JSON.stringify(value)});
    // keepalive: sayfa kapanırken de istek tamamlanabilsin (tarayıcı limiti ~64KB)
    const keepalive = body.length < 60000;
    // First try to delete existing, then insert
    await fetch(`${SB_URL}/rest/v1/performans?key=eq.${encodeURIComponent(key)}`, {
      method: 'DELETE',
      keepalive,
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY
      }
    });
    const r = await fetch(`${SB_URL}/rest/v1/performans`, {
      method: 'POST',
      keepalive,
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body
    });
    if(!r.ok) { console.error('sbSet error', r.status, await r.text()); }
    else { console.log('sbSet ok:', key); }
  } catch(e) { console.error('sbSet exception', e); }
}

async function syncFromCloud() {
  toast('☁️ Senkronize ediliyor...');
  const wc = await sbGet('wc26');
  const wd = await sbGet('wd26');
  const wp = await sbGet('wp26');

  if(wc && !_dirty.has('wc26')) { weekCats = wc; localStorage.setItem('wc26', JSON.stringify(wc)); }
  if(wd && !_dirty.has('wd26')) { weekData = wd; localStorage.setItem('wd26', JSON.stringify(wd)); }
  if(wp && !_dirty.has('wp26')) { weekPlan = wp; localStorage.setItem('wp26', JSON.stringify(wp)); }
  if(mn && !_dirty.has('mn26')) { monthNotes = mn; localStorage.setItem('mn26', JSON.stringify(mn)); }
  if(mt && !_dirty.has('mt26')) { monthTasks = mt; localStorage.setItem('mt26', JSON.stringify(mt)); }
  if(cl && cl.clients && !_dirty.has('cl26')) { clientsData = cl; localStorage.setItem('cl26', JSON.stringify(cl)); }
  if(rd && rd.drafts && !_dirty.has('rd26')) { reportDrafts = rd; localStorage.setItem('rd26', JSON.stringify(rd)); }
  if(wc || wd || wp || mn || mt || cl || rd) {
    if(currentQ < 4 && document.getElementById('app')) { renderWeekSelector(currentQ); renderWeek(currentWI); }
    toast('✅ Senkronize edildi!');
  }
  else { toast('⚠️ Bulutta veri yok'); }
}

// Sadece değişen anahtarlar buluta gönderilir
const _dirty = new Set();
const CLOUD_KEYS = {
  wc26: () => weekCats,
  wd26: () => weekData,
  wp26: () => weekPlan,
  mn26: () => monthNotes,
  mt26: () => monthTasks,
  cl26: () => clientsData,
  rd26: () => reportDrafts,
};
let _saveTimer = null;
async function flushCloud() {
  const keys = [..._dirty];
  if (!keys.length) return;
  _dirty.clear();
  console.log('saveToCloud başlıyor...', keys);
  for (const k of keys) await sbSet(k, CLOUD_KEYS[k]());
  console.log('saveToCloud bitti');
}
function saveToCloud() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(flushCloud, 1500);
}
// Sekme kapanırken / telefonda başka uygulamaya geçilirken bekleyen kaydı hemen gönder
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { clearTimeout(_saveTimer); flushCloud(); }
});

let weekCats = JSON.parse(localStorage.getItem('wc26') || 'null') || {};
let weekData = JSON.parse(localStorage.getItem('wd26') || 'null') || {};
// weekPlan[weekIdx] = { rocks: ["Kategori::Görev" x≤3], matrix: {...eski, kullanılmıyor}, days: [ {items:[{id,text,time,done,ref}], note, frog:id} x7 ] }
let weekPlan = JSON.parse(localStorage.getItem('wp26') || 'null') || {};
// monthNotes["2026-10"] = { goal, review }
let monthNotes = JSON.parse(localStorage.getItem('mn26') || 'null') || {};
// monthTasks["2026-10"] = [ {id, text, done} ] — puansız, ayın tüm haftalarında aynı liste
let monthTasks = JSON.parse(localStorage.getItem('mt26') || 'null') || {};

/* ══════════════════════════════════════════════════════════
   MÜŞTERİLER — temas ritmi, reklam hafızası, aylık rapor (Marka Assist)
   clientsData = { clients: { id: { id, name, sector, status:'aktif'|'arsiv', rhythmDays, currentStatus,
                   statusUpdated, createdAt, ads:[{id,name,startedAt,why,expectation,state,result,createdAt}],
                   notes:[{id,kind:'temas'|'not'|'rapor',date,channel,text,createdAt}] } } }
   Son temas ve aylık rapor durumu ayrı alan değil; kayıt geçmişinden hesaplanır.
══════════════════════════════════════════════════════════ */
const TEMAS_PTS = 0.5;   // her temas/rapor kaydı (müşteri başına günde 1) haftaya bu kadar puan ekler
const CL_STATE = {kazanan:'Kazanan', test:'Test', durdu:'Durduruldu'};
const CL_KIND = {temas:'Temas', not:'Not', rapor:'Rapor'};
const CL_CHANNELS = ['WhatsApp', 'Telefon', 'Toplantı', 'E-posta'];

function clSeed() {
  const c = (id, name, sector, i) => [id, {id, name, sector, status:'aktif', rhythmDays:4, currentStatus:'', statusUpdated:'',
    createdAt: 1761300000000 + i, ads:[], notes:[]}];
  const clients = Object.fromEntries([
    c('psk-nehir', 'Psk. Nehir', 'Psikoloji', 0),
    c('imer-dogalgaz', 'İmer Doğalgaz', 'Doğalgaz / kombi', 1),
    c('fatma-togrul', 'Fatma Toğrul', 'Sağlık', 2),
    c('dyt-zeynep-oz', 'Dyt. Zeynep Öz', 'Diyetisyen', 3),
    c('centrum', 'Centrum', 'Tüp bebek', 4),
    c('dr-nuran', 'Dr. Nuran', 'Medikal estetik', 5),
    c('superdoc', 'Superdoc', 'Fitoterapi', 6),
    c('butik-sude-eksi', 'Butik Sude Ekşi', 'E-ticaret giyim', 7),
    c('dyt-asli-akturk', 'Dyt. Aslı Aktürk', 'Diyetisyen', 8),
  ]);
  const ad = (cid, name, startedAt, why) => clients[cid].ads.push({id:newId(), name, startedAt, why, expectation:'', state:'test', result:'', createdAt:Date.now()});
  ad('dr-nuran', 'Takipçi amaçlı reklam', '2026-10-22', 'Takipçi artışı');
  ad('psk-nehir', 'Kurum anlaşmaları reklamları', '2026-10-21', 'Kurum anlaşmalarını duyurmak');
  ad('butik-sude-eksi', 'Ekim satış kampanyası', '2026-10-01', 'Satış');
  ad('superdoc', 'WhatsApp mesaj kampanyası', '2026-10-01', 'WhatsApp üzerinden hasta mesajı');
  return {clients};
}
// Yerelde kayıt yoksa başlangıç verisi bellekte kurulur ama buluta gönderilmez:
// başka cihazda girilmiş müşteri kayıtları açılıştaki senkronla gelir, üzerine yazılmaz.
let clientsData = JSON.parse(localStorage.getItem('cl26') || 'null') || clSeed();

function saveClients() {
  try {
    localStorage.setItem('cl26', JSON.stringify(clientsData));
    _dirty.add('cl26');
    saveToCloud();
  } catch(e) { toast('⚠️ Depolama dolu, eski veriler silinebilir'); }
}

const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const clToday = () => isoDay(new Date());
const clMonthKey = () => clToday().slice(0, 7);
const clParse = iso => { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const clFmt = iso => { const d = clParse(iso); return d ? `${d.getDate()} ${MONTHS_TR[d.getMonth()].slice(0, 3)}` : '—'; };
const clDaysSince = iso => { const d = clParse(iso); return d ? Math.round((clParse(clToday()) - d) / 86400000) : null; };

function clAll() { return Object.values(clientsData.clients || {}); }
function clGet(id) { return (clientsData.clients || {})[id]; }
function clActive() { return clAll().filter(c => c.status !== 'arsiv'); }
// Son temas: tarihi en yeni temas/rapor kaydı ("not" saymaz)
function clLast(c) {
  let best = null;
  for (const n of c.notes || []) if (n.kind !== 'not' && (!best || n.date > best.date || (n.date === best.date && n.createdAt > best.createdAt))) best = n;
  return best;
}
function clReportDone(c) { const mk = clMonthKey(); return (c.notes || []).some(n => n.kind === 'rapor' && (n.date || '').startsWith(mk)); }
function clHealth(c) {
  const r = Number(c.rhythmDays) || 4, last = clLast(c), d = last ? clDaysSince(last.date) : null;
  if (d === null) return {cls:'crit', label:'Kayıt yok', rank:9999};
  if (d < r) return {cls:'ok', label:d === 0 ? 'Bugün' : d + ' gün', rank:d};
  if (d < r + 3) return {cls:'warn', label:d + ' gün', rank:1000 + d};
  return {cls:'crit', label:d + ' gün', rank:2000 + d};
}
function clSorted(list) {
  return [...list].sort((a, b) => clHealth(b).rank - clHealth(a).rank || a.name.localeCompare(b.name, 'tr'));
}

// Haftaya eklenen temas puanı: o haftanın günlerinde temas/rapor kaydı olan (müşteri, gün) çifti başına 0,5
function temasCount(wi) {
  if (!WEEKS[wi]) return 0;
  const from = isoDay(WEEKS[wi].mon), to = isoDay(addDays(WEEKS[wi].mon, 6));
  let n = 0;
  for (const c of clAll()) {
    const days = new Set((c.notes || []).filter(x => x.kind !== 'not' && x.date >= from && x.date <= to).map(x => x.date));
    n += days.size;
  }
  return n;
}
function temasBonus(wi) { return +(temasCount(wi) * TEMAS_PTS).toFixed(2); }

// "Müşteri | iş" görevlerini müşteriyle eşle (ünvanlar ve noktalama yok sayılır)
function clNorm(s) {
  return String(s || '').toLocaleLowerCase('tr').replace(/\b(dr|dyt|psk|op|uzm|dkt|prof|doç)\./g, ' ')
    .replace(/[^a-z0-9ğüşıöç ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function clMatches(prefix, c) {
  const a = clNorm(prefix), b = clNorm(c.name);
  return !!a && !!b && (a === b || a.includes(b) || b.includes(a));
}
function clPendingTasks(c, wi) {
  const out = [];
  weekTasks(wi).forEach(t => {
    const i = t.name.indexOf('|');
    if (i > 0 && !t.done && clMatches(t.name.slice(0, i), c)) out.push({text:t.name.slice(i + 1).trim(), src:t.cat});
  });
  (monthTasks[monthRole(wi).key] || []).forEach(t => {
    const i = t.text.indexOf('|');
    if (i > 0 && !t.done && clMatches(t.text.slice(0, i), c)) out.push({text:t.text.slice(i + 1).trim(), src:MONTHS_TR[monthRole(wi).month] + ' görevi'});
  });
  return out;
}

let clSel = null;          // açık müşteri
let clKindSel = 'temas';   // kayıt formunun türü
let clAdOpen = false;

function buildClientsView(wi) {
  const act = clActive(), arch = clAll().filter(c => c.status === 'arsiv');
  if (clSel && !clGet(clSel)) clSel = null;
  const late = act.filter(c => clHealth(c).cls !== 'ok').length;
  const rep = act.filter(c => !clReportDone(c)).length;
  const mn = MONTHS_TR[new Date().getMonth()];
  const row = c => {
    const h = clHealth(c);
    return `<button class="cl-row ${h.cls} ${clSel === c.id ? 'sel' : ''}" onclick="clOpen('${esc(c.id)}')">
      <span class="cl-stripe"></span>

      <span class="sub-hint">Temas zamanı gelenler Günlük Plan'da bugünün kartına küçük iş olarak düşer. Kayıtlara hasta adı / kişisel veri yazma.</span></div>
    <div class="cl-stats">
      <div class="cl-stat"><b>${act.length}</b>aktif müşteri</div>
      <div class="cl-stat ${late ? 'red' : ''}"><b>${late}</b>temas zamanı gelen</div>
      <div class="cl-stat ${rep ? 'orange' : ''}"><b>${rep}</b>${mn} raporu bekleyen</div>
      <div class="cl-stat"><b>${nf(temasBonus(wi))}</b>bu hafta temas puanı</div>
    </div>
    <div class="cl-grid ${clSel ? 'open' : ''}">
      <div class="cl-listcol"><div class="cl-panel">${list}
        <div class="cl-add">
          <input class="cl-in" id="cl-new-name" placeholder="Yeni müşteri adı" onkeydown="if(event.key==='Enter')clAddClient()">
          <input class="cl-in" id="cl-new-sector" placeholder="Sektör" onkeydown="if(event.key==='Enter')clAddClient()">
          <button class="cl-btn" onclick="clAddClient()">Müşteri ekle</button>
        </div></div></div>
      <div class="cl-detcol">${clSel ? buildClientDetail(clGet(clSel), wi) : '<div class="cl-panel cl-ph">Soldan bir müşteri seç. Penceresinde güncel durum, reklamlar, kayıt geçmişi ve mesaj taslağı açılır.</div>'}</div>
    </div>
  </div>`;
}

  const id = esc(c.id), mn = MONTHS_TR[new Date().getMonth()];

  const order = {kazanan:0, test:1, durdu:2};

      <div class="cl-sec-h"><h3>Reklamlar</h3><div class="cl-actions">
        ${arc.length ? `<button class="cl-btn sm" onclick="adArchiveOpen('${id}')">🗄 Arşiv (${arc.length})</button>` : ''}
        <button class="cl-btn sm" onclick="clAdOpen=!clAdOpen;rerenderView()">${clAdOpen ? 'Vazgeç' : 'Reklam ekle'}</button></div></div>
      ${clAdOpen ? `<div class="cl-form">
        <label>Reklam adı<input class="cl-in" id="cl-ad-name" placeholder="Ör. Kasım randevu kampanyası"></label>
        <label>Başlangıç<input class="cl-in" type="date" id="cl-ad-start" value="${clToday()}"></label>
        <label class="full">Neden kurduk<textarea class="cl-ta" id="cl-ad-why" placeholder="Hangi ihtiyaç için kuruldu?"></textarea></label>
        <label class="full">Ne bekliyoruz<textarea class="cl-ta" id="cl-ad-exp" placeholder="Hedef: ör. haftada 20 mesaj, mesaj başı 250 TL altı"></textarea></label>
